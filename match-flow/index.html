  ctx.save();
  rrect(ctx, bx+1, by+1, bw-2, bh-2, (bh-2)/2); ctx.clip();
  let segX = bx+1;
  for (let d=0; d<fig.layerTotal.length; d++) {
    const segW = (bw-2) * fig.layerTotal[d] / fig.total;
    const col = TILE_COLORS[fig.layerColor[d]];
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = col[1];
    ctx.fillRect(segX, by+1, segW, bh-2);
    ctx.globalAlpha = 1;
    const done = (fig.layerTotal[d] - fig.layerLeft[d]) / fig.layerTotal[d];
    if (done > 0) {
      const lg = ctx.createLinearGradient(0, by, 0, by+bh);
      lg.addColorStop(0, col[0]); lg.addColorStop(1, col[1]);
      ctx.fillStyle = lg;
      ctx.fillRect(segX, by+1, segW*Math.min(1,done), bh-2);
    }
    segX += segW;
  }
  // glass shine across the bar
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  rrect(ctx, bx+3, by+1.5, bw-6, bh*0.38, bh*0.19); ctx.fill();
  ctx.restore();
  rrect(ctx, bx, by, bw, bh, bh/2);
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1; ctx.stroke();
  // pulsing swatch showing which color peels the current layer
  const cur = fig.layerLeft.findIndex(n => n > 0);
  if (cur >= 0) {
    const pl = 1 + Math.sin(lastT/220)*0.12;
    ctx.fillStyle = TILE_COLORS[fig.layerColor[cur]][0];
    ctx.beginPath(); ctx.arc(bx - 14, by + bh/2, 5*pl, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(bx - 14, by + bh/2, 7.5*pl, 0, 7); ctx.stroke();
  }
}

function drawTimer() {
  if (!L.cell) return;
  const cx = W/2, cy = L.top + 30;
  const frac = Math.max(0, Math.min(1, timeLeft / GAME_TIME));
  const low = timeLeft > 0 && timeLeft <= 10.5;
  const mid = timeLeft <= 30.5;
  const pulse = low ? 1 + Math.sin(lastT/110)*0.06 : 1;
  const w = 96*pulse, h = 27*pulse, x = cx - w/2, y = cy - h/2;
  const col = low ? '#ff8f8f' : mid ? '#ffd45e' : '#c8d0ee';

  // pill with a depleting time fill
  rrect(ctx, x, y, w, h, h/2);
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill();
  ctx.save();
  rrect(ctx, x, y, w, h, h/2); ctx.clip();
  ctx.fillStyle = low ? 'rgba(255,80,80,0.30)' : mid ? 'rgba(255,212,94,0.20)' : 'rgba(111,210,255,0.16)';
  ctx.fillRect(x, y, w*frac, h);
  if (timerFlash > 0) {                       // green pulse when bonus time lands
    ctx.fillStyle = `rgba(126,232,143,${(timerFlash*0.35).toFixed(3)})`;
    ctx.fillRect(x, y, w, h);
  }
  // glass shine on the pill
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  rrect(ctx, x+4, y+2.5, w-8, h*0.38, h*0.19); ctx.fill();
  ctx.restore();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = low
    ? (Math.sin(lastT/150) > 0 ? 'rgba(255,107,107,0.95)' : 'rgba(255,176,176,0.55)')
    : 'rgba(255,255,255,0.16)';
  rrect(ctx, x, y, w, h, h/2); ctx.stroke();

  // clock icon with a sweeping second hand
  const ix = x + h*0.62, ir = h*0.25;
  ctx.strokeStyle = col; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(ix, cy, ir, 0, 7); ctx.stroke();
  const ha = -Math.PI/2 + ((GAME_TIME - timeLeft) % 60) / 60 * Math.PI * 2;
  ctx.beginPath(); ctx.moveTo(ix, cy);
  ctx.lineTo(ix + Math.cos(ha)*ir*0.7, cy + Math.sin(ha)*ir*0.7);
  ctx.stroke();

  // digits
  const t = Math.max(0, Math.ceil(timeLeft));
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = `800 ${Math.round(15*pulse)}px -apple-system, system-ui, sans-serif`;
  ctx.fillStyle = low
    ? (Math.sin(lastT/150) > 0 ? '#ff6b6b' : '#ffb0b0')
    : (mid ? '#ffd45e' : '#e8ecff');
  ctx.fillText(((t/60)|0) + ':' + String(t%60).padStart(2,'0'), ix + ir + 7, cy + 1);
}

function drawDebris() {
  for (const d of debris) {
    drawCube(d.x, d.y, d.s, d.color, d.rot, 1 - d.t/d.life);
  }
}

function drawOrbs() {
  for (const o of orbs) {
    if (o.state === 'fly' && o.t < 0) continue;
    const col = TILE_COLORS[o.color][0];
    const pulse = 1 + Math.sin(lastT/260 + o.bob)*0.12;
    drawGlow(o.x, o.y, 15*pulse, col, 0.5);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(o.x, o.y, 5.5*pulse, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(o.x - 1.2, o.y - 1.4, 2.1, 0, 7); ctx.fill();
  }
}

function drawShots() {
  for (const s of shots) {
    if (s.t < 0) continue;
    const col = TILE_COLORS[s.color][0];
    if (s.trail) for (let i=0;i<s.trail.length;i++) {
      const k = (i+1) / s.trail.length;
      ctx.globalAlpha = k*0.30;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(s.trail[i].x, s.trail[i].y, 1.5 + 4*k, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    drawGlow(s.x, s.y, 17, col, 0.55);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(s.x, s.y, 6, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(s.x, s.y, 2.6, 0, 7); ctx.fill();
  }
}

function drawBoard() {
  const bx = L.boardX - 9, by = L.boardY - 9, bw = L.boardW + 18, bh = L.boardH + 18;
  // drop shadow, then glassy frame
  rrect(ctx, bx, by + 7, bw, bh, 20);
  ctx.fillStyle = 'rgba(0,0,0,0.32)'; ctx.fill();
  rrect(ctx, bx, by, bw, bh, 20);
  const fg = ctx.createLinearGradient(0, by, 0, by + bh);
  fg.addColorStop(0, 'rgba(122,142,222,0.24)');
  fg.addColorStop(1, 'rgba(58,68,128,0.16)');
  ctx.fillStyle = fg; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.13)'; ctx.lineWidth = 1.2; ctx.stroke();
  // checkerboard cell wells
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
    rrect(ctx, L.boardX + c*L.cell + 2, L.boardY + r*L.cell + 2, L.cell-4, L.cell-4, L.cell*0.24);
    ctx.fillStyle = (r+c) % 2 ? 'rgba(10,13,34,0.42)' : 'rgba(10,13,34,0.28)';
    ctx.fill();
  }
  // selection glow ring under the picked tile
  if (selected) {
    const g = grid[selected.r]?.[selected.c];
    if (g) {
      drawGlow(g.x, g.y, L.cell*0.95, '#ffffff', 0.16 + 0.08*Math.sin(lastT/160));
      rrect(ctx, cellX(selected.c)-L.cell/2+1.5, cellY(selected.r)-L.cell/2+1.5, L.cell-3, L.cell-3, L.cell*0.24);
      ctx.strokeStyle = `rgba(255,255,255,${(0.5+0.3*Math.sin(lastT/160)).toFixed(2)})`;
      ctx.lineWidth = 2; ctx.stroke();
    }
  }
  ctx.save();
  ctx.beginPath();
  ctx.rect(L.boardX - 6, L.boardY - 4, L.boardW + 12, L.boardH + 10);
  ctx.clip();
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
    const g = grid[r]?.[c];
    if (!g) continue;
    let sc = g.scale;
    if (g.pop) sc = g.popT <= 0 ? g.scale : Math.max(0, 1 + g.popT*2 - (g.popT*g.popT)*30);
    if (selected && selected.r===r && selected.c===c) sc *= 1.10 + Math.sin(lastT/140)*0.04;
    if (sc <= 0.01) continue;
    const s = L.cell * sc;
    const isHint = hint && state === 'ready' && !g.falling && !g.pop &&
      ((hint[0].r === r && hint[0].c === c) || (hint[1].r === r && hint[1].c === c));
    if (isHint) {
      // gentle intermittent wiggle on the suggested pair
      const wig = Math.sin(lastT/90) * 0.05 * (0.35 + 0.65*Math.abs(Math.sin(lastT/650)));
      ctx.save();
      ctx.translate(g.x, g.y);
      ctx.rotate(wig);
      if (g.power) drawPower(g, 0, 0, s);
      else ctx.drawImage(tileSprites[g.type], -s/2, -s/2, s, s);
      ctx.restore();
    }
    else if (g.power) drawPower(g, g.x, g.y, s);
    else if (g.squash > 0.02) {
      // landing squash: wider + shorter, anchored to the tile's bottom edge
      const wpx = s * (1 + g.squash*0.22), hpx = s * (1 - g.squash*0.30);
      ctx.drawImage(tileSprites[g.type], g.x - wpx/2, g.y + s/2 - hpx, wpx, hpx);
    }
    else ctx.drawImage(tileSprites[g.type], g.x - s/2, g.y - s/2, s, s);
    // whisper-quiet twinkle on tiles whose color still exists on the figure
    if (g.type && !g.pop && !g.falling && fig && (fig.colorLeft[g.type]||0) > 0) {
      const cyc = ((lastT/1000) + ((r*31 + c*17) % 97) / 97 * 9) % 9;
      if (cyc < 0.5) {
        const a = Math.sin(cyc/0.5 * Math.PI) * 0.4;
        ctx.globalAlpha = a;
        ctx.fillStyle = '#ffffff';
        sparkle(ctx, g.x + s*0.24, g.y - s*0.26, s*0.10);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }
  ctx.restore();
}

// toy rocket pointing up, centered on the origin; h = half-height
function drawRocket(c, h) {
  c.lineJoin = 'round';
  const bw = h*0.5;
  // fins
  c.fillStyle = '#e8362f';
  c.beginPath();
  c.moveTo(-bw*0.46, h*0.02);
  c.quadraticCurveTo(-h*0.66, h*0.34, -h*0.52, h*0.6);
  c.lineTo(-bw*0.34, h*0.34);
  c.closePath(); c.fill();
  c.beginPath();
  c.moveTo(bw*0.46, h*0.02);
  c.quadraticCurveTo(h*0.66, h*0.34, h*0.52, h*0.6);
  c.lineTo(bw*0.34, h*0.34);
  c.closePath(); c.fill();
  // body capsule
  const bg = c.createLinearGradient(-bw/2, 0, bw/2, 0);
  bg.addColorStop(0, '#ffffff');
  bg.addColorStop(0.45, '#eef1fb');
  bg.addColorStop(1, '#b9c1e2');
  rrect(c, -bw/2, -h*0.68, bw, h*1.24, bw*0.42);
  c.fillStyle = bg; c.fill();
  // engine skirt
  c.fillStyle = '#8d96c1';
  rrect(c, -bw*0.36, h*0.44, bw*0.72, h*0.16, h*0.05); c.fill();
  // nose cone
  const ng = c.createLinearGradient(-bw/2, 0, bw/2, 0);
  ng.addColorStop(0, '#ff7a6e'); ng.addColorStop(1, '#d92b25');
  c.fillStyle = ng;
  c.beginPath();
  c.moveTo(-bw/2, -h*0.40);
  c.quadraticCurveTo(-bw*0.30, -h*0.92, 0, -h*1.02);
  c.quadraticCurveTo(bw*0.30, -h*0.92, bw/2, -h*0.40);
  c.closePath(); c.fill();
  // porthole window
  c.fillStyle = '#dfe4ff';
  c.beginPath(); c.arc(0, -h*0.12, bw*0.34, 0, 7); c.fill();
  const wg = c.createLinearGradient(0, -h*0.12 - bw*0.26, 0, -h*0.12 + bw*0.26);
  wg.addColorStop(0, '#bfe9ff'); wg.addColorStop(1, '#3f8fd9');
  c.fillStyle = wg;
  c.beginPath(); c.arc(0, -h*0.12, bw*0.26, 0, 7); c.fill();
  c.fillStyle = 'rgba(255,255,255,0.85)';
  c.beginPath(); c.arc(-bw*0.08, -h*0.12 - bw*0.10, bw*0.09, 0, 7); c.fill();
}

// flickering exhaust flame below the rocket
function drawFlame(c, h, t) {
  const fl = 0.8 + Math.sin(t*32)*0.25;
  const y0 = h*0.56;
  const g = c.createLinearGradient(0, y0, 0, y0 + h*0.95*fl);
  g.addColorStop(0, '#fff6c0');
  g.addColorStop(0.4, '#ffb347');
  g.addColorStop(1, 'rgba(255,80,40,0)');
  c.fillStyle = g;
  c.beginPath();
  c.moveTo(-h*0.17, y0);
  c.quadraticCurveTo(-h*0.22, y0 + h*0.5*fl, 0, y0 + h*0.95*fl);
  c.quadraticCurveTo(h*0.22, y0 + h*0.5*fl, h*0.17, y0);
  c.closePath();
  c.fill();
}

function drawPower(g, px, py, s) {
  const t = lastT/1000, h = s/2;
  ctx.save();
  ctx.translate(px, py);
  rrect(ctx, -h*0.88, -h*0.78, h*1.76, h*1.76, s*0.24);
  ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.fill();
  rrect(ctx, -h*0.88, -h*0.88, h*1.76, h*1.76, s*0.24);
  const bg = ctx.createLinearGradient(0, -h*0.88, 0, h*0.88);
  bg.addColorStop(0, '#7d88c4');
  bg.addColorStop(0.14, '#7d88c4');
  bg.addColorStop(0.23, '#4f5990');
  bg.addColorStop(1, '#242b50');
  ctx.fillStyle = bg; ctx.fill();
  rrect(ctx, -h*0.88, -h*0.88, h*1.76, h*1.76, s*0.24);
  ctx.strokeStyle = 'rgba(20,24,52,0.8)'; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.30)';
  rrect(ctx, -h*0.72, -h*0.84, h*1.44, h*0.09, h*0.05); ctx.fill();
  switch (g.power) {
    case 'rocketH':
    case 'rocketV': {
      if (g.power === 'rocketH') ctx.rotate(Math.PI/2);
      drawFlame(ctx, h*0.76, t);
      drawRocket(ctx, h*0.76);
      break;
    }
    case 'tnt': {
      ctx.fillStyle = '#d9453c';
      for (const o of [-1, 0, 1]) { rrect(ctx, o*h*0.34 - h*0.16, -h*0.52, h*0.32, h*1.04, h*0.1); ctx.fill(); }
      ctx.fillStyle = '#8c2b25';
      ctx.fillRect(-h*0.55, -h*0.1, h*1.1, h*0.2);
      ctx.fillStyle = '#fff';
      ctx.font = `900 ${Math.max(7, Math.round(s*0.22))}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('TNT', 0, h*0.02);
      ctx.strokeStyle = '#ccb'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, -h*0.5); ctx.quadraticCurveTo(h*0.2, -h*0.78, h*0.32, -h*0.64); ctx.stroke();
      ctx.fillStyle = Math.sin(t*20) > 0 ? '#ffd45e' : '#ff8c42';
      ctx.beginPath(); ctx.arc(h*0.32, -h*0.64, h*0.09, 0, 7); ctx.fill();
      break;
    }
    case 'prop': {
      ctx.rotate(t*6);
      ctx.fillStyle = '#7ee0ff';
      for (let i=0;i<3;i++) {
        ctx.rotate(Math.PI*2/3);
        ctx.beginPath(); ctx.ellipse(h*0.38, 0, h*0.36, h*0.15, 0, 0, 7); ctx.fill();
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(0, 0, h*0.14, 0, 7); ctx.fill();
      break;
    }
    case 'paint': {
      ctx.rotate(t*1.2);
      const pcols = ['#ff6d7e','#ffd45e','#69dd7a','#55c8ff'];
      for (let i=0;i<4;i++) {
        ctx.fillStyle = pcols[i];
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.arc(0, 0, h*0.55, i*Math.PI/2, (i+1)*Math.PI/2);
        ctx.closePath(); ctx.fill();
      }
      ctx.rotate(-t*1.2);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(0, 0, h*0.16, 0, 7); ctx.fill();
      break;
    }
    case 'light': {
      const pulse = 1 + Math.sin(t*5)*0.06;
      const rg = ctx.createRadialGradient(0, -h*0.15, h*0.05, 0, 0, h*0.62*pulse);
      rg.addColorStop(0, '#ffffff'); rg.addColorStop(0.35, '#c08bff'); rg.addColorStop(1, '#5b2a9e');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(0, 0, h*0.6*pulse, 0, 7); ctx.fill();
      for (let i=0;i<5;i++) {
        const a = t*2 + i*Math.PI*2/5;
        ctx.fillStyle = TILE_COLORS[TYPES[i]][0];
        ctx.beginPath(); ctx.arc(Math.cos(a)*h*0.38, Math.sin(a)*h*0.34, h*0.09, 0, 7); ctx.fill();
      }
      break;
    }
  }
  ctx.restore();
}

function drawFlyers() {
  for (const f of flyers) {
    ctx.save();
    ctx.translate(f.x, f.y);
    if (f.kind === 'rocket') {
      // nose follows the direction of travel
      ctx.rotate(Math.atan2(f.y - (f.ly ?? f.y - 1), f.x - (f.lx ?? f.x)) + Math.PI/2);
      drawFlame(ctx, 15, lastT/1000);
      drawRocket(ctx, 15);
    } else {
      ctx.rotate(f.rot);
      ctx.fillStyle = '#7ee0ff';
      for (let i=0;i<3;i++) {
        ctx.rotate(Math.PI*2/3);
        ctx.beginPath(); ctx.ellipse(9, 0, 9, 3.6, 0, 0, 7); ctx.fill();
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, 7); ctx.fill();
    }
    ctx.restore();
  }
}

function sparkle(c, x, y, r) {
  c.beginPath();
  c.moveTo(x, y - r); c.quadraticCurveTo(x + r*0.22, y - r*0.22, x + r, y);
  c.quadraticCurveTo(x + r*0.22, y + r*0.22, x, y + r);
  c.quadraticCurveTo(x - r*0.22, y + r*0.22, x - r, y);
  c.quadraticCurveTo(x - r*0.22, y - r*0.22, x, y - r);
  c.closePath();
}

function drawCoin(c, x, y, r) {
  const g = c.createLinearGradient(x, y - r, x, y + r);
  g.addColorStop(0, '#ffe08a'); g.addColorStop(1, '#f09c1d');
  c.beginPath(); c.arc(x, y, r, 0, 7);
  c.fillStyle = g; c.fill();
  c.strokeStyle = '#8a5a10'; c.lineWidth = Math.max(1, r*0.16); c.stroke();
  c.beginPath(); c.arc(x, y, r*0.62, 0, 7);
  c.strokeStyle = 'rgba(138,90,16,0.5)'; c.lineWidth = Math.max(0.8, r*0.1); c.stroke();
  starPath(c, x, y, r*0.4);
  c.fillStyle = '#fff3c8'; c.fill();
}

// shared green CTA pill; returns its hit rect
function drawPillButton(cx, cy, w, h, label, scale = 1) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  rrect(ctx, -w/2, -h/2 + 5, w, h, h/2);
  ctx.fillStyle = 'rgba(0,0,0,0.38)'; ctx.fill();
  rrect(ctx, -w/2, -h/2, w, h, h/2);
  const g = ctx.createLinearGradient(0, -h/2, 0, h/2);
  g.addColorStop(0, '#8bf09b'); g.addColorStop(1, '#2fae52');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();
  rrect(ctx, -w/2 + 7, -h/2 + 4, w - 14, h*0.40, h*0.22);
  ctx.fillStyle = 'rgba(255,255,255,0.30)'; ctx.fill();
  ctx.font = '900 19px -apple-system, system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#0d2a16';
  ctx.fillText(label, 0, 2);
  ctx.restore();
  return { x: cx - (w/2)*scale, y: cy - (h/2)*scale, w: w*scale, h: h*scale };
}

// anticipation overlays: TNT fuse sparks + light-ball electric arcs
function drawChargeFx() {
  for (const f of fuseFx) {
    if (f.t < 0) continue;
    const sx = f.x + L.cell*0.16, sy = f.y - L.cell*0.30;
    drawGlow(sx, sy, 12, '#ffd45e', 0.6);
    ctx.fillStyle = Math.sin(lastT/28) > 0 ? '#fff6c0' : '#ffb347';
    sparkle(ctx, sx, sy, 5 + Math.random()*2);
    ctx.fill();
  }
  for (const a of arcFx) {
    if (a.t < 0 || !a.g) continue;
    const p = Math.min(1, a.t / a.dur);
    const alpha = Math.sin(p * Math.PI) * (0.5 + 0.3*Math.sin(lastT/30 + a.seed));
    if (alpha <= 0.03) continue;
    const tx = a.g.x, ty = a.g.y;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#d9c4ff';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(a.sx, a.sy);
    for (let i=1;i<=4;i++) {
      const k = i/5;
      const jx = Math.sin(lastT/24 + a.seed + i*2.4) * 7 * Math.sin(k*Math.PI);
      const jy = Math.cos(lastT/29 + a.seed*2 + i*1.7) * 7 * Math.sin(k*Math.PI);
      ctx.lineTo(a.sx + (tx-a.sx)*k + jx, a.sy + (ty-a.sy)*k + jy);
    }
    ctx.lineTo(tx, ty);
    ctx.stroke();
    ctx.fillStyle = '#f0e8ff';
    ctx.beginPath(); ctx.arc(tx, ty, 2.4, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// soft glow on the voxels currently being targeted (subtle aim telegraph)
function drawTargetGlows() {
  if (!fig) return;
  const a = 0.13 + 0.05*Math.sin(lastT/140);
  for (const s of shots) {
    if (!s.target || !s.target.alive) continue;
    const p = voxPos(s.target);
    drawGlow(p.x, p.y, fig.s*1.5*p.k, TILE_COLORS[s.target.color][0], a);
  }
  for (const f of flyers) {
    if (!f.target || !f.target.alive) continue;
    const p = voxPos(f.target);
    drawGlow(p.x, p.y, fig.s*1.7*p.k, '#ffffff', 0.09 + 0.04*Math.sin(lastT/140));
  }
}

// hidden-color compass: chevrons on the side of the figure, pointing the
// direction to drag so the swarm's waiting color rotates into view
function drawCompass() {
  if (!compass || !fig || (state !== 'ready' && state !== 'resolve')) return;
  let bw = null, bz = -1e9;
  for (const v of fig.voxels) {
    if (!v.alive || v.color !== compass.color) continue;
    const w = worldOf(v);
    if (w.z > bz) { bz = w.z; bw = w; }
  }
  if (!bw || bz < fig.radius*0.05) return;   // color is already front-side
  const side = bw.x >= 0 ? 1 : -1;
  const dir = -side;                          // drag toward the center-line
  const a = Math.min(1, starveT - 1.2) * (0.5 + 0.2*Math.sin(lastT/250));
  if (a <= 0) return;
  const col = TILE_COLORS[compass.color][0];
  const rx = fig.cx + side * Math.min(orbitRadius()*0.82, W/2 - 34);
  const cy = fig.cy;
  ctx.globalAlpha = a;
  ctx.strokeStyle = col; ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const slide = ((lastT/320) % 1) * 9;
  for (let i=0;i<3;i++) {
    const x = rx + dir*(i*12 + slide);
    ctx.beginPath();
    ctx.moveTo(x - dir*7, cy - 9);
    ctx.lineTo(x + dir*2, cy);
    ctx.lineTo(x - dir*7, cy + 9);
    ctx.stroke();
  }
  drawGlow(rx + side*18, cy, 10, col, a*0.8);
  ctx.globalAlpha = a;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(rx + side*18, cy, 4.5, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
}

function drawRocketFx() {
  for (const k of rocketFx) {
    if (k.t < 0) continue;
    drawGlow(k.x, k.y, 18, '#ffc06a', 0.4);
    ctx.save();
    ctx.translate(k.x, k.y);
    ctx.rotate(Math.atan2(k.dy, k.dx) + Math.PI/2);
    drawFlame(ctx, L.cell*0.34, lastT/1000);
    drawRocket(ctx, L.cell*0.34);
    ctx.restore();
  }
}

function drawFx() {
  for (const p of particles) {
    const k = 1 - p.t/p.life;
    ctx.globalAlpha = k;
    ctx.fillStyle = p.color;
    if (p.kind === 'conf') {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.scale(1, 0.35 + 0.65*Math.abs(Math.sin(p.ph + p.t*9)));   // paper flutter
      ctx.fillRect(-p.size/2, -p.size/3, p.size, p.size*0.66);
      ctx.restore();
    } else if (p.kind === 'spark') {
      // 4-point twinkle
      const r = p.size * (0.7 + k);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.t*4);
      ctx.beginPath();
      ctx.moveTo(0, -r); ctx.quadraticCurveTo(r*0.22, -r*0.22, r, 0);
      ctx.quadraticCurveTo(r*0.22, r*0.22, 0, r);
      ctx.quadraticCurveTo(-r*0.22, r*0.22, -r, 0);
      ctx.quadraticCurveTo(-r*0.22, -r*0.22, 0, -r);
      ctx.fill();
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size*k, 0, 7);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  for (const f of floats) {
    const k = f.t / f.life;
    const rise = 38 * k;
    const a = k < 0.15 ? k/0.15 : 1 - Math.max(0, (k-0.6)/0.4);
    const pop = 1 + (k < 0.12 ? (0.12-k)*3.5 : 0);
    ctx.globalAlpha = a;
    ctx.font = `900 ${Math.round(17*f.scale*pop)}px -apple-system, system-ui, sans-serif`;
    ctx.strokeStyle = 'rgba(6,8,24,0.65)';
    ctx.lineWidth = 5;
    ctx.strokeText(f.text, f.x, f.y - rise);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y - rise);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillText(f.text, f.x, f.y - rise - 1);
  }
  ctx.globalAlpha = 1;
}

// ---------- map / meta screen ----------
function smoothstep(k) { return k*k*(3-2*k); }

function mapCenterLevel() {
  if (!mapAnim) return unlocked;
  const e = smoothstep(Math.min(1, mapAnim.t / 0.9));
  return mapAnim.from + (mapAnim.to - mapAnim.from) * e;
}

function nodePos(i) {
  const c = mapCenterLevel();
  return {
    x: W/2 + Math.sin(i*1.05) * Math.min(84, W*0.22),
    y: H*0.56 - (i - c) * 86,
  };
}

function spawnCoinFx(fromLevel) {
  const p = nodePos(fromLevel);
  for (let i=0;i<8;i++) {
    coinFx.push({
      sx: p.x, sy: p.y, x: p.x, y: p.y,
      t: -0.3 - i*0.07, dur: 0.55,
      cx: p.x + (Math.random()-0.5)*140,
      cy: p.y - 60 - Math.random()*70,
    });
  }
}

function updateMap(dt) {
  if (mapAnim) {
    mapAnim.t += dt;
    if (mapAnim.t > 1.8) mapAnim = null;
  }
  const tgt = L.mapCoin || { x: W - 60, y: L.top + 26 };
  for (let i=coinFx.length-1;i>=0;i--) {
    const cf = coinFx[i];
    cf.t += dt;
    if (cf.t < 0) continue;
    const k = Math.min(1, cf.t / cf.dur), e = smoothstep(k), u = 1 - e;
    cf.x = u*u*cf.sx + 2*u*e*cf.cx + e*e*tgt.x;
    cf.y = u*u*cf.sy + 2*u*e*cf.cy + e*e*tgt.y;
    if (k >= 1) {
      coinFx.splice(i,1);
      coinsShown = Math.min(coins, coinsShown + coinsEarned/8);
      beep(880 + Math.random()*220, 0.05, 'triangle', 0.1);
    }
  }
  if (!coinFx.length) coinsShown += (coins - coinsShown) * Math.min(1, dt*6);
  if (Math.abs(coins - coinsShown) < 0.6) coinsShown = coins;
}

function drawMapScreen() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';

  // logo
  const ly = L.top + Math.max(58, H*0.09) + Math.sin(lastT/700)*2;
  ctx.font = `900 ${Math.min(42, W*0.115)}px -apple-system, system-ui, sans-serif`;
  const tg = ctx.createLinearGradient(0, ly-22, 0, ly+22);
  tg.addColorStop(0, '#ffe08a'); tg.addColorStop(1, '#f5a623');
  ctx.strokeStyle = 'rgba(10,8,30,0.65)'; ctx.lineWidth = 7;
  ctx.strokeText('MATCH FLOW', W/2, ly);
  ctx.fillStyle = tg;
  ctx.fillText('MATCH FLOW', W/2, ly);

  // coin counter, top-right
  ctx.font = '800 14px -apple-system, system-ui, sans-serif';
  const ctxt = Math.round(coinsShown).toLocaleString();
  const cw2 = ctx.measureText(ctxt).width + 44;
  const cx2 = W - cw2 - 12, cy2 = L.top + 10;
  rrect(ctx, cx2, cy2, cw2, 32, 16);
  ctx.fillStyle = 'rgba(13,16,40,0.55)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1; ctx.stroke();
  drawCoin(ctx, cx2 + 17, cy2 + 16, 9);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff';
  ctx.fillText(ctxt, cx2 + 31, cy2 + 17);
  ctx.textAlign = 'center';
  L.mapCoin = { x: cx2 + 17, y: cy2 + 16 };

  // winding node path
  const topLim = ly + 44, botLim = H - L.bot - 140;
  const cur = unlocked;
  const lo = Math.max(1, Math.floor(mapCenterLevel()) - 4), hi = Math.floor(mapCenterLevel()) + 5;
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  for (let i=lo;i<hi;i++) {
    const p = nodePos(i), q = nodePos(i+1);
    for (let k=1;k<5;k++) {
      const t = k/5;
      const x = p.x + (q.x-p.x)*t, y = p.y + (q.y-p.y)*t;
      if (y < topLim || y > botLim) continue;
      ctx.beginPath(); ctx.arc(x, y, 2.4, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
    }
  }
  L.mapNode = null;
  for (let i=lo;i<=hi;i++) {
    const p = nodePos(i);
    if (p.y < topLim || p.y > botLim) continue;
    const isCur = i === cur && (!mapAnim || mapAnim.t > 0.9);
    if (i < cur) {
      // completed: green with a check
      ctx.beginPath(); ctx.arc(p.x, p.y + 3, 20, 0, 7);
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fill();
      const g = ctx.createLinearGradient(0, p.y-20, 0, p.y+20);
      g.addColorStop(0, '#7fe392'); g.addColorStop(1, '#2fae52');
      ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, 7);
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x - 7, p.y + 1); ctx.lineTo(p.x - 2, p.y + 6); ctx.lineTo(p.x + 8, p.y - 5);
      ctx.stroke();
    } else if (isCur) {
      // current: gold, pulsing, tappable
      const pl = 1 + Math.sin(lastT/300)*0.06;
      drawGlow(p.x, p.y, 44*pl, '#ffd45e', 0.35);
      ctx.beginPath(); ctx.arc(p.x, p.y + 3, 26*pl, 0, 7);
      ctx.fillStyle = 'rgba(0,0,0,0.32)'; ctx.fill();
      const g = ctx.createLinearGradient(0, p.y-26, 0, p.y+26);
      g.addColorStop(0, '#ffe08a'); g.addColorStop(1, '#f09c1d');
      ctx.beginPath(); ctx.arc(p.x, p.y, 26*pl, 0, 7);
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.font = '900 19px -apple-system, system-ui, sans-serif';
      ctx.fillStyle = '#4a3200';
      ctx.fillText(i, p.x, p.y + 1.5);
      L.mapNode = { x: p.x, y: p.y, r: 30 };
    } else {
      // locked
      ctx.beginPath(); ctx.arc(p.x, p.y + 3, 19, 0, 7);
      ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.fill();
      ctx.beginPath(); ctx.arc(p.x, p.y, 19, 0, 7);
      ctx.fillStyle = '#2b3160'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.font = '800 14px -apple-system, system-ui, sans-serif';
      ctx.fillStyle = '#6a739c';
      ctx.fillText(i, p.x, p.y + 1);
    }
  }

  // gold marker sliding to the freshly unlocked node
  if (mapAnim && mapAnim.t < 0.95) {
    const e = smoothstep(Math.min(1, mapAnim.t / 0.9));
    const p0 = nodePos(mapAnim.from), p1 = nodePos(mapAnim.to);
    const mx = p0.x + (p1.x - p0.x)*e, my = p0.y + (p1.y - p0.y)*e;
    drawGlow(mx, my, 30, '#ffd45e', 0.5);
    ctx.strokeStyle = '#ffd45e'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(mx, my, 24, 0, 7); ctx.stroke();
  }

  // coins flying to the counter
  for (const cf of coinFx) {
    if (cf.t < 0) continue;
    drawCoin(ctx, cf.x, cf.y, 8);
  }

  // play button
  const pulse = 1 + Math.sin(lastT/300)*0.03;
  L.mapPlay = drawPillButton(W/2, H - L.bot - 78, 214, 56, 'PLAY  LEVEL ' + cur, pulse);
}

function draw() {
  if (state === 'map') {
    drawBackground();
    drawMapScreen();
    if (fade) { ctx.fillStyle = `rgba(8,10,24,${Math.min(1,fade.a).toFixed(3)})`; ctx.fillRect(0,0,W,H); }
    return;
  }
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  drawBackground();
  drawHUD();
  drawFigure();
  drawTargetGlows();
  drawCompass();
  drawDebris();
  drawBoard();
  drawChargeFx();
  drawTimer();
  drawBoosterBar();
  drawRocketFx();
  drawShots();
  drawOrbs();
  drawFlyers();
  drawFx();
  ctx.restore();

  if (paintPick && state !== 'won' && state !== 'over') drawPaintPick();

  // low-time red vignette
  if (timeLeft > 0 && timeLeft <= 10.5 && (state === 'ready' || state === 'resolve')) {
    const a = Math.max(0, 0.10 + 0.08*Math.sin(lastT/150));
    const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.42, W/2, H/2, Math.max(W,H)*0.72);
    vg.addColorStop(0, 'rgba(255,50,50,0)');
    vg.addColorStop(1, `rgba(255,50,50,${a.toFixed(3)})`);
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  const winCard = state === 'won' && orbs.length === 0 && wonT > 1.0;
  if (state === 'over' || winCard) {
    const isWin = state === 'won';
    // dim + focus vignette
    const dimA = isWin ? Math.min(0.62, (wonT - 1.0)*2) : 0.62;
    ctx.fillStyle = `rgba(8,10,26,${dimA.toFixed(3)})`;
    ctx.fillRect(0,0,W,H);
    const dg = ctx.createRadialGradient(W/2, H*0.42, 90, W/2, H*0.45, Math.max(W,H)*0.72);
    dg.addColorStop(0, 'rgba(0,0,0,0)');
    dg.addColorStop(1, 'rgba(4,6,16,0.5)');
    ctx.fillStyle = dg; ctx.fillRect(0,0,W,H);

    // pop-in with a little overshoot
    const ap = isWin ? Math.min(1, (wonT - 1.0)/0.35) : Math.min(1, (lastT - overAt)/350);
    const ov = 1 + Math.sin(ap*Math.PI)*0.06;
    const cs = (0.85 + 0.15*ap) * ov;

    const cw = Math.min(W*0.88, 340);
    const chh = 330;
    const ccy = Math.max(L.top + 14 + chh/2, H*0.44);
    ctx.save();
    ctx.translate(W/2, ccy);
    ctx.scale(cs, cs);
    ctx.translate(-W/2, -ccy);
    const cx0 = W/2 - cw/2, cy0 = ccy - chh/2;
    rrect(ctx, cx0, cy0 + 9, cw, chh, 26);
    ctx.fillStyle = 'rgba(0,0,0,0.38)'; ctx.fill();
    rrect(ctx, cx0, cy0, cw, chh, 26);
    const cg = ctx.createLinearGradient(0, cy0, 0, cy0 + chh);
    cg.addColorStop(0, '#2c3268'); cg.addColorStop(1, '#171b3a');
    ctx.fillStyle = cg; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1.5; ctx.stroke();
    const sheen = ctx.createLinearGradient(0, cy0, 0, cy0 + 60);
    sheen.addColorStop(0, 'rgba(255,255,255,0.07)');
    sheen.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sheen;
    rrect(ctx, cx0 + 8, cy0 + 5, cw - 16, 56, 20); ctx.fill();

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';

    // title
    const ty = cy0 + 54;
    ctx.font = `900 ${Math.min(32, cw*0.105)}px -apple-system, system-ui, sans-serif`;
    const title = isWin ? 'LEVEL ' + level + ' CLEAR!' : "TIME'S UP";
    const tg = ctx.createLinearGradient(0, ty-18, 0, ty+18);
    if (isWin) { tg.addColorStop(0, '#ffe08a'); tg.addColorStop(1, '#f5a623'); }
    else { tg.addColorStop(0, '#ff9d9d'); tg.addColorStop(1, '#f4442e'); }
    ctx.strokeStyle = 'rgba(10,8,30,0.65)'; ctx.lineWidth = 6;
    ctx.strokeText(title, W/2, ty);
    ctx.fillStyle = tg;
    ctx.fillText(title, W/2, ty);

    if (isWin) {
      // stars pop in one by one
      for (let i=0;i<3;i++) {
        const sx = W/2 + (i-1)*54;
        const sy = ty + 58 + (i===1 ? -8 : 0);
        const born = 1.25 + i*0.28;
        starPath(ctx, sx, sy, i===1 ? 26 : 22);
        ctx.fillStyle = '#1f2450'; ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1.5; ctx.stroke();
        if (i < stars && wonT > born) {
          const sp = Math.min(1, (wonT - born)/0.25);
          const ss = (1.25 - 0.25*sp);
          const sg = ctx.createLinearGradient(0, sy-22, 0, sy+22);
          sg.addColorStop(0, '#ffe08a'); sg.addColorStop(1, '#f09c1d');
          starPath(ctx, sx, sy, (i===1 ? 26 : 22) * ss * sp);
          ctx.fillStyle = sg; ctx.fill();
          ctx.strokeStyle = '#8a5a10'; ctx.lineWidth = 1.5; ctx.stroke();
        }
      }
      ctx.font = '700 12px -apple-system, system-ui, sans-serif';
      ctx.fillStyle = '#8f9bcf';
      ctx.fillText('SCORE', W/2, ty + 116);
      ctx.font = '900 30px -apple-system, system-ui, sans-serif';
      ctx.fillStyle = '#fff';
      ctx.fillText(score.toLocaleString(), W/2, ty + 141);
      // coin reward row
      drawCoin(ctx, W/2 - 34, ty + 174, 10);
      ctx.font = '900 18px -apple-system, system-ui, sans-serif';
      ctx.fillStyle = '#ffd45e';
      ctx.textAlign = 'left';
      ctx.fillText('+' + coinsEarned, W/2 - 18, ty + 175);
      ctx.textAlign = 'center';
    } else {
      // lose: figure progress + score
      ctx.font = '600 13px -apple-system, system-ui, sans-serif';
      ctx.fillStyle = '#aeb8e6';
      const pct = fig ? Math.round(100 * (fig.total - fig.remaining) / fig.total) : 0;
      ctx.fillText(fig ? fig.name + '  ' + pct + '% cleared' : '', W/2, ty + 48);
      ctx.font = '700 12px -apple-system, system-ui, sans-serif';
      ctx.fillStyle = '#8f9bcf';
      ctx.fillText('SCORE', W/2, ty + 90);
      ctx.font = '900 34px -apple-system, system-ui, sans-serif';
      ctx.fillStyle = '#fff';
      ctx.fillText(score.toLocaleString(), W/2, ty + 118);
      ctx.font = '700 13px -apple-system, system-ui, sans-serif';
      ctx.fillStyle = '#ffd45e';
      ctx.fillText('BEST  ' + best.toLocaleString(), W/2, ty + 148);
    }

    // buttons
    const bp2 = 1 + Math.sin(lastT/300)*0.035;
    cardBtn = drawPillButton(W/2, cy0 + chh - 66, 190, 52, isWin ? 'CONTINUE' : 'RETRY', bp2);
    if (!isWin) {
      const mw = 92, mh = 30, mx = W/2 - mw/2, my = cy0 + chh - 26;
      rrect(ctx, mx, my, mw, mh, 15);
      ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.font = '800 12px -apple-system, system-ui, sans-serif';
      ctx.fillStyle = '#aeb8e6';
      ctx.fillText('MAP', W/2, my + mh/2 + 1);
      cardBtn2 = { x: mx, y: my, w: mw, h: mh };
    } else cardBtn2 = null;
    ctx.restore();
  } else { cardBtn = null; cardBtn2 = null; }

  if (fade) {
    ctx.fillStyle = `rgba(8,10,24,${Math.min(1,fade.a).toFixed(3)})`;
    ctx.fillRect(0,0,W,H);
  }
}

// ---------- loop ----------
function frame(t) {
  const dt = Math.min(0.033, (t - lastT)/1000 || 0.016);
  lastT = t;
  if (fade) {
    fade.a += fade.dir * dt * 3.4;
    if (fade.a >= 1 && fade.dir > 0) {
      fade.a = 1; fade.dir = -1;
      if (fade.cb) { fade.cb(); fade.cb = null; }
    }
    if (fade.a <= 0 && fade.dir < 0) fade = null;
  }
  if (state === 'map') updateMap(dt);
  else if (!paintPick) update(dt);          // paint modal = hard pause (timer included)
  draw();
  requestAnimationFrame(frame);
}

resize();
spawnFigure(0);
fillBoard();
if (location.hash === '#play') startLevel(unlocked);   // dev: skip the map
requestAnimationFrame(frame);
</script>
