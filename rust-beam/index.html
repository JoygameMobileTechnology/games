'use strict';
// RUSTBEAM core — pure simulation shared by the game shell and the dev solver. No DOM access.
const RB = (() => {
  const W = 390, H = 844;
  const BELT = { x: 34, y: 78, w: 322, h: 420, r: 36, track: 24 };
  const ART_MAX_W = 234, ART_MAX_H = 306; // artwork area inside the plate frame
  const PLATE_PAD = 13;                    // steel frame width around the artwork
  const TUN = {
    lap: 5,         // seconds per belt lap (tuned from GDD ~10s so holds occur within level duration)
    burn: 0.22,     // seconds per cell (tuned up from GDD 0.10 so duration/lap ratio makes slots matter)
    beltCap: 5,
    slots: 5,
    fly: 0.35,      // deploy / slot flight seconds
    despawnT: 0.4,
    minGap: 48,     // px spacing required at the gate to merge
    dt: 1 / 60,     // fixed logic step
    tMax: 240       // solver timeout
  };

  // ---- belt geometry (rounded-rect loop, clockwise, gate at bottom center) ----
  const beltPath = (() => {
    const { x, y, w, h, r } = BELT, cx = x + w / 2, bot = y + h;
    const segs = []; let acc = 0;
    const line = (x1, y1, x2, y2) => { const len = Math.hypot(x2 - x1, y2 - y1); segs.push({ t: 'l', x1, y1, x2, y2, len, s0: acc }); acc += len; };
    const arc = (ax, ay, a0, a1) => { const len = r * Math.abs(a1 - a0); segs.push({ t: 'a', cx: ax, cy: ay, a0, a1, len, s0: acc }); acc += len; };
    line(cx, bot, x + r, bot);
    arc(x + r, bot - r, Math.PI / 2, Math.PI);
    line(x, bot - r, x, y + r);
    arc(x + r, y + r, Math.PI, Math.PI * 1.5);
    line(x + r, y, x + w - r, y);
    arc(x + w - r, y + r, Math.PI * 1.5, Math.PI * 2);
    line(x + w, y + r, x + w, bot - r);
    arc(x + w - r, bot - r, 0, Math.PI / 2);
    line(x + w - r, bot, cx, bot);
    return { segs, perim: acc };
  })();
  const PERIM = beltPath.perim;
  const SPEED = PERIM / TUN.lap;

  function beltPos(s) {
    s = ((s % PERIM) + PERIM) % PERIM;
    const segs = beltPath.segs;
    for (let i = 0; i < segs.length; i++) {
      const g = segs[i];
      if (s <= g.s0 + g.len + 1e-6) {
        const u = (s - g.s0) / g.len;
        if (g.t === 'l') {
          const dx = g.x2 - g.x1, dy = g.y2 - g.y1;
          return { x: g.x1 + dx * u, y: g.y1 + dy * u, a: Math.atan2(dy, dx) };
        }
        const a = g.a0 + (g.a1 - g.a0) * u;
        return { x: g.cx + BELT.r * Math.cos(a), y: g.cy + BELT.r * Math.sin(a), a: a + Math.PI / 2 };
      }
    }
    return { x: BELT.x, y: BELT.y, a: 0 };
  }
  const GATE = beltPos(0);

  // ---- level parsing ----
  function artRect(cols, rows) {
    const c = Math.min(ART_MAX_W / cols, ART_MAX_H / rows);
    const w = c * cols, h = c * rows;
    const cx = W / 2, cy = BELT.y + BELT.h / 2;
    return { c, x: cx - w / 2, y: cy - h / 2, w, h };
  }

  function parseLevel(L) {
    const rows = L.grid.length, cols = L.grid[0].length;
    const total = rows * cols;
    const color = new Uint8Array(total);
    const nCol = L.pal.length;
    const counts = new Array(nCol).fill(0);
    const byColor = []; for (let i = 0; i < nCol; i++) byColor.push([]);
    for (let r = 0; r < rows; r++) {
      if (L.grid[r].length !== cols) throw new Error(L.name + ': ragged grid row ' + r);
      for (let cix = 0; cix < cols; cix++) {
        const v = L.grid[r].charCodeAt(cix) - 48;
        if (v < 0 || v >= nCol) throw new Error(L.name + ': bad char at ' + r + ',' + cix);
        const i = r * cols + cix;
        color[i] = v; counts[v]++; byColor[v].push(i);
      }
    }
    return { rows, cols, total, color, counts, byColor, nCol };
  }

  // ---- simulation ----
  function makeSim(L) {
    const P = parseLevel(L);
    const art = artRect(P.cols, P.rows);
    const st = {
      L, P, art, t: 0, over: false, won: false, failed: false,
      cleaned: new Uint8Array(P.total),
      exposed: new Uint8Array(P.total),
      claim: new Int16Array(P.total).fill(-1),
      remain: P.counts.slice(),
      cleanedCount: 0,
      guns: [], lanes: [], slots: new Array(TUN.slots).fill(-1),
      gateQ: [], events: [], warned: false
    };
    L.lanes.forEach((lane, li) => {
      const ids = [];
      lane.forEach(spec => {
        const g = {
          id: st.guns.length, c: spec.c, cap: spec.cap, cap0: spec.cap,
          state: 'LANE', lane: li, slot: -1, s: 0, trav: 0, burn: 0, tgt: -1, timer: 0,
          fromX: 0, fromY: 0
        };
        st.guns.push(g); ids.push(g.id);
      });
      st.lanes.push(ids);
    });
    // initial exposure: border cells
    for (let r = 0; r < P.rows; r++) for (let c = 0; c < P.cols; c++) {
      if (r === 0 || c === 0 || r === P.rows - 1 || c === P.cols - 1) st.exposed[r * P.cols + c] = 1;
    }
    return st;
  }

  function cellXY(st, i) {
    const cols = st.P.cols, r = (i / cols) | 0, c = i % cols;
    return { x: st.art.x + (c + 0.5) * st.art.c, y: st.art.y + (r + 0.5) * st.art.c };
  }

  const occupiedSlots = st => { let n = 0; for (const s of st.slots) if (s >= 0) n++; return n; };
  const beltCount = st => { let n = 0; for (const g of st.guns) if (g.state === 'FLY_IN' || g.state === 'GATE' || g.state === 'BELT') n++; return n; };

  function exposedFree(st, c) { // exposed, rusted, unclaimed cells of color c
    let n = 0; const list = st.P.byColor[c];
    for (let k = 0; k < list.length; k++) { const i = list[k]; if (st.exposed[i] && !st.cleaned[i] && st.claim[i] < 0) n++; }
    return n;
  }
  function exposedCount(st, c) {
    let n = 0; const list = st.P.byColor[c];
    for (let k = 0; k < list.length; k++) { const i = list[k]; if (st.exposed[i] && !st.cleaned[i]) n++; }
    return n;
  }

  function deployLane(st, li) {
    if (st.over) return false;
    const lane = st.lanes[li];
    if (!lane || !lane.length) return false;
    const g = st.guns[lane[0]];
    if (beltCount(st) >= TUN.beltCap) { st.events.push({ k: 'denied', gun: g.id, why: 'belt' }); return false; }
    lane.shift();
    g.state = 'FLY_IN'; g.timer = TUN.fly; g.from = 'lane';
    st.events.push({ k: 'deploy', gun: g.id, from: 'lane', lane: li });
    return true;
  }
  function deploySlot(st, si) {
    if (st.over) return false;
    const id = st.slots[si];
    if (id < 0) return false;
    const g = st.guns[id];
    if (beltCount(st) >= TUN.beltCap) { st.events.push({ k: 'denied', gun: g.id, why: 'belt' }); return false; }
    st.slots[si] = -1;
    g.state = 'FLY_IN'; g.timer = TUN.fly; g.slot = -1; g.from = 'slot';
    if (occupiedSlots(st) < TUN.slots - 1) st.warned = false;
    st.events.push({ k: 'deploy', gun: g.id, from: 'slot', slot: si });
    return true;
  }

  function releaseClaim(st, g) { if (g.tgt >= 0) { st.claim[g.tgt] = -1; g.tgt = -1; } }

  function removeEverywhere(st, g) {
    releaseClaim(st, g);
    const qi = st.gateQ.indexOf(g.id); if (qi >= 0) st.gateQ.splice(qi, 1);
    for (const lane of st.lanes) { const k = lane.indexOf(g.id); if (k >= 0) lane.splice(k, 1); }
    for (let i = 0; i < st.slots.length; i++) if (st.slots[i] === g.id) st.slots[i] = -1;
  }

  function despawn(st, g, why) {
    removeEverywhere(st, g);
    g.state = 'DEAD'; g.timer = 0;
    st.events.push({ k: why === 'content' ? 'content' : 'despawn', gun: g.id });
  }

  function acquire(st, g) {
    const pos = beltPos(g.s);
    const list = st.P.byColor[g.c];
    let best = -1, bd = Infinity, br = 0, bc = 0;
    const cols = st.P.cols;
    for (let k = 0; k < list.length; k++) {
      const i = list[k];
      if (!st.exposed[i] || st.cleaned[i] || st.claim[i] >= 0) continue;
      const r = (i / cols) | 0, c = i % cols;
      const x = st.art.x + (c + 0.5) * st.art.c, y = st.art.y + (r + 0.5) * st.art.c;
      const d = (x - pos.x) * (x - pos.x) + (y - pos.y) * (y - pos.y);
      if (d < bd - 1e-6 || (Math.abs(d - bd) <= 1e-6 && (r < br || (r === br && c < bc)))) { bd = d; best = i; br = r; bc = c; }
    }
    if (best >= 0) { g.tgt = best; st.claim[best] = g.id; }
    return best >= 0;
  }

  function cleanCell(st, g) {
    const i = g.tgt, P = st.P, cols = P.cols;
    st.cleaned[i] = 1; st.exposed[i] = 0; st.claim[i] = -1; g.tgt = -1;
    st.cleanedCount++;
    const c = P.color[i];
    st.remain[c]--;
    st.events.push({ k: 'clean', cell: i, c, gun: g.id });
    // expose rusted 4-neighbors
    const r = (i / cols) | 0, cc = i % cols;
    const nb = [];
    if (r > 0) nb.push(i - cols); if (r < P.rows - 1) nb.push(i + cols);
    if (cc > 0) nb.push(i - 1); if (cc < cols - 1) nb.push(i + 1);
    for (const j of nb) if (!st.cleaned[j] && !st.exposed[j]) { st.exposed[j] = 1; st.events.push({ k: 'expose', cell: j }); }
    if (st.remain[c] === 0) {
      st.events.push({ k: 'regiondone', c });
      // surplus guns of a finished color despawn contentedly
      for (const o of st.guns) if (o.c === c && o.state !== 'DEAD' && o.id !== g.id) despawn(st, o, 'content');
    }
    if (st.cleanedCount === st.P.total) { st.won = true; st.over = true; st.events.push({ k: 'win' }); }
  }

  function exitToSlot(st, g) {
    let si = -1;
    for (let i = 0; i < st.slots.length; i++) if (st.slots[i] < 0) { si = i; break; }
    // si always exists pre-fail (fail fires the moment the 5th fills)
    st.slots[si] = g.id;
    g.state = 'FLY_SLOT'; g.timer = TUN.fly; g.slot = si;
    releaseClaim(st, g);
    st.events.push({ k: 'slot', gun: g.id, slot: si });
    const occ = occupiedSlots(st);
    if (occ >= TUN.slots) { st.failed = true; st.over = true; st.events.push({ k: 'fail' }); }
    else if (occ === TUN.slots - 1 && !st.warned) { st.warned = true; st.events.push({ k: 'warn' }); }
    if (occ < TUN.slots - 1) st.warned = false;
  }

  function tick(st, dt) {
    if (st.over) return;
    st.t += dt;
    // 1) flights
    for (const g of st.guns) {
      if (g.state === 'FLY_IN') { g.timer -= dt; if (g.timer <= 0) { g.state = 'GATE'; st.gateQ.push(g.id); } }
      else if (g.state === 'FLY_SLOT') { g.timer -= dt; if (g.timer <= 0) { g.state = 'SLOT'; st.events.push({ k: 'slotland', gun: g.id, slot: g.slot }); } }
    }
    // 2) gate merge (fifo, needs clearance)
    if (st.gateQ.length) {
      let clear = true;
      for (const g of st.guns) if (g.state === 'BELT') {
        const d = Math.min(g.s, PERIM - g.s);
        if (d < TUN.minGap) { clear = false; break; }
      }
      if (clear) {
        const g = st.guns[st.gateQ.shift()];
        g.state = 'BELT'; g.s = 0; g.trav = 0;
        st.events.push({ k: 'merge', gun: g.id });
      }
    }
    // 3) belt movement + lap rule
    const adv = SPEED * dt;
    for (const g of st.guns) {
      if (g.state !== 'BELT') continue;
      g.s += adv; g.trav += adv;
      if (g.s >= PERIM) {
        g.s -= PERIM;
        if (g.trav >= PERIM - 1 && g.tgt < 0) exitToSlot(st, g); // idle after a full lap -> hold slot
      }
    }
    // 4) combat
    for (const g of st.guns) {
      if (g.state !== 'BELT') continue;
      if (g.tgt < 0) { acquire(st, g); if (g.tgt < 0) { g.burn = 0; continue; } }
      g.burn += dt;
      while (g.burn >= TUN.burn && g.tgt >= 0) {
        g.burn -= TUN.burn;
        cleanCell(st, g);
        g.cap--;
        st.events.push({ k: 'cap', gun: g.id, cap: g.cap });
        if (g.cap <= 0) { despawn(st, g, 'empty'); if (st.over) return; break; }
        if (st.remain[g.c] === 0) { despawn(st, g, 'content'); if (st.over) return; break; } // surplus leftover
        if (st.over) return;
        if (!acquire(st, g)) { g.burn = 0; break; }
      }
    }
  }

  // ---- validation ----
  function validate(L) {
    const P = parseLevel(L);
    const errs = [], warns = [];
    const capSum = new Array(P.nCol).fill(0);
    const gunCount = new Array(P.nCol).fill(0);
    let guns = 0;
    L.lanes.forEach(lane => lane.forEach(g => {
      capSum[g.c] += g.cap; gunCount[g.c]++; guns++;
      if (g.cap < 5 || g.cap > 30) warns.push('cap out of 5..30: c' + g.c + ' cap ' + g.cap);
      if (g.c === 0 && false) {}
    }));
    for (let c = 0; c < P.nCol; c++) {
      if (P.counts[c] === 0) { if (capSum[c] > 0) errs.push('guns for empty color ' + c); continue; }
      const diff = capSum[c] - P.counts[c];
      if (diff < 0) errs.push(`color ${c}: caps ${capSum[c]} < cells ${P.counts[c]} (short ${-diff})`);
      else if (diff > 0) {
        if (diff > Math.ceil(P.counts[c] * 0.10)) errs.push(`color ${c}: surplus ${diff} > 10% of ${P.counts[c]}`);
        else warns.push(`color ${c}: surplus ${diff}`);
      }
      if (capSum[c] === 0 && P.counts[c] > 0) errs.push('color ' + c + ' has cells but no guns');
    }
    // region connectivity note (not fatal): count islands per color
    return { P, errs, warns, capSum, gunCount, guns };
  }

  // ---- solver: stochastic greedy rollouts with priority policy ----
  function mulberry(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  function policy(st, R, temp) {
    if (beltCount(st) >= TUN.beltCap) return null;
    const occ = occupiedSlots(st);
    const free = TUN.slots - occ;
    const cands = [];
    let anyActive = false;
    for (const g of st.guns) if ((g.state === 'BELT' && g.tgt >= 0) || g.state === 'FLY_IN' || g.state === 'GATE') { anyActive = true; break; }
    for (let si = 0; si < st.slots.length; si++) {
      const id = st.slots[si];
      if (id < 0) continue;
      const g = st.guns[id];
      if (g.state !== 'SLOT') continue;
      const e = exposedFree(st, g.c);
      if (e > 0) cands.push({ kind: 'slot', i: si, score: 95 + Math.min(e, g.cap) * 2 + occ * 10 });
    }
    for (let li = 0; li < st.lanes.length; li++) {
      const lane = st.lanes[li];
      if (!lane.length) continue;
      const g = st.guns[lane[0]];
      const e = exposedFree(st, g.c);
      if (e > 0) cands.push({ kind: 'lane', i: li, score: 55 + Math.min(e, g.cap) * 2 });
      else {
        // dig: deploy a gun with no current targets to unblock the lane (it will lap then hold)
        const score = anyActive ? (free >= 2 ? 6 - occ * 10 : -50)
                                : (free >= 1 ? 25 - occ * 5 : -50);
        cands.push({ kind: 'lane', i: li, score });
      }
    }
    cands.push({ kind: 'wait', score: anyActive ? 34 : 2 });
    let best = null, bs = -Infinity;
    for (const cd of cands) {
      const s = cd.score + (temp > 0 ? (R() - 0.5) * 2 * temp : 0);
      if (s > bs) { bs = s; best = cd; }
    }
    return best && best.kind !== 'wait' ? best : null;
  }

  function rollout(st, R, temp, targetPeak, plan) {
    let peak = 0, lastDec = -1;
    const dt = TUN.dt;
    while (!st.over && st.t < TUN.tMax) {
      if (st.t - lastDec >= 0.15) {
        lastDec = st.t;
        const a = policy(st, R, temp);
        if (a) {
          const ok = a.kind === 'slot' ? deploySlot(st, a.i) : deployLane(st, a.i);
          if (ok && plan) plan.push({ t: +st.t.toFixed(3), kind: a.kind, i: a.i });
        }
      }
      tick(st, dt);
      const occ = occupiedSlots(st);
      if (occ > peak) peak = occ;
      if (targetPeak >= 0 && peak > targetPeak) return { won: false, peak, t: st.t, pruned: true };
      st.events.length = 0;
    }
    return { won: st.won, peak, t: st.t, pruned: false };
  }

  function solve(L, opts = {}) {
    const N = opts.n || 1400;
    const target = (opts.target != null) ? opts.target : (L.target != null ? L.target : -1);
    let best = null, bestPlan = null, wins = 0;
    for (let k = 0; k < N; k++) {
      const R = mulberry(1234567 + k * 7919);
      const temp = k === 0 ? 0 : 4 + (k % 10) * 5;
      const st = makeSim(L);
      const plan = [];
      const res = rollout(st, R, temp, target >= 0 ? target : -1, plan);
      if (res.won) {
        wins++;
        if (!best || res.peak < best.peak || (res.peak === best.peak && res.t < best.t)) { best = res; bestPlan = plan; }
        if (target >= 0 && res.peak <= target && wins >= 3 && k > 60) break;
      }
    }
    return { ok: !!best && (target < 0 || best.peak <= target), best, plan: bestPlan, wins, target };
  }

  return { W, H, BELT, TUN, PERIM, SPEED, PLATE_PAD, beltPos, GATE, artRect, parseLevel, makeSim, tick, deployLane, deploySlot, occupiedSlots, beltCount, exposedCount, exposedFree, cellXY, validate, solve, mulberry };
})();
/*==RB_CORE_END==*/

// ---------- particles ----------
function pool(n, mk) { const arr = []; for (let i = 0; i < n; i++) arr.push(Object.assign({ on: false }, mk())); return arr; }

const smokes = pool(80, () => ({ x: 0, y: 0, vx: 0, vy: 0, life: 0, t: 0, sz: 4 }));

function spawnSparks(x, y, col, n, boost) {
  for (let i = 0; i < n; i++) emit(sparks, p => {
    const a = -Math.PI / 2 + (rnd() - .5) * 2.4;
    const v = (60 + rnd() * 170) * (boost || 1);
    p.x = x + (rnd() - .5) * 4; p.y = y + (rnd() - .5) * 4;
    p.vx = Math.cos(a) * v; p.vy = Math.sin(a) * v;

}
function spawnSmoke(x, y) {
  emit(smokes, p => {
    p.x = x + (rnd() - .5) * 5; p.y = y; p.vx = (rnd() - .5) * 9; p.vy = -14 - rnd() * 16;
    p.life = .8 + rnd() * .7; p.sz = 3 + rnd() * 3;

}
function updateParticles(dt) {
  for (const p of sparks) if (p.on) {
    p.t += dt; if (p.t >= p.life) { p.on = false; continue; }
    p.vy += 420 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (const p of smokes) if (p.on) {
    p.t += dt; if (p.t >= p.life) { p.on = false; continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy *= (1 - dt * .6);
  }
  for (const p of ashes) if (p.on) {
    p.t += dt; if (p.t >= p.life) { p.on = false; continue; }

    const u = 1 - p.t / p.life;

    g.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz * (1 + Math.abs(p.vy) * .004));
  }
  g.restore();
  for (const p of smokes) if (p.on) {
    const u = p.t / p.life;
    g.globalAlpha = .13 * (1 - u);
    g.fillStyle = '#b9c2cf';
    g.beginPath(); g.arc(p.x, p.y, p.sz + u * 9, 0, TAU); g.fill();

  for (const p of ashes) if (p.on) {

// ---------- audio ----------
const AU = (() => {

    const len = ac.sampleRate;

    toggleMute() { muted = !muted; if (master) master.gain.value = muted ? 0 : .9; if (muted) humOffAll(); return muted; },

    poof() { noise('lowpass', 900, 240, 1, .22, .14); osc('sine', 520, 1250, .17, .07); },
    thunk() { osc('sine', 150, 74, .13, .18, .004); noise('lowpass', 500, 200, 1, .07, .06); },

// gun world position + angle for rendering
function gunPose(g) {

    for (let li = 0; li < st.lanes.length; li++) {
      const d = st.lanes[li].indexOf(g.id);
      if (d >= 0) { const p = laneXY(st, li, Math.min(d, 3.4)); return { x: p.x, y: p.y, a: -Math.PI / 2, s: d === 0 ? 1 : Math.max(.62, .84 - d * .09), depth: d, lane: li }; }
    }

  }
  if (g.state === 'FLY_IN') {

    const from = f.from || { x: GATE.x, y: GATE.y + 60 };
    const mx = (from.x + GATE.x) / 2, my = Math.min(from.y, GATE.y) - 46;
    const x = lerp(lerp(from.x, mx, u), lerp(mx, GATE.x, u), u);
    const y = lerp(lerp(from.y, my, u), lerp(my, GATE.y, u), u);

  }
  if (g.state === 'GATE') return { x: GATE.x, y: GATE.y, a: Math.PI, s: 1 + Math.sin(game.t * 9) * .03 };
  if (g.state === 'BELT') { const p = RB.beltPos(g.s); return { x: p.x, y: p.y, a: p.a, s: 1 }; }
  if (g.state === 'FLY_SLOT') {
    const u = easeInOut(clamp(1 - g.timer / TUN.fly, 0, 1));
    const to = slotXY(g.slot);
    const from = f.slotFrom || GATE;
    const mx = (from.x + to.x) / 2, my = Math.min(from.y, to.y) - 40;
    const x = lerp(lerp(from.x, mx, u), lerp(mx, to.x, u), u);
    const y = lerp(lerp(from.y, my, u), lerp(my, to.y, u), u);

// ---------- event consumption ----------
function consume(st) {
  for (const e of st.events) {
    if (e.k === 'clean') {
      const P = st.P, art = st.art;
      const r = (e.cell / P.cols) | 0, c = e.cell % P.cols;
      const x = art.x + (c + .5) * art.c, y = art.y + (r + .5) * art.c;
      const col = hex(st.L.pal[e.c]);
      erodeCell(st, e.cell, true);
      game.flashes.push({ x: art.x + c * art.c, y: art.y + r * art.c, wd: art.c, t: 0, col });
      spawnSparks(x, y, col, 3);
      if (Math.random() < .5) spawnSmoke(x, y);
      AU.sizzle(game.t);
    } else if (e.k === 'deploy') {
      const g = st.guns[e.gun], f = gfx(e.gun);
      f.popT = 0;
      if (e.from === 'lane') { const p = laneXY(st, e.lane, 0); f.from = { x: p.x, y: p.y }; }
      else { const p = slotXY(e.slot); f.from = { x: p.x, y: p.y }; }
      AU.pop();
      if (st.L.tut) {
        if (game.tut.step === 1 && g.c === 0) { game.tut.step = 0; game.tut.t = 0; }
        else if (game.tut.step === 2 && g.c === 1) { game.tut.step = 0; game.tut.t = 0; }
      }
    } else if (e.k === 'merge') {
      gfx(e.gun).popT = 0;
    } else if (e.k === 'slot') {
      const f = gfx(e.gun);
      const g = st.guns[e.gun];
      f.slotFrom = (() => { const p = RB.beltPos(g.s); return { x: GATE.x, y: GATE.y }; })();
    } else if (e.k === 'slotland') {
      gfx(e.gun).popT = 0;
      AU.thunk();
      if (game.tut.step && !game.tut.slotSeen) { game.tut.slotSeen = true; game.tut.step = 3; game.tut.t = 0; }
    } else if (e.k === 'despawn' || e.k === 'content') {
      const g = st.guns[e.gun];
      const pose = game.lastPoses.get(e.gun) || { x: GATE.x, y: GATE.y, a: 0, s: 1 };
      game.ghosts.push({ x: pose.x, y: pose.y, a: pose.a, col: hex(st.L.pal[g.c]), t: 0, happy: e.k === 'content' });
      spawnSparks(pose.x, pose.y, hex(st.L.pal[g.c]), 10, 1.2);
      AU.poof(); AU.humOff(e.gun);
    } else if (e.k === 'denied') {
      gfx(e.gun).shakeT = 0;
      AU.buzz();
    } else if (e.k === 'regiondone') {
      game.glows.push({ ci: e.c, t: 0 });
    } else if (e.k === 'warn') {
      game.warnT = 0;
    } else if (e.k === 'win') {
      game.mode = 'winseq'; game.modeT = 0;
      AU.humOffAll(); AU.win();
      // ash blow-off
      const art = st.art;
      for (let i = 0; i < 190; i++) emit(ashes, p => {
        p.x = art.x + rnd() * art.w; p.y = art.y + rnd() * art.h;
        p.vx = 20 + rnd() * 60; p.vy = -10 - rnd() * 40;
        p.life = .7 + rnd() * .9; p.sz = 1.5 + rnd() * 2.5;
        p.col = rnd() < .3 ? hex(st.L.pal[(rnd() * st.L.pal.length) | 0]) : { r: 96, g: 74, b: 52 };
      });
    } else if (e.k === 'fail') {

}

// ---------- update ----------
let last = performance.now();
game.lastPoses = new Map();
let acc = 0;
function update(now) {
  let dt = Math.min((now - last) / 1000, .1);
  last = now;
  game.t += dt;
  const st = game.st;
  if (game.mode === 'play' && game.tut.step === 2) {
    // tutorial modal pause: sim frozen until the yellow gun is deployed
  } else if (game.mode === 'play') {
    acc += dt * game.speed;
    const step = TUN.dt;
    let n = 0;
    while (acc >= step && n < 8) {
      acc -= step; n++;
      if (game.auto && game.plan) {
        while (game.planI < game.plan.length && st.t >= game.plan[game.planI].t) {
          const a = game.plan[game.planI++];
          if (a.kind === 'slot') RB.deploySlot(st, a.i); else RB.deployLane(st, a.i);
        }
      }
      RB.tick(st, step);
      consume(st);
      if (game.mode !== 'play') break;
      if (st.L.tut && !game.tut.yellowShown && game.tut.step === 0 && RB.exposedCount(st, 1) > 0) {
        game.tut.yellowShown = true; game.tut.step = 2; game.tut.t = 0; acc = 0;
        break;
      }
    }
  } else if (game.mode === 'winseq') {
    game.modeT += dt;
    if (game.modeT > 1.5) { game.mode = 'win'; game.modeT = 0; }
  } else {
    game.modeT += dt;
  }
  // beam list + hums
  game.beams.length = 0;
  if (game.mode === 'play' || game.mode === 'winseq') {
    for (const g of st.guns) {
      if (g.state === 'BELT' && g.tgt >= 0 && game.mode === 'play' && game.tut.step !== 2) {
        const pose = RB.beltPos(g.s);
        const P = st.P, art = st.art;
        const r = (g.tgt / P.cols) | 0, c = g.tgt % P.cols;
        const tx = art.x + (c + .5) * art.c, ty = art.y + (r + .5) * art.c;
        game.beams.push({ x0: pose.x, y0: pose.y, x1: tx, y1: ty, col: hex(st.L.pal[g.c]), id: g.id });
        AU.humOn(g.id, g.c);
        spawnSparksThrottled(g.id, tx, ty, hex(st.L.pal[g.c]), dt);
      } else AU.humOff(g.id);
    }
  }
  // warn tick sound
  if (game.mode === 'play' && RB.occupiedSlots(st) === TUN.slots - 1) {
    game.warnT += dt;
    if (game.warnT > 1.1) { game.warnT = 0; AU.tick(); }
  }
  // fx timers
  updateStamps(dt);
  updateParticles(dt);
  for (const f of game.gunFx.values()) { f.popT += dt; f.shakeT += dt; }
  for (let i = game.ghosts.length - 1; i >= 0; i--) { const g = game.ghosts[i]; g.t += dt; if (g.t > .45) game.ghosts.splice(i, 1); }
  for (let i = game.flashes.length - 1; i >= 0; i--) { const f = game.flashes[i]; f.t += dt; if (f.t > .3) game.flashes.splice(i, 1); }
  for (let i = game.glows.length - 1; i >= 0; i--) { const g = game.glows[i]; g.t += dt; if (g.t > .8) game.glows.splice(i, 1); }
  const target = st.cleanedCount / st.P.total;
  game.shineP += (target - game.shineP) * Math.min(1, dt * 8);
  game.tut.t += dt;
}
const sparkAcc = new Map();
function spawnSparksThrottled(id, x, y, col, dt) {
  let a = (sparkAcc.get(id) || 0) + dt * 9;
  if (a >= 1) { a -= 1; spawnSparks(x, y, col, 1); if (Math.random() < .12) spawnSmoke(x, y); }
  sparkAcc.set(id, a);
}

  g2.fillStyle = 'rgba(255,255,255,0.75)'; g2.font = '600 13px system-ui,sans-serif';
  g2.fillText('The whole workshop shines again.', W / 2, y + 82);
  btnPill(g2, x + 70, y + 118, 160, 46, 'PLAY AGAIN', { r: 53, g: 209, b: 255 }, 'again');
}
function drawHand(g2, x, y) {
  const bob = Math.sin(game.t * 5) * 7;
  g2.save();
  g2.translate(x + 14, y + 34 + bob);
  g2.rotate(-.5);
  g2.fillStyle = '#fff';
  g2.strokeStyle = 'rgba(0,0,0,0.35)'; g2.lineWidth = 2;
  g2.beginPath();
  g2.moveTo(0, -16); g2.lineTo(4.5, -2); g2.lineTo(9, 10); g2.lineTo(-2, 12); g2.lineTo(-8, 2); g2.lineTo(-4.5, -3);
  g2.closePath(); g2.fill(); g2.stroke();
  g2.beginPath(); g2.arc(0, -16, 4.5, 0, TAU); g2.fill(); g2.stroke();
  g2.restore();
}
function bubble(g2, cx, cy, w, text) {
  const lines = text.split('\n');
  const h = 26 + lines.length * 17;
  rr(g2, cx - w / 2, cy, w, h, 12);
  g2.fillStyle = 'rgba(255,255,255,0.96)'; g2.fill();
  g2.fillStyle = '#1a2233'; g2.font = '700 13px system-ui,sans-serif';
  g2.textAlign = 'center'; g2.textBaseline = 'middle';
  lines.forEach((ln, i) => g2.fillText(ln, cx, cy + 20 + i * 17));
}
function drawTutorial(g2) {
  const st = game.st, tut = game.tut;
  if (!tut.step || game.mode !== 'play') return;
  if (tut.step === 1) {
    // dim except lane A front (gray gun)
    const p = laneXY(st, 0, 0);
    g2.save();
    g2.fillStyle = 'rgba(6,9,18,0.62)';
    g2.beginPath();
    g2.rect(0, 0, W, H);
    g2.arc(p.x, p.y, 42, 0, TAU, true);
    g2.fill('evenodd');
    g2.restore();
    drawHand(g2, p.x, p.y);
    bubble(g2, W / 2, p.y - 120, 240, 'Tap the gray laser!');
  } else if (tut.step === 2) {
    // modal pause: spotlight the yellow front gun
    let li = -1;
    for (let i = 0; i < st.lanes.length; i++) {
      const l = st.lanes[i];
      if (l.length && st.guns[l[0]].c === 1) { li = i; break; }
    }
    const p = li >= 0 ? laneXY(st, li, 0) : laneXY(st, 0, 0);
    g2.save();
    g2.fillStyle = 'rgba(6,9,18,0.62)';
    g2.beginPath();
    g2.rect(0, 0, W, H);
    g2.arc(p.x, p.y, 42, 0, TAU, true);
    g2.fill('evenodd');
    g2.restore();
    drawHand(g2, p.x, p.y);
    bubble(g2, W / 2, p.y - 138, 292, 'The bolt is reachable now —\ninner colors unlock when\nthe outside is clean.');
    bubble(g2, W / 2, p.y - 64, 240, 'Tap the yellow laser!');
  } else if (tut.step === 3) {
    g2.save();
    g2.fillStyle = 'rgba(6,9,18,0.62)';
    g2.beginPath();
    g2.rect(0, 0, W, H);
    const m = 8;
    rr(g2, SLOT_X0 - m, SLOT_Y - m, SLOT_N * SLOT_S + (SLOT_N - 1) * SLOT_GAP + m * 2, SLOT_S + m * 2, 14);
    g2.fill('evenodd');
    g2.restore();
    bubble(g2, W / 2, SLOT_Y - 92, 316, 'Extra guns park in slots.\nNever fill all 5!');
    g2.fillStyle = 'rgba(255,255,255,0.6)'; g2.font = '600 11px system-ui,sans-serif';
    g2.textAlign = 'center';
    g2.fillText('tap to continue', W / 2, SLOT_Y - 26);
    hit('tut3', 0, 0, W, H);
  }
}
function drawDebug(g2) {
  if (!DEBUG) return;
  g2.font = '700 10px monospace'; g2.textAlign = 'left';
  const y = H - 6;
  let x = 6;
  for (let i = 0; i < RB_LEVELS.length; i++) {
    const w = 20;
    rr(g2, x, y - 16, w, 16, 4);
    g2.fillStyle = i === game.levelIx ? '#3e5d8f' : '#20293f'; g2.fill();
    g2.fillStyle = '#cfe0ff'; g2.fillText(i + 1, x + 5, y - 4);
    hit('dbg' + i, x, y - 16, w, 16);
    x += w + 3;
  }
  for (const [id, label] of [['dbgA', game.auto ? 'AUTO✓' : 'AUTO'], ['dbgS', 'x' + game.speed], ['dbgR', 'RVL']]) {
    const w = 40;
    rr(g2, x, y - 16, w, 16, 4);
    g2.fillStyle = '#20293f'; g2.fill();
    g2.fillStyle = '#ffd76e'; g2.fillText(label, x + 4, y - 4);
    hit(id, x, y - 16, w, 16);
    x += w + 3;
  }
  g2.fillStyle = '#7f92b8';
  g2.fillText(`t=${game.st.t.toFixed(1)} fps=${fps | 0} slots=${RB.occupiedSlots(game.st)}`, x + 4, y - 4);
}
// ---------- frame ----------
let fps = 60;
function frame(now) {
  requestAnimationFrame(frame);
  try { doFrame(now); }
  catch (e) { if (!frame._err) { frame._err = 1; console.error('[RB] frame error:', e && e.stack || e); } }
}
// hidden-tab fallback: keep sim/render alive at low rate so the game never freezes mid-level
setInterval(() => { if (document.hidden) { try { doFrame(performance.now()); } catch (e) { if (!frame._err) { frame._err = 1; console.error('[RB] frame error:', e && e.stack || e); } } } }, 250);
function doFrame(now) {
  const dtMs = now - (frame._t || now);
  frame._t = now;
  fps = fps * .95 + (1000 / Math.max(dtMs, 1)) * .05;
  update(now);
  HITS.length = 0;
  // letterbox bg
  ctx.save();
  ctx.fillStyle = '#070a14';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.translate(offX, offY); ctx.scale(scale, scale);
  ctx.drawImage(bgC, 0, 0);
  // motes
  for (const m of motes) {
    const y = (m.y + game.t * 6 * m.s) % H;
    const x = m.x + Math.sin(game.t * m.s + m.p) * 14;
    ctx.globalAlpha = m.a * (0.6 + 0.4 * Math.sin(game.t * m.s * 3 + m.p));
    ctx.fillStyle = '#cfe2ff';
    ctx.beginPath(); ctx.arc(x, y, m.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawBelt(ctx);
  drawSlots(ctx);
  drawLanes(ctx);
  drawArtStack(ctx);
  // guns on belt / gate / flights / slots
  const st = game.st;
  game.lastPoses.clear();
  const layers = [[], []];
  for (const g of st.guns) {
    if (g.state === 'DEAD' || g.state === 'LANE') continue;
    const pose = gunPose(g);
    if (!pose) continue;
    game.lastPoses.set(g.id, pose);
    (g.state === 'FLY_IN' || g.state === 'FLY_SLOT' ? layers[1] : layers[0]).push([g, pose]);
  }
  for (const [g, pose] of layers[0]) drawGun(g, pose);
  drawGhosts(ctx);
  drawBeams(ctx);
  for (const [g, pose] of layers[1]) drawGun(g, pose);
  drawParticles(ctx);
  drawHUD(ctx);
  drawTutorial(ctx);
  if (game.mode === 'intro') drawIntro(ctx);
  else if (game.mode === 'win') { if (game.levelIx < RB_LEVELS.length - 1) drawWin(ctx); else drawEnd(ctx); }
  else if (game.mode === 'fail') drawFail(ctx);
  drawDebug(ctx);
  ctx.restore();
}
// ---------- input ----------
cv.addEventListener('pointerdown', ev => {
  AU.unlock();
  const x = (ev.clientX - offX) / scale, y = (ev.clientY - offY) / scale;
  // UI hits first (topmost last drawn -> check reversed)
  for (let i = HITS.length - 1; i >= 0; i--) {
    const h = HITS[i];
    if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) {
      if (handleUI(h.id)) return;
    }
  }
  if (game.mode !== 'play') return;
  const st = game.st;
  // slot taps
  for (let i = 0; i < SLOT_N; i++) {
    const p = slotXY(i);
    if (Math.abs(x - p.x) < SLOT_S / 2 + 4 && Math.abs(y - p.y) < SLOT_S / 2 + 4) {
      if (st.slots[i] >= 0) { RB.deploySlot(st, i); consume(st); }
      return;
    }
  }
  // lane taps (front gun / upper card area)
  const geo = laneGeom(st.lanes.length);
  for (let li = 0; li < st.lanes.length; li++) {
    const lx = geo.x0 + li * (geo.cw + geo.gap);
    if (x >= lx && x <= lx + geo.cw && y >= LANE_Y && y <= H - 6) {
      if (st.L.tut && st.lanes[li].length) {
        const front = st.guns[st.lanes[li][0]];
        if (game.tut.step === 1 && (li !== 0 || front.c !== 0)) return;      // gray first
        if (game.tut.step === 2 && front.c !== 1) return;                    // yellow now
        if (game.tut.step !== 2 && !game.tut.yellowShown && front.c === 1) return; // no early yellow
      }
      if (st.lanes[li].length) { RB.deployLane(st, li); consume(st); }
      return;
    }
  }
});
function handleUI(id) {
  if (id === 'mute') { AU.toggleMute(); return true; }
  if (id === 'restart') { loadLevel(game.levelIx, 'play'); return true; }
  if (id === 'start' && game.mode === 'intro') { game.mode = 'play'; game.modeT = 0; return true; }
  if (id === 'continue' && game.mode === 'win') { loadLevel(game.levelIx + 1, 'intro'); return true; }
  if (id === 'again' && game.mode === 'win') { loadLevel(0, 'intro'); return true; }
  if (id === 'retry' && game.mode === 'fail') { loadLevel(game.levelIx, 'play'); return true; }
  if (id === 'tut3') { game.tut.step = 0; return true; }
  if (id.startsWith('dbg')) {
    if (id === 'dbgA') {
      if (game.auto) { game.auto = false; return true; }
      const res = RB.solve(RB_LEVELS[game.levelIx], { n: 220 });
      loadLevel(game.levelIx, 'play');
      game.plan = res.plan || []; game.planI = 0; game.auto = true;
      return true;
    }
    if (id === 'dbgS') { game.speed = game.speed === 1 ? 2 : game.speed === 2 ? 4 : 1; return true; }
    if (id === 'dbgR') { // instant reveal for art review
      const st = game.st;
      for (let i = 0; i < st.P.total; i++) if (!st.cleaned[i]) erodeCell(st, i, false);
      return true;
    }
    const ix = +id.slice(3);
    if (!isNaN(ix)) { loadLevel(ix, 'play'); return true; }
  }
  return false;
}
// boot
window.__RB_GAME = game;
if (DEBUG) { window.__RB_DO = doFrame; window.__RB_LOAD = loadLevel; window.__RB_ART = () => ART; }
try {
  loadLevel(0, 'intro');
  requestAnimationFrame(frame);
} catch (e) {
  console.error('[RB] boot failed:', e && e.stack || e);
}
})();
/*==RB_GAME_END==*/
