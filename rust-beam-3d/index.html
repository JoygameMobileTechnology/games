<script>
/*==RB2_CORE_BEGIN==*/
'use strict';
// RUSTBEAM 3D core — pure simulation, no DOM. Shared by game shell and dev checker.
// v2.1: shooters fire from the 5 slots directly (dock layer removed);
//       objects auto-rotate slowly (manual swipe still possible);
//       fail = all 5 slots occupied and ALL idle for stallFail seconds ("line stalled").
const RB2 = (() => {
  const W = 390, H = 844;
  const TUN = {
    burn: 0.07,        // seconds per cell-work (any stage)
    slots: 5,          // firing bays
    fly: 0.35,
    stageT: 0.9,       // stage-transition celebration pause
    objT: 1.15,        // object swap flight
    autoSpin: 0.5,     // rad/s idle auto-rotation
    dragGrace: 0.8,    // seconds after drag release before auto-spin resumes
    spinDamp: 2.6,     // manual angular velocity damping (1/s)
    stallFail: 4.0,    // all-slots-idle duration that fails the level
    stallDebounce: 0.5,// each gun must be idle at least this long to count as stalled
    capMin: 10, capMax: 60,
    dt: 1 / 60, tMax: 400
  };
  const LAYOUT = {
    objX: 195, objY: 268, objS: 118,          // current object center + scale (px per unit)
    queue: [{ x: 292, y: 128, s: 46 }, { x: 340, y: 62, s: 28 }],
    slotY: 505, slotS: 48, slotGap: 10,       // firing bays
    laneY: 575
  };
  const slotX = i => (W - (TUN.slots * LAYOUT.slotS + (TUN.slots - 1) * LAYOUT.slotGap)) / 2 + i * (LAYOUT.slotS + LAYOUT.slotGap) + LAYOUT.slotS / 2;
  const STAGES = 3; // 0 rust->worn, 1 worn->painted, 2 painted->polished
  const STAGE_NAMES = ['CLEAN', 'PAINT', 'POLISH'];

  // ---------- shapes: surfaces of revolution around the X axis ----------
  // profile(s in 0..1) -> [x, r] in local units (x along axis -1..1, r radius)
  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const SHAPES = {
    // pill capsule: flat-ish middle, crisp rounded caps
    capsule: { V: 8, U: 14, len: 1.5, f: s => { const x = s * 2 - 1; const e = Math.min(1, (1 - Math.abs(x)) / 0.30); return [x * 0.92, 0.46 * Math.sin(Math.min(1, e) * Math.PI / 2)]; } },
    // ribbed barrel: bulged body, band ridges, flat chimes — stands upright
    barrel: {
      V: 8, U: 14, len: 1.45, upright: true, f: s => {
        const x = s * 2 - 1;
        let r = 0.36 + 0.20 * Math.cos(x * 1.5);
        r += 0.022 * Math.cos(s * Math.PI * 10);              // hoop ridges
        if (Math.abs(x) > 0.9) r *= 0.82;                     // chime lip
        return [x * 0.85, r];
      }
    },
    // amphora (upright, base to lip): foot, waist, fat belly, neck, flared lip
    vase: {
      V: 10, U: 14, len: 1.6, upright: true, f: s => {
        let r;
        if (s < 0.10) r = 0.26;                               // foot
        else if (s < 0.16) r = 0.17;                          // waist
        else if (s < 0.64) r = 0.17 + 0.40 * Math.sin((s - 0.16) / 0.48 * Math.PI * 0.92); // belly
        else if (s < 0.80) r = 0.30 - (s - 0.64) * 1.05;      // shoulder taper
        else if (s < 0.92) r = 0.132;                         // neck
        else r = 0.21;                                        // flared lip
        return [(s * 2 - 1) * 0.95, Math.max(0.1, r)];
      }
    },
    // dumbbell: two crisp plates + thin grip bar
    dumbbell: {
      V: 10, U: 14, len: 1.7, f: s => {
        const x = s * 2 - 1, ax = Math.abs(x);
        let r;
        if (ax > 0.94) r = 0.20;                              // outer cap
        else if (ax > 0.52) r = 0.46;                         // plate
        else r = 0.13;                                        // bar
        return [x * 0.95, r];
      }
    },
    // hex bolt: chunky hex head, collar, threaded shaft with a blunt tip
    bolt: {
      V: 9, U: 12, len: 1.6, f: s => {
        const x = s * 2 - 1;
        let r;
        if (s < 0.24) r = 0.46;                               // hex head
        else if (s < 0.30) r = 0.30;                          // collar
        else if (s < 0.94) r = 0.22 + 0.022 * Math.cos(s * Math.PI * 34); // threads
        else r = 0.16;                                        // tip chamfer
        return [x * 0.9, r];
      }, hex: 0.3
    },
    // bell (upright, lip to knob): flared sound bow, curved skirt, crown, knob
    bell: {
      V: 10, U: 14, len: 1.5, upright: true, f: s => {
        let r;
        if (s < 0.06) r = 0.60;                               // lip underside
        else if (s < 0.14) r = 0.66;                          // sound bow flare
        else if (s < 0.84) r = 0.16 + 0.46 * Math.pow(1 - (s - 0.14) / 0.70, 1.7); // skirt
        else if (s < 0.92) r = 0.20;                          // crown step
        else r = 0.12;                                        // knob
        return [(s * 2 - 1) * 0.9, r];
      }
    },
    // rocket (upright, nozzle to nose): engine skirt, straight fuselage, needle nose
    rocket: {
      V: 10, U: 12, len: 1.75, upright: true, f: s => {
        let r;
        if (s < 0.10) r = 0.40;                                   // nozzle ring
        else if (s < 0.22) r = 0.37 + (0.22 - s) * 1.5;           // skirt flare
        else if (s < 0.70) r = 0.36;                              // fuselage
        else r = Math.max(0.05, 0.36 * Math.pow(1 - (s - 0.70) / 0.30, 1.4)); // nose cone
        return [(s * 2 - 1) * 0.98, Math.max(0.05, r)];
      }
    },
    // gear: hub, disc, and real radial teeth (mesh modulation on the wide disc)
    gear: { V: 7, U: 16, len: 0.9, f: s => { const x = s * 2 - 1; return [x * 0.5, Math.abs(x) > 0.6 ? 0.26 : 0.5]; }, teeth: 10 },
    // trophy cup (upright): base, stem, bowl, wide mouth lip
    trophy: {
      V: 7, U: 16, len: 1.35, upright: true, f: s => {
        let r;
        if (s < 0.10) r = 0.34;                               // base plate
        else if (s < 0.18) r = 0.22;                          // base neck
        else if (s < 0.34) r = 0.09;                          // stem
        else if (s < 0.86) r = 0.10 + 0.40 * Math.pow((s - 0.34) / 0.52, 0.72); // bowl
        else r = 0.52;                                        // lip
        return [(s * 2 - 1) * 0.9, r];
      }
    }
  };

  // ---------- color patterns over the u,v grid ----------
  // return slot index 0..n-1 (mapped to palette via object def)
  const PATTERNS = {
    bands: (u, v, U, V, n) => Math.min(n - 1, Math.floor(v / V * n)),
    stripes: (u, v, U, V, n) => Math.floor(u / U * n) % n,
    caps: (u, v, U, V, n) => (v < Math.ceil(V * 0.22) || v >= V - Math.ceil(V * 0.22)) ? 1 % n : (n > 2 && Math.abs(v - V / 2) < 1 ? 2 : 0),
    spiral: (u, v, U, V, n) => Math.floor(((u / U + v / V * 1.35) % 1) * n) % n,
    checker: (u, v, U, V, n) => (Math.floor(u / (U / 4)) + Math.floor(v / (V / 2))) % n,
    ring: (u, v, U, V, n) => (Math.abs(v - (V - 1) / 2) <= Math.max(0, V * 0.14)) ? 1 % n : 0
  };

  function buildObject(def, nPal) {
    const shape = SHAPES[def.shape];
    if (!shape) throw new Error('unknown shape ' + def.shape);
    const U = shape.U, V = shape.V, total = U * V;
    const patFn = PATTERNS[def.pattern];
    if (!patFn) throw new Error('unknown pattern ' + def.pattern);
    const map = def.map; // slot -> palette color index
    const color = new Uint8Array(total);
    const counts = new Array(nPal).fill(0);
    for (let v = 0; v < V; v++) for (let u = 0; u < U; u++) {
      const slot = patFn(u, v, U, V, map.length);
      const ci = map[slot];
      color[v * U + u] = ci;
      counts[ci]++;
    }
    // profile samples (v+1 rows) for geometry & targeting
    const px = [], pr = [];
    for (let i = 0; i <= V; i++) { const [x, r] = shape.f(i / V); px.push(x * shape.len); pr.push(r); }
    return { def, shape: def.shape, U, V, total, color, counts, px, pr, len: shape.len };
  }

  // ---------- level parsing / validation ----------
  function parseLevel(L) {
    const nPal = L.pal.length;
    const objects = L.objects.map(d => buildObject(d, nPal));
    const work = new Array(nPal).fill(0); // total cell-works per color (all stages, all objects)
    for (const o of objects) for (let c = 0; c < nPal; c++) work[c] += o.counts[c] * STAGES;
    return { nPal, objects, work };
  }
  function validate(L) {
    const P = parseLevel(L);
    const errs = [], warns = [];
    const capSum = new Array(P.nPal).fill(0), gunCount = new Array(P.nPal).fill(0);
    let guns = 0;
    L.lanes.forEach(lane => lane.forEach(g => {
      capSum[g.c] += g.cap; gunCount[g.c]++; guns++;
      if (g.cap < TUN.capMin || g.cap > TUN.capMax) warns.push(`cap out of ${TUN.capMin}..${TUN.capMax}: c${g.c} cap ${g.cap}`);
    }));
    for (let c = 0; c < P.nPal; c++) {
      if (P.work[c] === 0) { if (capSum[c] > 0) errs.push('guns for unused color ' + c); continue; }
      const diff = capSum[c] - P.work[c];
      if (diff < 0) errs.push(`color ${c}: caps ${capSum[c]} < work ${P.work[c]} (short ${-diff})`);
      else if (diff > Math.ceil(P.work[c] * 0.1)) errs.push(`color ${c}: surplus ${diff} > 10%`);
      else if (diff > 0) warns.push(`color ${c}: surplus ${diff}`);
    }
    return { P, errs, warns, capSum, gunCount, guns };
  }

  // ---------- simulation ----------
  function makeSim(L, opts = {}) {
    const P = parseLevel(L);
    const st = {
      L, P, t: 0, over: false, won: false, failed: false,
      objIx: 0, obj: P.objects[0],
      state: null, claim: null,
      stage: 0,
      stageRemain: null,      // remaining works in current stage for current object
      remainByColor: null,    // remaining works per color, GLOBAL (all objects/stages)
      theta: 0, omega: 0,
      dragging: false, dragCool: 0,
      stallT: 0, stalling: false,
      freezeT: 0, freezeKind: null,  // 'stage' | 'obj'
      guns: [], lanes: [], slots: new Array(TUN.slots).fill(-1),
      events: [],
      idealVis: !!opts.idealVis   // solver mode: every cell counts as visible
    };
    st.remainByColor = P.work.slice();
    L.lanes.forEach((lane, li) => {
      const ids = [];
      lane.forEach(spec => {
        const g = { id: st.guns.length, c: spec.c, cap: spec.cap, cap0: spec.cap, w: spec.w != null ? spec.w : -1, state: 'LANE', slot: -1, tgt: -1, burn: 0, idleT: 0, timer: 0 };
        st.guns.push(g); ids.push(g.id);
      });
      st.lanes.push(ids);
    });
    initObject(st);
    return st;
  }
  function initObject(st) {
    const o = st.obj;
    st.state = new Uint8Array(o.total);      // 0 rust,1 worn,2 painted,3 polished
    st.claim = new Int16Array(o.total).fill(-1);
    st.stage = 0;
    st.stageRemain = o.total;
    st.theta = 0; st.omega = 0;
  }

  const occupiedSlots = st => { let n = 0; for (const s of st.slots) if (s >= 0) n++; return n; };
  const freeSlot = st => { for (let i = 0; i < st.slots.length; i++) if (st.slots[i] < 0) return i; return -1; };

  // visibility: cell u faces camera if its radial angle is within the front window
  function cellVisible(st, u) {
    if (st.idealVis) return true;
    const U = st.obj.U;
    let a = (u + 0.5) / U * Math.PI * 2 + st.theta; // radial angle in world
    const c = Math.cos(a);
    return c > 0.18;
  }
  // screen-x of a cell (object axis lies along screen X) for targeting distance
  function cellScreenX(st, v) {
    const o = st.obj;
    const midX = (o.px[v] + o.px[v + 1]) / 2;
    return LAYOUT.objX + midX * LAYOUT.objS;
  }

  function deployLane(st, li) {
    if (st.over) return false;
    const lane = st.lanes[li];
    if (!lane || !lane.length) return false;
    const g = st.guns[lane[0]];
    const si = freeSlot(st);
    if (si < 0) { st.events.push({ k: 'denied', gun: g.id, why: 'slots' }); return false; }
    lane.shift();
    st.slots[si] = g.id;
    g.state = 'FLY_SLOT'; g.slot = si; g.timer = TUN.fly; g.idleT = 0; g.from = 'lane';
    st.events.push({ k: 'deploy', gun: g.id, from: 'lane', lane: li, slot: si });
    return true;
  }

  function releaseClaim(st, g) { if (g.tgt >= 0) { st.claim[g.tgt] = -1; g.tgt = -1; } }
  function removeEverywhere(st, g) {
    releaseClaim(st, g);
    for (const lane of st.lanes) { const k = lane.indexOf(g.id); if (k >= 0) lane.splice(k, 1); }
    for (let i = 0; i < st.slots.length; i++) if (st.slots[i] === g.id) st.slots[i] = -1;
  }
  function despawn(st, g, why) {
    removeEverywhere(st, g);
    g.state = 'DEAD';
    st.events.push({ k: why === 'content' ? 'content' : 'despawn', gun: g.id });
  }

  function acquire(st, g) {
    const o = st.obj, U = o.U, V = o.V;
    const gx = slotX(g.slot >= 0 ? g.slot : 2);
    let best = -1, bs = Infinity;
    for (let v = 0; v < V; v++) {
      const sx = cellScreenX(st, v);
      const dx = Math.abs(sx - gx);
      for (let u = 0; u < U; u++) {
        const i = v * U + u;
        if (o.color[i] !== g.c) continue;
        if (st.state[i] !== st.stage) continue;
        if (st.claim[i] >= 0) continue;
        if (!cellVisible(st, u)) continue;
        // prefer nearest column to the bay, most-facing cells first
        let a = (u + 0.5) / U * Math.PI * 2 + st.theta;
        const face = Math.cos(a);
        const s = dx + (1 - face) * 55 + v * 0.01 + u * 0.001;
        if (s < bs) { bs = s; best = i; }
      }
    }
    if (best >= 0) { g.tgt = best; st.claim[best] = g.id; }
    return best >= 0;
  }

  function globalWorkLeft(st, c) { return st.remainByColor[c] > 0; }

  function doWork(st, g) {
    const i = g.tgt;
    st.state[i]++;
    st.claim[i] = -1; g.tgt = -1;
    st.stageRemain--;
    const c = st.obj.color[i];
    st.remainByColor[c]--;
    st.events.push({ k: 'work', cell: i, c, stage: st.stage, gun: g.id });
    g.cap--;
    st.events.push({ k: 'cap', gun: g.id, cap: g.cap });
    if (g.cap <= 0) despawn(st, g, 'empty');
    else if (!globalWorkLeft(st, c)) despawn(st, g, 'content');
    // contented-despawn any other gun of a finished color
    if (!globalWorkLeft(st, c)) for (const o of st.guns) if (o.c === c && o.state !== 'DEAD') despawn(st, o, 'content');
    if (st.stageRemain === 0) {
      if (st.stage < STAGES - 1) {
        st.stage++;
        st.stageRemain = st.obj.total;
        st.freezeT = TUN.stageT; st.freezeKind = 'stage';
        st.events.push({ k: 'stagedone', stage: st.stage - 1, next: st.stage });
        for (const o of st.guns) if (o.state === 'SLOT') { releaseClaim(st, o); o.idleT = 0; }
      } else {
        st.events.push({ k: 'objdone', ix: st.objIx });
        if (st.objIx < st.P.objects.length - 1) {
          st.objIx++;
          st.obj = st.P.objects[st.objIx];
          initObject(st);
          st.freezeT = TUN.objT; st.freezeKind = 'obj';
          st.events.push({ k: 'objnext', ix: st.objIx });
          for (const o of st.guns) if (o.state === 'SLOT') { o.tgt = -1; o.idleT = 0; }
        } else {
          st.won = true; st.over = true; st.events.push({ k: 'win' });
        }
      }
    }
  }

  function tick(st, dt) {
    if (st.over) return;
    st.t += dt;
    // rotation: manual flick (damped) + idle auto-spin (ramps back after drag)
    if (st.dragging) st.dragCool = TUN.dragGrace;
    else st.dragCool = Math.max(0, st.dragCool - dt);
    const auto = st.dragging ? 0 : TUN.autoSpin * (1 - st.dragCool / TUN.dragGrace);
    st.theta += (st.omega + auto) * dt;
    st.omega *= Math.exp(-TUN.spinDamp * dt);
    // flights
    for (const g of st.guns) {
      if (g.state === 'FLY_SLOT') { g.timer -= dt; if (g.timer <= 0) { g.state = 'SLOT'; st.events.push({ k: 'slotland', gun: g.id, slot: g.slot }); } }
    }
    // freeze windows (stage fanfare / object swap): no work, no stall accrual
    if (st.freezeT > 0) { st.freezeT -= dt; if (st.stalling) { st.stalling = false; st.stallT = 0; st.events.push({ k: 'stallend' }); } return; }
    // slotted guns: acquire + burn + idle
    for (const g of st.guns) {
      if (g.state !== 'SLOT') continue;
      if (g.tgt >= 0) {
        const i = g.tgt;
        if (st.state[i] !== st.stage || !cellVisible(st, (i % st.obj.U))) { releaseClaim(st, g); }
      }
      if (g.tgt < 0) acquire(st, g);
      if (g.tgt < 0) {
        g.burn = 0;
        g.idleT += dt;
        continue;
      }
      g.idleT = 0;
      g.burn += dt;
      while (g.burn >= TUN.burn && g.tgt >= 0) {
        g.burn -= TUN.burn;
        doWork(st, g);
        if (st.over || st.freezeT > 0) return;
        if (g.state !== 'SLOT') break;
        if (!acquire(st, g)) { g.burn = 0; break; }
      }
    }
    // stall check: all 5 bays occupied, none in transit, every gun idle past debounce
    let stalled = occupiedSlots(st) === TUN.slots;
    if (stalled) for (const id of st.slots) {
      const g = st.guns[id];
      if (!g || g.state !== 'SLOT' || g.idleT < TUN.stallDebounce) { stalled = false; break; }
    }
    if (stalled) {
      if (!st.stalling) { st.stalling = true; st.events.push({ k: 'stall' }); }
      st.stallT += dt;
      if (st.stallT >= TUN.stallFail) { st.failed = true; st.over = true; st.events.push({ k: 'fail' }); }
    } else if (st.stalling) {
      st.stalling = false; st.stallT = 0; st.events.push({ k: 'stallend' });
    }
  }

  // ---------- solver / baselines (ideal rotation) ----------
  function stageWorkOf(st, c) {
    // unclaimed current-stage cells of color c on the current object
    const o = st.obj;
    let n = 0;
    for (let i = 0; i < o.total; i++) if (o.color[i] === c && st.state[i] === st.stage && st.claim[i] < 0) n++;
    return n;
  }
  function marginalWork(st, c) {
    // stage work minus capacity already committed by slotted/incoming guns of the same color
    let committed = 0;
    for (const g of st.guns) if ((g.state === 'SLOT' || g.state === 'FLY_SLOT') && g.c === c) committed += g.cap;
    return stageWorkOf(st, c) - committed;
  }
  function runPolicy(L, mode, onEv) {
    const st = makeSim(L, { idealVis: true });
    let last = -1, stalls = 0, maxStall = 0;
    while (!st.over && st.t < TUN.tMax) {
      if (st.t - last >= 0.25) {
        last = st.t;
        if (freeSlot(st) >= 0) {
          let done = false;
          if (mode === 'spam') {
            for (let li = 0; li < st.lanes.length && !done; li++) {
              const lane = st.lanes[li];
              if (lane.length && stageWorkOf(st, st.guns[lane[0]].c) > 0) done = deployLane(st, li);
            }
            for (let li = 0; li < st.lanes.length && !done; li++) if (st.lanes[li].length) done = deployLane(st, li);
          } else {
            // greedy with wave discipline: guns are chunk-aligned to a (object, stage) wave;
            // deploying only the active wave's guns means every gun dies exactly at its
            // stage boundary — bays always recycle, deadlock is impossible.
            const freeSlots = TUN.slots - occupiedSlots(st);
            let anyActive = false;
            for (const g of st.guns) if ((g.state === 'SLOT' && g.tgt >= 0) || g.state === 'FLY_SLOT') { anyActive = true; break; }
            const wave = st.objIx * STAGES + st.stage;
            const fits = g => (g.w === wave || (g.w < 0 && marginalWork(st, g.c) >= g.cap)) && marginalWork(st, g.c) > 0;
            let bestLane = -1, bestNeed = 0;
            for (let li = 0; li < st.lanes.length; li++) {
              const lane = st.lanes[li];
              if (!lane.length) continue;
              const g = st.guns[lane[0]];
              if (!fits(g)) continue;
              const m = marginalWork(st, g.c);
              if (m > bestNeed) { bestNeed = m; bestLane = li; }
            }
            if (bestLane >= 0) done = deployLane(st, bestLane);
            if (!done && !anyActive && freeSlots >= 2) {
              // dig: a fitting gun is buried — open its lane by deploying the front above it
              // (the dug-out front squats temporarily; its own wave will consume it in full)
              let digLane = -1, digDepth = 99;
              for (let li = 0; li < st.lanes.length; li++) {
                const lane = st.lanes[li];
                for (let d = 1; d < lane.length; d++) {
                  if (fits(st.guns[lane[d]])) { if (d < digDepth) { digDepth = d; digLane = li; } break; }
                }
              }
              if (digLane >= 0) done = deployLane(st, digLane);
            }
          }
        }
      }
      tick(st, TUN.dt);
      if (onEv) for (const e of st.events) onEv(e, st);
      for (const e of st.events) if (e.k === 'stall') stalls++;
      st.events.length = 0;
      if (st.stalling) maxStall = Math.max(maxStall, st.stallT);
    }
    return { won: st.won, failed: st.failed, t: st.t, stalls, maxStall };
  }
  function solve(L) {
    return { greedy: runPolicy(L, 'greedy'), spam: runPolicy(L, 'spam') };
  }

// ---------- particles ----------
function pool(n, mk) { const arr = []; for (let i = 0; i < n; i++) arr.push(Object.assign({ on: false }, mk())); return arr; }
const sparks = pool(260, () => ({ x: 0, y: 0, vx: 0, vy: 0, life: 0, t: 0, col: null, sz: 1, grav: 420 }));
const drops = pool(160, () => ({ x: 0, y: 0, vx: 0, vy: 0, life: 0, t: 0, col: null, sz: 2 }));
const stars = pool(80, () => ({ x: 0, y: 0, life: 0, t: 0, sz: 3 }));

  for (let i = 0; i < n; i++) emit(sparks, p => {
    const a = -Math.PI / 2 + (rnd() - .5) * 2.6;
    const v = (60 + rnd() * 160) * (boost || 1);
    p.x = x + (rnd() - .5) * 4; p.y = y + (rnd() - .5) * 4;
    p.vx = Math.cos(a) * v; p.vy = Math.sin(a) * v;

  });
}
function spawnDrops(x, y, col, n) {
  for (let i = 0; i < n; i++) emit(drops, p => {
    const a = -Math.PI / 2 + (rnd() - .5) * 1.6;
    const v = 40 + rnd() * 110;
    p.x = x + (rnd() - .5) * 8; p.y = y + (rnd() - .5) * 8;
    p.vx = Math.cos(a) * v; p.vy = Math.sin(a) * v;
    p.life = .35 + rnd() * .4; p.col = col; p.sz = 1.6 + rnd() * 2.6;
  });
}

  for (let i = 0; i < n; i++) emit(stars, p => {
    p.x = x + (rnd() - .5) * 26; p.y = y + (rnd() - .5) * 22;
    p.life = .4 + rnd() * .45; p.sz = 2 + rnd() * 3.4;

function updateParticles(dt) {
  for (const p of sparks) if (p.on) { p.t += dt; if (p.t >= p.life) { p.on = false; continue; } p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; }

    g.fillStyle = p.t < p.life * .3 ? '#ff9d3a' : rgbs(darken(p.col, .08));
    g.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz * (1 + Math.abs(p.vy) * .004));
  }
  for (const p of stars) if (p.on) {
    const u = p.t / p.life, a = Math.sin(u * Math.PI);

      g.moveTo(p.x, p.y - s); g.lineTo(p.x, p.y + s);

    g.globalAlpha = (1 - u) * .85;

// ---------- game state ----------
const game = {
  levelIx: 0, st: null, meshes: [],
  mode: 'intro', modeT: 0, t: 0, speed: 1,
  gunFx: new Map(), ghosts: [], beams: [],
  swapT: 0, banner: null, stallTickT: 0,
  drag: null, rotHintT: 0, everRotated: false,
  tut: { step: 0, stallSeen: false, rotShown: false },
  plan: null, auto: false
};
function gfx(id) {
  let f = game.gunFx.get(id);
  if (!f) { f = { popT: 9, shakeT: 9, from: null, badgePop: 1, capSeen: null }; game.gunFx.set(id, f); }
  return f;
}
function loadLevel(ix, mode) {
  game.levelIx = ix;
  const L = RB2_LEVELS[ix];
  game.st = RB2.makeSim(L);
  seed = 1234 + ix * 999;
  if (glok) game.meshes = game.st.P.objects.map(o => buildMeshGL(o));
  // palettes
  if (glok) {
    const pal = [], rust = [], worn = [];
    for (let i = 0; i < 6; i++) {
      const c = hex(L.pal[Math.min(i, L.pal.length - 1)]);
      const r = rustify(c), w = wornify(c);
      pal.push(c.r / 255, c.g / 255, c.b / 255);
      rust.push(r.r / 255, r.g / 255, r.b / 255);
      worn.push(w.r / 255, w.g / 255, w.b / 255);
    }
    gl.useProgram(prog);
    gl.uniform3fv(U.uPal, pal);
    gl.uniform3fv(U.uPalRust, rust);
    gl.uniform3fv(U.uPalWorn, worn);
  }
  game.gunFx.clear(); game.ghosts.length = 0; game.beams.length = 0;
  for (const p of [...sparks, ...drops, ...stars]) p.on = false;
  game.swapT = 0; game.banner = null; game.stallTickT = 0;
  game.mode = mode || 'intro'; game.modeT = 0;
  game.drag = null; game.rotHintT = 0; game.everRotated = false;
  game.tut = { step: L.tut ? 1 : 0, stallSeen: false, rotShown: false };
  AU.humOffAll();
}

// layout helpers (firing bays / lanes)
const SLOT_X0 = (W - (TUN.slots * LAYOUT.slotS + (TUN.slots - 1) * LAYOUT.slotGap)) / 2;

function laneGeom(n) {
  const gap = 10, cw = Math.min(84, (W - 24 - (n - 1) * gap) / n);

}
function laneXY(st, li, depth) {
  const g = laneGeom(st.lanes.length);

}
function gunPose(g) {
  const st = game.st, f = gfx(g.id);
  if (g.state === 'LANE') {
    for (let li = 0; li < st.lanes.length; li++) {
      const d = st.lanes[li].indexOf(g.id);
      if (d >= 0) { const p = laneXY(st, li, Math.min(d, 3.4)); return { x: p.x, y: p.y, s: d === 0 ? 1 : Math.max(.6, .84 - d * .09), depth: d }; }

  }
  if (g.state === 'FLY_SLOT') {
    const u = easeInOut(clamp(1 - g.timer / TUN.fly, 0, 1));
    const to = slotXY(g.slot);
    const from = f.from || to;
    const mx = (from.x + to.x) / 2, my = Math.min(from.y, to.y) - 42;
    const x = lerp(lerp(from.x, mx, u), lerp(mx, to.x, u), u);

}

// ---------- event consumption ----------
function consume(st) {
  for (const e of st.events) {
    if (e.k === 'work') {
      const mesh = game.meshes[st.objIx];
      if (mesh) setCellState(mesh, st.obj, e.cell, e.stage + 1);
      const u = e.cell % st.obj.U, v = (e.cell / st.obj.U) | 0;
      const pl0 = objPlace(0, 0);
      const wp = surfPoint(st.obj, u, v, st.theta, pl0.x, pl0.y, pl0.z, pl0.s * objFit(st.obj));
      const pt = projPt(wp);
      const col = hex(st.L.pal[e.c]);
      if (e.stage === 0) { spawnSparks(pt.x, pt.y, col, 3); }
      else if (e.stage === 1) { spawnDrops(pt.x, pt.y, col, 2); }
      else { if (Math.random() < .5) spawnStars(pt.x, pt.y, 1); }
      AU.work(e.stage, game.t);
    } else if (e.k === 'deploy') {
      const f = gfx(e.gun);
      f.popT = 0;
      f.from = laneXY(st, e.lane != null ? e.lane : 0, 0);
      AU.pop();
      if (st.L.tut && game.tut.step === 1 && st.guns[e.gun].c === 0) { game.tut.step = 0; }
    } else if (e.k === 'slotland') {
      gfx(e.gun).popT = 0;
      AU.thunk();
    } else if (e.k === 'stall') {
      game.stallTickT = 0;
      if (st.L.tut && !game.tut.stallSeen) { game.tut.stallSeen = true; game.tut.step = 3; }
    } else if (e.k === 'despawn' || e.k === 'content') {
      const pose = game.lastPoses.get(e.gun) || slotXY(0);
      const g = st.guns[e.gun];
      game.ghosts.push({ x: pose.x, y: pose.y, col: hex(st.L.pal[g.c]), t: 0 });
      spawnSparks(pose.x, pose.y, hex(st.L.pal[g.c]), 10, 1.1);
      AU.poof(); AU.humOff(e.gun);
    } else if (e.k === 'denied') {
      gfx(e.gun).shakeT = 0; AU.buzz();
    } else if (e.k === 'stagedone') {
      game.banner = { text: e.next === 1 ? 'PAINT!' : 'POLISH!', sub: e.next === 1 ? 'Spray the faded coat back to life' : 'Buff it to a mirror shine', t: 0 };
      AU.fanfare(e.next);
      AU.humOffAll();
    } else if (e.k === 'objdone') {
      AU.chime();
      AU.humOffAll();
    } else if (e.k === 'objnext') {
      game.swapT = TUN.objT;
    } else if (e.k === 'win') {
      game.mode = 'winseq'; game.modeT = 0;
      AU.humOffAll(); AU.win();
      for (let i = 0; i < 50; i++) spawnStars(LAYOUT.objX + (rnd() - .5) * 220, LAYOUT.objY + (rnd() - .5) * 180, 1);
    } else if (e.k === 'fail') {
      game.mode = 'fail'; game.modeT = 0;
      AU.humOffAll(); AU.fail();
    }
  }

}

// ---------- update ----------
let last = performance.now();
game.lastPoses = new Map();
let acc = 0;
function update(now) {
  let dt = Math.min((now - last) / 1000, .1);
  last = now;
  game.t += dt;
  const st = game.st;
  if (game.mode === 'play') {
    acc += dt * game.speed;
    const step = TUN.dt;
    let n = 0;
    while (acc >= step && n < 8) {
      acc -= step; n++;
      RB2.tick(st, step);
      consume(st);
      if (game.mode !== 'play') break;
    }
  } else {
    game.modeT += dt;
    if (game.mode === 'winseq' && game.modeT > 1.6) { game.mode = 'win'; game.modeT = 0; }
  }
  if (game.swapT > 0) game.swapT -= dt;
  if (game.banner) { game.banner.t += dt; if (game.banner.t > 1.6) game.banner = null; }
  // beams + hums
  game.beams.length = 0;
  if (game.mode === 'play' && st.freezeT <= 0) {
    for (const g of st.guns) {
      if (g.state === 'SLOT' && g.tgt >= 0) {
        const u = g.tgt % st.obj.U, v = (g.tgt / st.obj.U) | 0;
        const pl0 = objPlace(0, 0);
        const wp = surfPoint(st.obj, u, v, st.theta, pl0.x, pl0.y, pl0.z, pl0.s * objFit(st.obj));
        const pt = projPt(wp);
        const bx = slotXY(g.slot).x, by = LAYOUT.slotY - 4;
        game.beams.push({ x0: bx, y0: by, x1: pt.x, y1: pt.y, col: hex(st.L.pal[g.c]), id: g.id, stage: st.stage, uv: [(u + .5) / st.obj.U, (v + .5) / st.obj.V] });
        AU.humOn(g.id, g.c, st.stage);
        if (st.stage === 1 && Math.random() < .5) {
          const uu = Math.random();
          emit(drops, p => {
            p.x = lerp(bx, pt.x, .25 + uu * .6) + (rnd() - .5) * 10;
            p.y = lerp(by, pt.y, .25 + uu * .6) + (rnd() - .5) * 10;
            p.vx = (rnd() - .5) * 30; p.vy = -20 - rnd() * 30;
            p.life = .25 + rnd() * .2; p.col = hex(st.L.pal[g.c]); p.sz = 1.2 + rnd() * 1.6;
          });
        }
      } else AU.humOff(g.id);
    }
  } else for (const g of st.guns) AU.humOff(g.id);
  // rotate hint: slotted idle guns while their color has hidden work (manual spin speeds recovery)
  let wantHint = false;
  if (game.mode === 'play' && st.freezeT <= 0) {
    for (const g of st.guns) {
      if (g.state === 'SLOT' && g.tgt < 0 && g.idleT > 1.2 && RB2.stageWorkOf(st, g.c) > 0) { wantHint = true; break; }
    }
  }
  game.rotHintT = wantHint ? game.rotHintT + dt : 0;
  if (game.rotHintT > 0.4 && st.L.tut && !game.tut.rotShown) { game.tut.rotShown = true; game.tut.step = 2; }
  // stall alarm tick
  if (game.mode === 'play' && st.stalling) {
    if (game.tut.step === 3) st.stallT = 0; // freeze the meter while the tutorial explains it
    game.stallTickT += dt;
    if (game.stallTickT > 0.55) { game.stallTickT = 0; AU.tick(); }
  }
  updateParticles(dt);
  for (const f of game.gunFx.values()) { f.popT += dt; f.shakeT += dt; }
  for (let i = game.ghosts.length - 1; i >= 0; i--) { const g = game.ghosts[i]; g.t += dt; if (g.t > .45) game.ghosts.splice(i, 1); }
}

// ---------- GL scene ----------
function drawGLScene() {

  g2.strokeStyle = '#fff'; g2.lineWidth = 3; g2.lineCap = 'round';
  g2.shadowColor = 'rgba(40,55,80,0.6)'; g2.shadowBlur = 4;
  g2.beginPath(); g2.arc(cx, cy, r, a0, a1); g2.stroke();
  for (const [ae, dir] of [[a1, 1], [a0, -1]]) {
    const px = cx + Math.cos(ae) * r, py = cy + Math.sin(ae) * r;
    const tx = -Math.sin(ae) * dir, ty = Math.cos(ae) * dir;
    g2.beginPath();
    g2.moveTo(px + tx * 12 - ty * 7, py + ty * 12 + tx * 7);
    g2.lineTo(px + tx * 14, py + ty * 14);
    g2.lineTo(px + tx * 12 + ty * 7, py + ty * 12 - tx * 7);
    g2.stroke();
  }
  g2.font = '700 12px system-ui,sans-serif';
  g2.fillStyle = '#fff'; g2.textAlign = 'center';
  g2.fillText('swipe', cx, cy + r + 30);
  g2.restore();
}
function dim(g2, a) { g2.fillStyle = `rgba(6,9,18,${a})`; g2.fillRect(0, 0, W, H); }
function card(g2, w, h) {
  const x = (W - w) / 2, y = (H - h) / 2 - 60;
  g2.save();
  g2.shadowColor = 'rgba(0,0,0,0.5)'; g2.shadowBlur = 30; g2.shadowOffsetY = 10;
  rr(g2, x, y, w, h, 20);
  const gr = g2.createLinearGradient(0, y, 0, y + h);
  gr.addColorStop(0, '#2b3554'); gr.addColorStop(1, '#171e33');
  g2.fillStyle = gr; g2.fill();
  g2.restore();
  rr(g2, x + 1, y + 1, w - 2, h - 2, 19);
  g2.strokeStyle = 'rgba(255,255,255,0.12)'; g2.lineWidth = 1.4; g2.stroke();
  return { x, y };
}
function bubble(g2, cx, cy, w, text) {
  const lines = text.split('\n');
  const h = 26 + lines.length * 17;
  rr(g2, cx - w / 2, cy, w, h, 12);
  g2.fillStyle = 'rgba(255,255,255,0.96)'; g2.fill();
  g2.fillStyle = '#1a2233'; g2.font = '700 13px system-ui,sans-serif';
  g2.textAlign = 'center'; g2.textBaseline = 'middle';
  lines.forEach((ln, i) => g2.fillText(ln, cx, cy + 20 + i * 17));
}
function drawHand(g2, x, y) {
  const bob = Math.sin(game.t * 5) * 7;
  g2.save();
  g2.translate(x + 14, y + 34 + bob);
  g2.rotate(-.5);
  g2.fillStyle = '#fff';
  g2.strokeStyle = 'rgba(0,0,0,0.35)'; g2.lineWidth = 2;
  g2.beginPath();
  g2.moveTo(0, -16); g2.lineTo(4.5, -2); g2.lineTo(9, 10); g2.lineTo(-2, 12); g2.lineTo(-8, 2); g2.lineTo(-4.5, -3);
  g2.closePath(); g2.fill(); g2.stroke();
  g2.beginPath(); g2.arc(0, -16, 4.5, 0, TAU); g2.fill(); g2.stroke();
  g2.restore();
}
function drawTutorial(g2) {
  const st = game.st, tut = game.tut;
  if (!tut.step || game.mode !== 'play') return;
  if (tut.step === 1) {
    const p = laneXY(st, 0, 0);
    g2.save();
    g2.fillStyle = 'rgba(6,9,18,0.62)';
    g2.beginPath(); g2.rect(0, 0, W, H);
    g2.arc(p.x, p.y, 42, 0, TAU, true);
    g2.fill('evenodd');
    g2.restore();
    drawHand(g2, p.x, p.y);
    bubble(g2, W / 2, p.y - 120, 260, 'Tap a laser to send it\nto a firing bay!');
  } else if (tut.step === 2) {
    bubble(g2, W / 2, VIEW.y + 26, 292, 'Rusty spots hiding on the back?\nSwipe the object to spin it!');
    hit('tut2', 0, 0, 0, 0);
  } else if (tut.step === 3) {
    g2.save();
    g2.fillStyle = 'rgba(6,9,18,0.62)';
    g2.beginPath(); g2.rect(0, 0, W, H);
    const m = 8;
    rr(g2, SLOT_X0 - m, LAYOUT.slotY - m, TUN.slots * LAYOUT.slotS + (TUN.slots - 1) * LAYOUT.slotGap + m * 2, LAYOUT.slotS + m * 2, 14);
    g2.fill('evenodd');
    g2.restore();
    bubble(g2, W / 2, LAYOUT.slotY - 110, 330, 'All 5 bays idle = the line stalls\nand the meter starts!\nKeep at least one laser working.');
    g2.fillStyle = 'rgba(255,255,255,0.6)'; g2.font = '600 11px system-ui,sans-serif';
    g2.textAlign = 'center';
    g2.fillText('tap to continue', W / 2, LAYOUT.slotY - 26);
    hit('tut3', 0, 0, W, H);
  }
}
function drawIntro(g2) {
  const u = clamp(game.modeT / .4, 0, 1);
  dim(g2, .55 * u);
  g2.save();
  g2.translate(0, (1 - easeOut(u)) * 40);
  const { y } = card(g2, 292, 180);
  g2.textAlign = 'center';
  g2.fillStyle = 'rgba(255,255,255,0.55)'; g2.font = '800 13px system-ui,sans-serif';
  g2.fillText('LEVEL ' + (game.levelIx + 1), W / 2, y + 38);
  g2.fillStyle = '#fff'; g2.font = '800 25px system-ui,sans-serif';
  g2.fillText(game.st.L.name.toUpperCase(), W / 2, y + 76);
  g2.fillStyle = 'rgba(255,255,255,0.6)'; g2.font = '600 12px system-ui,sans-serif';
  g2.fillText(game.st.P.objects.length + (game.st.P.objects.length > 1 ? ' objects' : ' object') + ' to restore', W / 2, y + 104);
  const tp = .55 + .45 * Math.sin(game.t * 4);
  g2.fillStyle = `rgba(255,210,80,${tp})`; g2.font = '800 14px system-ui,sans-serif';
  g2.fillText('TAP TO START', W / 2, y + 142);
  g2.restore();
  hit('start', 0, 0, W, H);
}
function drawWin(g2) {
  const u = clamp(game.modeT / .4, 0, 1);
  dim(g2, .5 * u);
  const { x, y } = card(g2, 292, 196);
  g2.textAlign = 'center';
  g2.fillStyle = '#ffd76e'; g2.font = '800 24px system-ui,sans-serif';
  g2.fillText('LEVEL COMPLETE!', W / 2, y + 46);
  g2.fillStyle = 'rgba(255,255,255,0.75)'; g2.font = '600 14px system-ui,sans-serif';
  g2.fillText('Every piece restored to a shine', W / 2, y + 78);
  btnPill(g2, x + 66, y + 116, 160, 46, game.levelIx < RB2_LEVELS.length - 1 ? 'CONTINUE' : 'FINISH', { r: 61, g: 220, b: 132 }, 'continue');
}
function drawEnd(g2) {
  dim(g2, .6);
  const { x, y } = card(g2, 300, 200);
  g2.textAlign = 'center';
  g2.fillStyle = '#ffd76e'; g2.font = '800 24px system-ui,sans-serif';
  g2.fillText('ALL RESTORED!', W / 2, y + 50);
  g2.fillStyle = 'rgba(255,255,255,0.75)'; g2.font = '600 13px system-ui,sans-serif';
  g2.fillText('The whole workshop gleams again.', W / 2, y + 82);
  btnPill(g2, x + 70, y + 118, 160, 46, 'PLAY AGAIN', { r: 53, g: 209, b: 255 }, 'again');
}
function drawFail(g2) {
  const u = clamp(game.modeT / .4, 0, 1);
  const fl = Math.max(0, 1 - game.modeT * 1.8);
  if (fl > 0) { g2.fillStyle = `rgba(255,40,50,${fl * .3})`; g2.fillRect(0, 0, W, H); }
  if (game.modeT < .8) return;
  dim(g2, .5 * u);
  const { x, y } = card(g2, 292, 186);
  g2.textAlign = 'center';
  g2.fillStyle = '#ff6b6b'; g2.font = '800 26px system-ui,sans-serif';
  g2.fillText('LINE STALLED!', W / 2, y + 50);
  g2.fillStyle = 'rgba(255,255,255,0.7)'; g2.font = '600 13px system-ui,sans-serif';
  g2.fillText('All 5 lasers sat idle too long.', W / 2, y + 80);
  btnPill(g2, x + 66, y + 112, 160, 46, 'RETRY', { r: 255, g: 122, b: 61 }, 'retry');
}
function drawDebug(g2) {
  if (!DEBUG) return;
  g2.font = '700 10px monospace'; g2.textAlign = 'left';
  const y = H - 6;
  let x = 6;
  for (let i = 0; i < RB2_LEVELS.length; i++) {
    const w = 20;
    rr(g2, x, y - 16, w, 16, 4);
    g2.fillStyle = i === game.levelIx ? '#3e5d8f' : '#20293f'; g2.fill();
    g2.fillStyle = '#cfe0ff'; g2.fillText(i + 1, x + 5, y - 4);
    hit('dbg' + i, x, y - 16, w, 16);
    x += w + 3;
  }
  for (const [id, label] of [['dbgS', 'x' + game.speed], ['dbgK', 'SKIP']]) {
    const w = 38;
    rr(g2, x, y - 16, w, 16, 4);
    g2.fillStyle = '#20293f'; g2.fill();
    g2.fillStyle = '#ffd76e'; g2.fillText(label, x + 4, y - 4);
    hit(id, x, y - 16, w, 16);
    x += w + 3;
  }
  const st = game.st;
  g2.fillStyle = '#7f92b8';
  g2.fillText(`t=${st.t.toFixed(1)} fps=${fps | 0} stage=${st.stage} obj=${st.objIx + 1}/${st.P.objects.length} slots=${RB2.occupiedSlots(st)}`, x + 4, y - 4);
}

// ---------- frame ----------
let fps = 60;
function frame(now) {
  requestAnimationFrame(frame);
  try { doFrame(now); }
  catch (e) { if (!frame._err) { frame._err = 1; console.error('[RB2] frame error:', e && e.stack || e); } }
}
setInterval(() => { if (document.hidden) { try { doFrame(performance.now()); } catch (e) { if (!frame._err) { frame._err = 1; console.error('[RB2] frame error:', e && e.stack || e); } } } }, 250);
function doFrame(now) {
  const dtMs = now - (frame._t || now);
  frame._t = now;
  fps = fps * .95 + (1000 / Math.max(dtMs, 1)) * .05;
  update(now);
  HITS.length = 0;
  ctx.save();
  ctx.fillStyle = '#131a28';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.translate(offX, offY); ctx.scale(scale, scale);
  ctx.drawImage(bgC, 0, 0);
  for (const m of motes) {
    const y = (m.y + game.t * 6 * m.s) % H;
    const x = m.x + Math.sin(game.t * m.s + m.p) * 14;
    ctx.globalAlpha = m.a * (0.6 + 0.4 * Math.sin(game.t * m.s * 3 + m.p));
    ctx.fillStyle = m.warm ? '#e8b46a' : '#8fa6c2';
    ctx.beginPath(); ctx.arc(x, y, m.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // contact shadow sized to the current object
  {
    const o = game.st.obj;
    const up = objUpright(o);
    let maxR = 0; for (const r of o.pr) maxR = Math.max(maxR, r);
    const halfW = up ? 175 * maxR : 105 * o.len / 1.5;
    const sy = LAYOUT.objY + (up ? 60 + 92 * o.len / 1.6 : 118);
    const sg = ctx.createRadialGradient(LAYOUT.objX, sy, 2, LAYOUT.objX, sy, halfW);
    sg.addColorStop(0, 'rgba(58,76,102,0.34)'); sg.addColorStop(.7, 'rgba(58,76,102,0.14)'); sg.addColorStop(1, 'rgba(58,76,102,0)');
    ctx.save();
    ctx.translate(LAYOUT.objX, sy); ctx.scale(1, 0.14); ctx.translate(-LAYOUT.objX, -sy);
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(LAYOUT.objX, sy, halfW, 0, TAU); ctx.fill();
    ctx.restore();
  }
  // 3D scene
  drawGLScene();
  ctx.drawImage(glC, VIEW.x, VIEW.y, VIEW.w, VIEW.h);
  // queue labels
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.font = '700 9px system-ui,sans-serif'; ctx.textAlign = 'center';
  if (game.st.objIx + 1 < game.st.P.objects.length) ctx.fillText('NEXT', 292, 82);
  drawSlots(ctx);
  drawLanes(ctx);
  // slotted + flying guns
  const st = game.st;
  game.lastPoses.clear();
  const fly = [];
  for (const g of st.guns) {
    if (g.state === 'DEAD' || g.state === 'LANE') continue;
    const pose = gunPose(g);
    if (!pose) continue;
    game.lastPoses.set(g.id, pose);
    if (g.state === 'FLY_SLOT') fly.push([g, pose]);
    else drawGun(g, pose);
  }
  drawGhosts(ctx);
  drawBeams(ctx);
  for (const [g, pose] of fly) drawGun(g, pose);
  drawParticles(ctx);
  drawHUD(ctx);
  drawBanner(ctx);
  drawRotateHint(ctx);
  drawTutorial(ctx);
  if (game.mode === 'intro') drawIntro(ctx);
  else if (game.mode === 'win') { if (game.levelIx < RB2_LEVELS.length - 1) drawWin(ctx); else drawEnd(ctx); }
  else if (game.mode === 'fail') drawFail(ctx);
  drawDebug(ctx);
  ctx.restore();
}

// ---------- input ----------
function toDesign(ev) { return { x: (ev.clientX - offX) / scale, y: (ev.clientY - offY) / scale }; }
cv.addEventListener('pointerdown', ev => {
  AU.unlock();
  const p = toDesign(ev);
  game.drag = { x0: p.x, y0: p.y, x: p.x, y: p.y, t0: performance.now(), moved: 0, vel: 0, lastX: p.x, lastT: performance.now(), inView: p.y > VIEW.y && p.y < VIEW.y + VIEW.h && game.mode === 'play' };
  if (game.drag.inView) { game.st.omega = 0; game.st.dragging = true; }
});
cv.addEventListener('pointermove', ev => {
  if (!game.drag) return;
  const p = toDesign(ev);
  const d = game.drag;
  const dx = p.x - (d.lastX != null ? d.lastX : p.x);
  d.moved += Math.abs(p.x - d.x) + Math.abs(p.y - d.y);
  d.x = p.x; d.y = p.y;
  if (d.inView && d.moved > 6) {
    game.st.theta -= dx * 0.012;
    const nowT = performance.now();
    const dtm = Math.max(1, nowT - d.lastT);
    d.vel = -dx / dtm * 1000 * 0.012;
    d.lastT = nowT;
    game.everRotated = true;
    if (game.tut.step === 2) game.tut.step = 0;
  }
  d.lastX = p.x;
});
addEventListener('pointerup', ev => {
  const d = game.drag;
  game.drag = null;
  game.st.dragging = false;
  if (!d) return;
  const p = toDesign(ev);
  const quick = performance.now() - d.t0 < 320 && d.moved < 9;
  if (d.inView && !quick) {
    game.st.omega = clamp(d.vel, -14, 14);
    return;
  }
  if (!quick) return;
  // tap
  for (let i = HITS.length - 1; i >= 0; i--) {
    const h = HITS[i];
    if (p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h) {
      if (handleUI(h.id)) return;
    }
  }
  if (game.mode !== 'play') return;
  const st = game.st;
  const geo = laneGeom(st.lanes.length);
  for (let li = 0; li < st.lanes.length; li++) {
    const lx = geo.x0 + li * (geo.cw + geo.gap);
    if (p.x >= lx && p.x <= lx + geo.cw && p.y >= LAYOUT.laneY && p.y <= H - 6) {
      if (st.L.tut && game.tut.step === 1 && li !== 0) return;
      if (st.lanes[li].length) { RB2.deployLane(st, li); consume(st); }
      return;
    }
  }
});
function handleUI(id) {
  if (id === 'mute') { AU.toggleMute(); return true; }
  if (id === 'restart') { loadLevel(game.levelIx, 'play'); return true; }
  if (id === 'start' && game.mode === 'intro') { game.mode = 'play'; game.modeT = 0; return true; }
  if (id === 'continue' && game.mode === 'win') { loadLevel(game.levelIx + 1, 'intro'); return true; }
  if (id === 'again' && game.mode === 'win') { loadLevel(0, 'intro'); return true; }
  if (id === 'retry' && game.mode === 'fail') { loadLevel(game.levelIx, 'play'); return true; }
  if (id === 'tut3') { game.tut.step = 0; return true; }
  if (id.startsWith('dbg')) {
    if (id === 'dbgS') { game.speed = game.speed === 1 ? 2 : game.speed === 2 ? 4 : 1; return true; }
    if (id === 'dbgK') { // finish current stage instantly (debug)
      const st = game.st, o = st.obj;
      for (let i = 0; i < o.total; i++) if (st.state[i] === st.stage) {
        st.state[i]++; st.stageRemain--; st.remainByColor[o.color[i]]--;
        const mesh = game.meshes[st.objIx];
        if (mesh) setCellState(mesh, o, i, st.state[i]);
      }
      // trigger transition logic via a tiny synthetic work pass
      if (st.stageRemain <= 0) {
        if (st.stage < 2) { st.stage++; st.stageRemain = o.total; st.freezeT = TUN.stageT; game.banner = { text: st.stage === 1 ? 'PAINT!' : 'POLISH!', sub: '', t: 0 }; }
        else if (st.objIx < st.P.objects.length - 1) { st.objIx++; st.obj = st.P.objects[st.objIx]; st.state = new Uint8Array(st.obj.total); st.claim = new Int16Array(st.obj.total).fill(-1); st.stage = 0; st.stageRemain = st.obj.total; st.theta = 0; st.omega = 0; st.freezeT = TUN.objT; game.swapT = TUN.objT; }
        else { st.won = true; st.over = true; game.mode = 'winseq'; game.modeT = 0; }
      }
      for (const g of st.guns) if (g.state === 'SLOT') { g.tgt = -1; g.idleT = 0; }
      return true;
    }
    const ix = +id.slice(3);
    if (!isNaN(ix)) { loadLevel(ix, 'play'); return true; }
  }
  return false;
}

// boot
window.__RB2_GAME = game;
if (DEBUG) { window.__RB2_DO = doFrame; window.__RB2_LOAD = loadLevel; }
try {
  loadLevel(0, 'intro');
  requestAnimationFrame(frame);
} catch (e) {
  console.error('[RB2] boot failed:', e && e.stack || e);
}
})();
/*==RB2_GAME_END==*/
</script>
