<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cube Colony! — Prototype</title>
<style>
  :root {
    --ink: #7a4a1f;
    --ink-soft: #a8895f;
    --cream: #fdf6e8;
    --green: #6fc94b;
    --green-dark: #4da332;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(120% 100% at 50% 0%, #3c3540 0%, #262128 100%);
    display: flex; align-items: center; justify-content: center;
    user-select: none; color: var(--ink);
  }

  /* ---------- the phone frame: the game is portrait-only ---------- */
  #frame {
    position: relative;
    height: min(100vh, calc(100vw * 844 / 390));
    aspect-ratio: 390 / 844;
    overflow: hidden;
    border-radius: 22px;
    box-shadow: 0 0 0 6px #17141a, 0 18px 60px rgba(0,0,0,.55);
    /* picnic blanket (reference footage) */
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 34px, rgba(140,80,20,.06) 34px 68px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.04) 0 34px, rgba(150,90,30,.07) 34px 68px),
      linear-gradient(#f8d29a 0%, #f3c185 55%, #edb672 100%);
  }
  #stage { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }

  /* ---------- top HUD ---------- */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; flex-direction: column; gap: 5px;
    padding: 10px 10px 4px;
    pointer-events: none;
  }
  .topbar button { pointer-events: auto; }
  .top-row { display: flex; align-items: center; gap: 6px; }
  .top-side { display: flex; gap: 6px; flex: 1; }
  .top-side.right { justify-content: flex-end; }
  .level-title {
    border: none; background: none; cursor: pointer;
    font-size: 21px; font-weight: 900; color: var(--ink);
    text-shadow: 0 2px 0 rgba(255,255,255,.45);
    letter-spacing: .3px; white-space: nowrap;
  }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 11px;
    border: none; cursor: pointer; font-size: 15px; font-weight: 800;
    color: #fff; background: #6e8be8;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.22), 0 2px 5px rgba(120,70,20,.25);
  }
  .march-btn {
    height: 34px; padding: 0 12px; border-radius: 17px; border: none; cursor: pointer;
    font-size: 13.5px; font-weight: 900; color: #6b5335; background: #fff;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.12), 0 2px 5px rgba(120,70,20,.25);
  }
  .march-btn.active { background: var(--green); color: #fff;
    box-shadow: inset 0 -3px 0 var(--green-dark), 0 2px 6px rgba(80,140,30,.4); }
  .census { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
  .chip {
    display: flex; align-items: center; gap: 4px;
    background: var(--cream); border-radius: 999px; padding: 2px 8px 2px 4px;
    font-size: 12px; font-weight: 800; color: var(--ink);
    box-shadow: inset 0 -2px 0 rgba(150,100,40,.18), 0 1px 3px rgba(120,70,20,.18);
  }
  .chip.done { opacity: .45; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block;
         box-shadow: inset 0 -2px 2px rgba(0,0,0,.2); }

  /* ---------- rotate hint ---------- */
  .rotate-hint {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 31%; z-index: 9; pointer-events: none;
    background: rgba(90, 55, 20, .8); color: #ffedc9;
    border-radius: 999px; padding: 5px 13px; font-size: 12.5px; font-weight: 700;
    display: flex; align-items: center; gap: 5px;
    animation: hintFloat 2.2s ease-in-out infinite;
  }
  @keyframes hintFloat { 50% { transform: translateX(-50%) translateY(-4px); } }
  .hidden { display: none !important; }

  /* ---------- toasts ---------- */
  .toasts {
    position: absolute; top: 84px; left: 50%; transform: translateX(-50%);
    z-index: 30; display: flex; flex-direction: column; gap: 8px; align-items: center;
    pointer-events: none; width: 92%;
  }
  .toast {
    background: rgba(90, 55, 20, .88); color: #fff3da;
    padding: 8px 15px; border-radius: 14px; font-size: 13px; text-align: center;
    opacity: 0; transform: translateY(-8px); transition: all .35s ease;
    box-shadow: 0 4px 14px rgba(80,45,10,.3);
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.intro { background: var(--cream); color: var(--ink); }
  .intro-title { font-weight: 900; font-size: 15px; margin-bottom: 3px; }
  .intro-hint { font-size: 12.5px; color: var(--ink-soft); }

  /* ---------- bottom: slot rail + yard lanes ---------- */
  .bottom {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
    display: flex; flex-direction: column; gap: 8px;
    padding: 6px 10px 14px;
  }
  .panel { display: flex; justify-content: center; }
  .slots { display: flex; gap: 8px; justify-content: center; min-height: 60px; }
  .slot {
    width: 54px; height: 58px; border-radius: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  .slot.empty {
    background: rgba(255,255,255,.92);
    box-shadow: inset 0 3px 6px rgba(140,90,30,.18), 0 2px 4px rgba(120,70,20,.15);
  }
  .yard { display: flex; gap: 9px; justify-content: center; align-items: flex-start;
          max-width: 100%; }
  .yard-col { display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .yard-col-empty { width: 46px; }
  .yard-empty { color: var(--ink-soft); font-size: 12px; padding: 10px; font-weight: 700; }
  .more-chip {
    font-size: 10px; font-weight: 900; color: #fff;
    background: rgba(90,55,20,.55); border-radius: 999px; padding: 1px 8px;
  }

  /* ---------- boxes ---------- */
  .box {
    position: relative; width: 52px; height: 56px; border-radius: 13px;
    cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform .12s ease, filter .2s ease;
    font-size: 0;
  }
  .box.small { width: 40px; height: 40px; border-radius: 10px; }
  .box:active { transform: scale(.94); }
  .box.wild { background: conic-gradient(#e8485c, #ffd44d, #7bd64e, #5fc9ee, #9f7bf5, #e8485c);
    box-shadow: inset 0 -0.28em 0 rgba(0,0,0,.25), 0 3px 6px rgba(120,70,20,.25); }
  .box-num {
    font-size: 20px; font-weight: 900; color: #fff;
    text-shadow: 0 2px 0 rgba(0,0,0,.22);
  }
  .box.small .box-num { font-size: 16px; }
  .box-ant {
    position: absolute; top: -13px; left: 50%; transform: translateX(-50%);
    font-size: 13px; animation: antBounce .5s ease-in-out infinite; pointer-events: none;
  }
  @keyframes antBounce { 50% { transform: translateX(-50%) translateY(-3px); } }
  .box.waiting { filter: saturate(.5) brightness(.95); }
  .zzz {
    position: absolute; top: -15px; left: 3px; font-size: 10px; font-weight: 900;
    color: #6b5335; animation: zzz 1.6s ease-in-out infinite; pointer-events: none;
  }
  @keyframes zzz { 50% { transform: translateY(-3px); opacity: .5; } }
  .box.front { outline: 3px solid rgba(255,255,255,.9); outline-offset: 1px; }
  .box.locked { filter: saturate(.55) brightness(1.06); opacity: .92; cursor: default; }
  .tap-label {
    position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%);
    background: #7a4a1f; color: #ffedc9; font-size: 8.5px; font-weight: 900;
    padding: 1px 7px; border-radius: 7px; letter-spacing: .8px; pointer-events: none;
    z-index: 2;
  }
  .box.previewing { outline: 3px solid #fff; box-shadow: 0 0 16px rgba(255,255,255,.95) !important; }
  .box.recallable { outline: 3px dashed #e8485c; animation: recallPulse .8s ease-in-out infinite; }
  @keyframes recallPulse { 50% { outline-color: #ffb3ab; } }

  /* ---------- boosters ---------- */
  .boosters {
    position: absolute; right: 8px; bottom: 33%; z-index: 11;
    display: flex; flex-direction: column; gap: 8px;
  }
  .booster {
    position: relative; width: 44px; height: 44px; border-radius: 50%;
    border: none; background: var(--cream);
    font-size: 17px; cursor: pointer;
    box-shadow: inset 0 -3px 0 rgba(150,100,40,.2), 0 3px 8px rgba(120,70,20,.3);
  }
  .booster:disabled { opacity: .38; cursor: default; }
  .b-count {
    position: absolute; top: -4px; right: -4px; background: var(--green); color: #fff;
    border-radius: 999px; min-width: 17px; height: 17px; font-size: 10.5px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 3px rgba(60,110,20,.5);
  }
  .recall-banner {
    position: absolute; bottom: 36%; left: 50%; transform: translateX(-50%);
    background: #e8485c; color: #fff; font-weight: 800; font-size: 12.5px;
    padding: 8px 15px; border-radius: 999px; z-index: 12; cursor: pointer;
    box-shadow: 0 4px 12px rgba(170,40,40,.4);
  }

  /* ---------- modal ---------- */
  .modal-root {
    position: absolute; inset: 0; z-index: 40;
    background: rgba(80, 50, 20, .38); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
  }
  .modal-card {
    background: var(--cream); border-radius: 22px; padding: 20px 20px;
    width: 86%; max-height: 80%; overflow-y: auto; text-align: center;
    box-shadow: 0 12px 40px rgba(70,40,10,.4);
    animation: cardIn .3s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes cardIn { from { transform: scale(.85); opacity: 0; } }
  .modal-title { font-size: 19px; font-weight: 900; margin-bottom: 8px; }
  .modal-body { font-size: 13px; color: #8a6a44; line-height: 1.5; margin-bottom: 14px; }
  .modal-buttons { display: flex; flex-direction: column; gap: 7px; }
  .modal-btn {
    padding: 11px 14px; border-radius: 13px; border: none;
    background: #f0e2c8; font-size: 14px; font-weight: 800; cursor: pointer; color: var(--ink);
    box-shadow: inset 0 -3px 0 rgba(150,100,40,.18);
  }
  .modal-btn.primary { background: var(--green); color: #fff;
    box-shadow: inset 0 -3px 0 var(--green-dark); }
  .win-stats { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 800;
    color: var(--ink); margin-bottom: 8px; }
  .win-lore { font-size: 12px; color: var(--ink-soft); font-style: italic; }
  .help { text-align: left; }
  .help p { margin-bottom: 8px; }
</style>
</head>
<body>
<div id="frame">
  <canvas id="stage"></canvas>
</div>
