<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Bee Colony! — Prototype</title>
<style>
  :root {
    --ink: #7a4a1f;
    --ink-soft: #a8895f;
    --cream: #fdf6e8;
    --green: #6fc94b;
    --green-dark: #4da332;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(120% 100% at 50% 0%, #3c3540 0%, #262128 100%);
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; color: var(--ink);
    position: fixed; inset: 0;                 /* iOS: no rubber-band scrolling */
    overscroll-behavior: none; touch-action: none;
  }

  /* ---------- the phone frame: the game is portrait-only ---------- */
  #frame {
    position: relative;
    height: min(100dvh, calc(100vw * 844 / 390));
    aspect-ratio: 390 / 844;
    overflow: hidden;
    border-radius: 22px;
    box-shadow: 0 0 0 6px #17141a, 0 18px 60px rgba(0,0,0,.55);
    /* warm honey blanket + a subtle honeycomb weave + soft vignette */
    background:
      radial-gradient(130% 90% at 50% 108%, rgba(120,60,10,.16) 0%, rgba(120,60,10,0) 42%),
      radial-gradient(140% 100% at 50% -12%, rgba(255,250,235,.35) 0%, rgba(255,250,235,0) 38%),
      url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='56' height='97'%3E%3Cg fill='none' stroke='%23a05c14' stroke-opacity='0.10' stroke-width='2'%3E%3Cpath d='M28 0 L56 16 L56 48 L28 64 L0 48 L0 16 Z'/%3E%3Cpath d='M28 64 L56 80 L56 112 L28 128 L0 112 L0 80 Z'/%3E%3Cpath d='M0 48 L-28 64 M56 48 L84 64'/%3E%3C/g%3E%3C/svg%3E"),
      linear-gradient(#f9d193 0%, #f5c07b 55%, #eeb166 100%);
    background-size: auto, auto, 56px 97px, auto;
  }
  /* grass tufts peeking in at the frame edges */
  #frame::before, #frame::after {
    content: ''; position: absolute; z-index: 1; pointer-events: none;
    width: 130px; height: 60px; bottom: -12px;
    background:
      radial-gradient(28px 44px at 20% 100%, #9ccb5f 98%, transparent),
      radial-gradient(24px 38px at 45% 100%, #8bc054 98%, transparent),
      radial-gradient(30px 48px at 72% 100%, #a3d168 98%, transparent),
      radial-gradient(22px 34px at 95% 100%, #8bc054 98%, transparent);
    opacity: .9;
  }
  #frame::before { left: -18px; transform: rotate(3deg); }
  #frame::after { right: -18px; transform: rotate(-3deg) scaleX(-1); }
  #stage { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }

  /* ---------- top HUD ---------- */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; flex-direction: column; gap: 5px;
    padding: 10px 10px 4px;
    pointer-events: none;
  }
  .topbar button { pointer-events: auto; }
  .top-row { display: flex; align-items: center; gap: 6px; }
  .top-side { display: flex; gap: 6px; flex: 1; }
  .top-side.right { justify-content: flex-end; }
  .level-title {
    border: none; background: none; cursor: pointer;
    font-size: 21px; font-weight: 900; color: var(--ink);
    text-shadow: 0 2px 0 rgba(255,255,255,.45);
    letter-spacing: .3px; white-space: nowrap;
  }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 11px;
    border: none; cursor: pointer; font-size: 15px; font-weight: 800;
    color: #fff; background: #6e8be8;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.22), 0 2px 5px rgba(120,70,20,.25);
  }
  .march-btn {
    height: 34px; padding: 0 12px; border-radius: 17px; border: none; cursor: pointer;
    font-size: 13.5px; font-weight: 900; color: #6b5335; background: #fff;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.12), 0 2px 5px rgba(120,70,20,.25);
  }
  .march-btn.active { background: var(--green); color: #fff;
    box-shadow: inset 0 -3px 0 var(--green-dark), 0 2px 6px rgba(80,140,30,.4); }
  .census { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
  .chip {
    display: flex; align-items: center; gap: 4px;
    background: var(--cream); border-radius: 999px; padding: 2px 8px 2px 4px;
    font-size: 12px; font-weight: 800; color: var(--ink);
    box-shadow: inset 0 -2px 0 rgba(150,100,40,.18), 0 1px 3px rgba(120,70,20,.18);
  }
  .chip.done { opacity: .45; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block;
         box-shadow: inset 0 -2px 2px rgba(0,0,0,.2); }

  /* ---------- rotate hint ---------- */
  .rotate-hint {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 31%; z-index: 9; pointer-events: none;
    background: rgba(90, 55, 20, .8); color: #ffedc9;
    border-radius: 999px; padding: 5px 13px; font-size: 12.5px; font-weight: 700;
    display: flex; align-items: center; gap: 5px;
    animation: hintFloat 2.2s ease-in-out infinite;
  }
  @keyframes hintFloat { 50% { transform: translateX(-50%) translateY(-4px); } }
  .hidden { display: none !important; }

  /* ---------- toasts ---------- */
  .toasts {
    position: absolute; top: 84px; left: 50%; transform: translateX(-50%);
    z-index: 30; display: flex; flex-direction: column; gap: 8px; align-items: center;
    pointer-events: none; width: 92%;
  }
  .toast {
    background: rgba(90, 55, 20, .88); color: #fff3da;
    padding: 8px 15px; border-radius: 14px; font-size: 13px; text-align: center;
    opacity: 0; transform: translateY(-8px); transition: all .35s ease;
    box-shadow: 0 4px 14px rgba(80,45,10,.3);
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.intro { background: var(--cream); color: var(--ink); }
  .intro-title { font-weight: 900; font-size: 15px; margin-bottom: 3px; }
  .intro-hint { font-size: 12.5px; color: var(--ink-soft); }

  /* boxes and lanes are real 3D objects rendered on the canvas */

  /* ---------- level select grid ---------- */
  .level-grid {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px;
    margin-top: 8px;
  }
  .level-cell {
    padding: 9px 0; border: none; border-radius: 10px; cursor: pointer;
    background: #f0e2c8; color: var(--ink); font-weight: 900; font-size: 13px;
    box-shadow: inset 0 -3px 0 rgba(150,100,40,.18);
  }
  .level-cell.skull { background: #e9d6f5; }

  /* ---------- boosters ---------- */
  .boosters {
    position: absolute; right: 8px; bottom: 33%; z-index: 11;
    display: flex; flex-direction: column; gap: 8px;
  }
  .booster {
    position: relative; width: 44px; height: 44px; border-radius: 50%;
    border: none; background: var(--cream);
    font-size: 17px; cursor: pointer;
    box-shadow: inset 0 -3px 0 rgba(150,100,40,.2), 0 3px 8px rgba(120,70,20,.3);
  }
  .booster:disabled { opacity: .38; cursor: default; }
  .b-count {
    position: absolute; top: -4px; right: -4px; background: var(--green); color: #fff;
    border-radius: 999px; min-width: 17px; height: 17px; font-size: 10.5px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 3px rgba(60,110,20,.5);
  }
  .recall-banner {
    position: absolute; bottom: 36%; left: 50%; transform: translateX(-50%);
    background: #e8485c; color: #fff; font-weight: 800; font-size: 12.5px;
    padding: 8px 15px; border-radius: 999px; z-index: 12; cursor: pointer;
    box-shadow: 0 4px 12px rgba(170,40,40,.4);
  }

  /* ---------- modal ---------- */
  .modal-root {
    position: absolute; inset: 0; z-index: 40;
    background: rgba(80, 50, 20, .38); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
  }
  .modal-card {
    background: var(--cream); border-radius: 22px; padding: 20px 20px;
    width: 86%; max-height: 80%; overflow-y: auto; text-align: center;
    box-shadow: 0 12px 40px rgba(70,40,10,.4);
    animation: cardIn .3s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes cardIn { from { transform: scale(.85); opacity: 0; } }
  .modal-title { font-size: 19px; font-weight: 900; margin-bottom: 8px; }
  .modal-body { font-size: 13px; color: #8a6a44; line-height: 1.5; margin-bottom: 14px; }
  .modal-buttons { display: flex; flex-direction: column; gap: 7px; }
  .modal-btn {
    padding: 11px 14px; border-radius: 13px; border: none;
    background: #f0e2c8; font-size: 14px; font-weight: 800; cursor: pointer; color: var(--ink);
    box-shadow: inset 0 -3px 0 rgba(150,100,40,.18);
  }
  .modal-btn.primary { background: var(--green); color: #fff;
    box-shadow: inset 0 -3px 0 var(--green-dark); }
  .win-stats { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 800;
    color: var(--ink); margin-bottom: 8px; }
  .win-lore { font-size: 12px; color: var(--ink-soft); font-style: italic; }
  .help { text-align: left; }
  .help p { margin-bottom: 8px; }
  /* real phones / tablets: fill the whole screen, no bezel, honor the notch */
  @media (pointer: coarse) {
    #frame {
      width: 100vw; height: 100dvh; aspect-ratio: auto;
      border-radius: 0; box-shadow: none;
    }
    #frame::before, #frame::after { display: none; }
    .topbar { padding-top: calc(10px + env(safe-area-inset-top)); }
    .boosters { right: calc(8px + env(safe-area-inset-right)); }
  }
</style>
</head>
<body>
<div id="frame">
  <canvas id="stage"></canvas>
</div>
