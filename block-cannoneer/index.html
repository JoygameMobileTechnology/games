<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover + the safe-area insets used in style.css are what keep the
      HUD clear of the notch and the home indicator on iOS.
      user-scalable=no / maximum-scale=1 stop a double-tap-to-fire from being
      interpreted as a zoom gesture.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#89c9ff" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Block Cannoneer — a 3D physics destruction puzzle. Find the soft spot, drop the tower."
    />
    <title>Block Cannoneer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2389c9ff'/%3E%3Crect x='7' y='16' width='8' height='9' rx='1.5' fill='%23e2a86b'/%3E%3Crect x='17' y='16' width='8' height='9' rx='1.5' fill='%23e2a86b'/%3E%3Crect x='6' y='9' width='20' height='6' rx='1.5' fill='%23b8bdc6'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="./assets/index-DV_p4PsK.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DYlLA_xK.css">
  </head>
  <body>
    <!-- The 3D game renders here. All UI is a DOM overlay above it. -->
    <canvas id="game-canvas"></canvas>

    <!-- ui/ mounts every screen and the HUD into this root. -->
    <div id="ui-root"></div>

    <!-- Shown by CSS media query only when the device is held in landscape. -->
    <div id="rotate-card" aria-hidden="true">
      <div class="rotate-inner">
        <div class="rotate-icon">📱</div>
        <h2>Rotate your device</h2>
        <p>Block Cannoneer is played in portrait.</p>
      </div>
    </div>

    <!-- Replaced by the app once boot completes; also the fallback if WebGL fails. -->
    <div id="boot-screen">
      <div class="boot-inner">
        <div class="boot-title">BLOCK CANNONEER</div>
        <div class="boot-bar"><div class="boot-bar-fill"></div></div>
        <div class="boot-status">Loading physics…</div>
      </div>
    </div>

    <noscript>
      <div style="padding: 2rem; font-family: system-ui; text-align: center">
        Block Cannoneer needs JavaScript enabled.
      </div>
    </noscript>

  </body>
</html>
