<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Bee Colony Remaster</title>
<style>
  :root {
    --navy: #16204a;
    --navy-deep: #0f1636;
    --panel: #1c2650;
    --blue: #3b7ff0;
    --blue-dark: #2358c4;
    --green: #5bd24a;
    --green-dark: #3aa22c;
    --gold: #ffc531;
    --gold-dark: #d99612;
    --text: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(120% 100% at 50% 0%, #2a2437 0%, #17131c 100%);
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; color: var(--text);
    position: fixed; inset: 0;
    overscroll-behavior: none; touch-action: none;
  }

  /* ---------- the phone frame: the game is portrait-only ---------- */
  #frame {
    position: relative;
    height: min(100dvh, calc(100vw * 844 / 390));
    aspect-ratio: 390 / 844;
    overflow: hidden;
    border-radius: 22px;
    box-shadow: 0 0 0 6px #17141a, 0 18px 60px rgba(0,0,0,.55);
    /* default = Sarı (art pick, 28 Sep 2026); data-bg 1-5 = the other variants from settings */
    background: radial-gradient(120% 70% at 50% 35%, #fff9dc 0%, #ffe8a3 45%, #f5d476 100%);
  }
  #frame[data-bg="1"] { background: radial-gradient(120% 70% at 50% 35%, #223070 0%, #182552 45%, #101a40 100%); }
  #frame[data-bg="2"] { background: radial-gradient(120% 70% at 50% 35%, #1f5a45 0%, #153d31 45%, #0b2620 100%); }
  #frame[data-bg="3"] { background: radial-gradient(120% 70% at 50% 35%, #6a4416 0%, #46290a 45%, #261604 100%); }
  #frame[data-bg="4"] { background: radial-gradient(120% 70% at 50% 35%, #ffffff 0%, #f2f4f8 45%, #dde1ea 100%); }
  #frame[data-bg="5"] { background: radial-gradient(120% 70% at 50% 35%, #e2e6ee 0%, #c8cdd8 45%, #aab1bf 100%); }
  /* light backdrops: dark title text, the toast/balloon keep their own boxes */
  #frame[data-light="1"] .level-title { color: #22233a; text-shadow: 0 1px 0 rgba(255,255,255,.6); }
  #frame[data-light="1"] .strip-cell { background: rgba(20,24,50,.16); }
  #frame[data-light="1"] .strip-cell.current { background: #fff; box-shadow: 0 0 0 2px rgba(20,24,50,.25); }
  #stage { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  .modal-label { margin: 10px 0 6px; font-size: 11px; font-weight: 900; letter-spacing: .6px; color: #9fb0e8; text-transform: uppercase; }
  .bg-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .bg-swatch {
    width: 44px; height: 44px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); cursor: pointer;
    position: relative; box-shadow: inset 0 -3px 0 rgba(0,0,0,.2), 0 2px 5px rgba(0,0,0,.35);
  }
  .bg-swatch.active { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,197,49,.35), 0 2px 5px rgba(0,0,0,.35); }
  .bg-swatch span { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 3px; font-size: 9px; font-weight: 800; color: #c7cdea; white-space: nowrap; }
  .bg-row { padding-bottom: 14px; }
  .hard-tag {
    display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px; vertical-align: 3px;
    background: #ff3b5c; color: #fff; font-size: 10px; font-weight: 900; letter-spacing: .6px;
    box-shadow: 0 2px 0 #a3132c;
  }
  .hidden { display: none !important; }

  /* ---------- in-game HUD (Cube Land measurements, 390x844 base) ---------- */
  .hud { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .coin-pill {
    position: absolute; left: 12px; top: 50px; height: 31px;
    display: flex; align-items: center; gap: 4px;
    padding: 0 14px 0 4px; border-radius: 999px;
    background: rgba(8, 14, 40, .72); font-weight: 900; font-size: 15px;
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.08);
  }
  .coin-icon {
    width: 26px; height: 26px; border-radius: 50%; position: relative;
    background: radial-gradient(circle at 35% 30%, #ffe680, #f5b400 60%, #c98500);
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.25);
  }
  .coin-icon::after {
    content: '+'; position: absolute; right: -7px; bottom: -6px; width: 15px; height: 15px;
    border-radius: 50%; background: var(--green); color: #fff; font-size: 12px; font-weight: 900;
    display: flex; align-items: center; justify-content: center; line-height: 1;
    box-shadow: 0 1px 2px rgba(0,0,0,.35);
  }
  .level-title {
    position: absolute; left: 0; right: 0; top: 56px; text-align: center;
    font-size: 19px; font-weight: 900; letter-spacing: .5px; text-transform: uppercase;
    text-shadow: 0 2px 0 rgba(0,0,0,.35);
  }
  .gear-btn {
    position: absolute; right: 12px; top: 51px; width: 30px; height: 30px; border-radius: 9px;
    border: none; cursor: pointer; font-size: 18px; color: #fff;
    background: linear-gradient(#5aa0ff, #2e74ee);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.25), 0 2px 5px rgba(0,0,0,.35);
  }
  .strip {
    position: absolute; left: 0; right: 0; top: 88px; height: 36px;
    display: flex; justify-content: center; align-items: center; gap: 5px;
  }
  .strip-cell {
    width: 28px; height: 28px; border-radius: 7px; position: relative;
    background: rgba(255,255,255,.14); display: flex; align-items: center; justify-content: center;
    transition: transform .2s;
  }
  .strip-cell canvas { width: 22px; height: 22px; image-rendering: pixelated; opacity: .8; }
  .strip-cell.current { width: 36px; height: 36px; border-radius: 9px; background: #fff; }
  .strip-cell.current canvas { width: 30px; height: 30px; opacity: 1; }
  .strip-cell .mark {
    position: absolute; right: -4px; bottom: -4px; width: 14px; height: 14px; border-radius: 50%;
    font-size: 9px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900;
  }
  .strip-cell .mark.done { background: var(--green); }
  .strip-cell .mark.lock { background: #6a7099; }
  .speed-btn {
    position: absolute; right: 12px; top: 90px; height: 26px; padding: 0 9px; border-radius: 8px;
    border: none; cursor: pointer; font-weight: 900; font-size: 12px; color: #fff;
    background: rgba(8,14,40,.72); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.08);
  }
  .speed-btn.active { background: var(--green); }

  /* ---------- booster bar (bottom, Cube Land) ---------- */
  /* Cube Land: a thin blue strip along the bottom (~95.4-100%) with white rounded-square
     buttons (15.4% of the width, corner ~22%) centred at ~94.7%, standing on the strip and
     over the queue's third row */
  .booster-bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 4.6%; z-index: 11;
    background: linear-gradient(#3b74e6, #2b56c2);
    box-shadow: 0 -3px 0 #5e94ff, 0 -6px 14px rgba(0,0,0,.35);
    overflow: visible;
  }
  .booster-row {
    position: absolute; left: 0; right: 0; bottom: 38%; /* button centre ~94.7% of the frame */
    display: flex; justify-content: center; align-items: flex-end; gap: 2.7%;
  }
  .booster {
    position: relative; width: 15.4%; aspect-ratio: 1; border-radius: 22%; border: none;
    cursor: pointer; font-size: 26px; line-height: 1;
    background: linear-gradient(#ffffff, #e9edf8 65%, #cfd7ea);
    color: #333;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.14), 0 3px 6px rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center;
  }
  .booster:disabled { opacity: .55; cursor: default; }
  .booster.locked { background: linear-gradient(#c4cad8, #9ea6ba 65%, #7f889e); color: #eef1f8; font-size: 17px; }
  .booster.locked span:first-child { margin-top: -10px; }
  .booster.locked .lv { position: absolute; bottom: 6px; left: 0; right: 0; font-size: 9px; font-weight: 900; letter-spacing: .3px; }
  .booster.active { box-shadow: inset 0 -4px 0 rgba(0,0,0,.16), 0 0 0 3px var(--gold), 0 3px 6px rgba(0,0,0,.35); }
  .booster .b-count {
    position: absolute; right: -5px; bottom: -5px; min-width: 18px; height: 18px; padding: 0 4px;
    border-radius: 999px; background: #ff4c3b; color: #fff; font-size: 11px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  .booster .b-count.plus { background: var(--green); }

  /* ---------- toasts / mascot balloon ---------- */
  .toasts {
    position: absolute; top: 132px; left: 50%; transform: translateX(-50%);
    z-index: 30; display: flex; flex-direction: column; gap: 8px; align-items: center;
    pointer-events: none; width: 92%;
  }
  .toast {
    background: rgba(8, 14, 40, .88); color: #fff;
    padding: 8px 15px; border-radius: 14px; font-size: 13px; text-align: center;
    opacity: 0; transform: translateY(-8px); transition: all .35s ease;
    box-shadow: 0 4px 14px rgba(0,0,0,.3);
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  .balloon {
    position: absolute; left: 12px; right: 12px; z-index: 35;
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(#fff6d6, #ffe9a6); color: #3a2a12;
    border-radius: 18px; padding: 10px 14px 10px 10px;
    box-shadow: 0 0 0 3px #f2b83a, 0 8px 22px rgba(0,0,0,.4);
    font-size: 13.5px; font-weight: 700; line-height: 1.35;
    animation: balloonIn .3s cubic-bezier(.2,1.4,.4,1);
  }
  .balloon.top { top: 128px; }
  .balloon.bottom { bottom: 70px; }
  .balloon b { color: #d9740c; }
  .mascot {
    flex: 0 0 52px; width: 52px; height: 52px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #ffe98a, #f5b400 70%, #b77c00);
    display: flex; align-items: center; justify-content: center; font-size: 30px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.2), 0 0 0 3px #fff;
  }
  @keyframes balloonIn { from { transform: scale(.85); opacity: 0; } }
  .hand {
    position: absolute; z-index: 36; width: 44px; height: 44px; pointer-events: none;
    font-size: 40px; line-height: 1; transform-origin: 30% 20%;
    animation: handTap .9s ease-in-out infinite;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.45));
  }
  @keyframes handTap { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-4px, -8px) scale(.9); } }
  .hand.swipe { animation: handSwipe 1.7s ease-in-out infinite; }
  @keyframes handSwipe {
    0%, 100% { transform: translateX(-52px) rotate(-14deg); }
    50% { transform: translateX(52px) rotate(14deg); }
  }

  /* ---------- modal ---------- */
  .modal-root {
    position: absolute; inset: 0; z-index: 60; /* above the home screen too */
    background: rgba(6, 10, 32, .55); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
  }
  .modal-card {
    background: linear-gradient(#26305e, #1a2350); border-radius: 22px; padding: 20px 20px;
    width: 86%; max-height: 82%; overflow-y: auto; text-align: center; color: #fff;
    box-shadow: 0 12px 40px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.08);
    animation: cardIn .3s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes cardIn { from { transform: scale(.85); opacity: 0; } }
  .modal-title { font-size: 20px; font-weight: 900; margin-bottom: 8px; }
  .modal-body { font-size: 13px; color: #c7cdea; line-height: 1.5; margin-bottom: 14px; }
  .modal-buttons { display: flex; flex-direction: column; gap: 7px; }
  .modal-btn {
    padding: 12px 14px; border-radius: 13px; border: none;
    background: #34407a; font-size: 14px; font-weight: 800; cursor: pointer; color: #fff;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.25);
  }
  .modal-btn.primary { background: var(--green); box-shadow: inset 0 -3px 0 var(--green-dark); }
  .level-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 8px; }
  .level-cell {
    padding: 9px 0; border: none; border-radius: 10px; cursor: pointer;
    background: #34407a; color: #fff; font-weight: 900; font-size: 13px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.25);
  }
  .level-cell.skull { background: #5a3a8a; }
  .color-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 6px 0 10px; }
  .color-pick {
    width: 54px; height: 54px; border-radius: 14px; border: none; cursor: pointer;
    font-weight: 900; font-size: 14px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6);
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.25), 0 3px 8px rgba(0,0,0,.4);
  }

  /* ---------- level complete ---------- */
  .complete {
    position: absolute; inset: 0; z-index: 45; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(90% 60% at 50% 40%, rgba(40,55,120,.85), rgba(10,16,40,.92));
  }
  .complete-title {
    font-size: 40px; font-weight: 900; line-height: .95; text-align: center; letter-spacing: 1px;
    color: #ffd23f; -webkit-text-stroke: 2px #7b3fb8; text-shadow: 0 5px 0 #5b2a8c;
    animation: cardIn .4s cubic-bezier(.2,1.4,.4,1);
  }
  .complete-title span { display: block; color: #fff; }
  .coin-stack { font-size: 74px; line-height: 1; margin-top: 14px; filter: drop-shadow(0 6px 0 rgba(0,0,0,.35)); }
  .coin-amount { font-size: 34px; font-weight: 900; text-shadow: 0 3px 0 rgba(0,0,0,.4); }
  .new-item { width: 72%; margin-top: 8px; position: relative; }
  .new-item .label {
    position: absolute; left: 50%; top: -12px; transform: translateX(-50%);
    background: var(--gold); color: #5a3a00; font-size: 10px; font-weight: 900; letter-spacing: .5px;
    padding: 3px 12px; border-radius: 8px 8px 0 0;
  }
  .new-item .bar { height: 22px; border-radius: 12px; background: #e6b52a; padding: 4px; box-shadow: inset 0 2px 0 rgba(0,0,0,.2); }
  .new-item .fill { height: 100%; border-radius: 8px; background: linear-gradient(#c96bff, #8a2be2); }
  .complete .modal-btn { width: 70%; font-size: 16px; padding: 13px; }

  /* ---------- "Yeni Engel!" card (Cube Land's New Item) ---------- */
  .obstacle {
    position: absolute; inset: 0; z-index: 55; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; padding-top: 13%; gap: 0; cursor: pointer;
    background: radial-gradient(90% 60% at 50% 40%, rgba(30,45,110,.97), rgba(8,14,40,.98));
    animation: cardIn .3s cubic-bezier(.2,1.4,.4,1);
  }
  .obstacle-title {
    font-size: 34px; font-weight: 900; letter-spacing: .5px; margin-bottom: 14px;
    color: #ffd23f; -webkit-text-stroke: 1.5px #5b2a8c; text-shadow: 0 4px 0 #5b2a8c;
  }
  .obstacle-card {
    width: 84%; border-radius: 26px; padding: 6px; background: #ffd23f;
    box-shadow: 0 8px 24px rgba(0,0,0,.45), inset 0 -4px 0 rgba(0,0,0,.15);
  }
  .obstacle-card .shot { position: relative; border-radius: 20px; overflow: hidden; }
  .obstacle-card img { display: block; width: 100%; height: auto; }
  .obstacle-name {
    margin-top: 16px; font-size: 26px; font-weight: 900; text-align: center;
    color: #ffd23f; -webkit-text-stroke: 1px #5b2a8c; text-shadow: 0 3px 0 #5b2a8c;
  }
  .obstacle-sub { font-size: 18px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  .obstacle-desc { margin-top: 22px; padding: 0 28px; font-size: 14px; font-weight: 800; color: #9fb0e8; text-align: center; }
  .obstacle-tap { position: absolute; bottom: 7%; font-size: 12px; font-weight: 700; color: rgba(255,255,255,.55); }
  .claim-row { display: flex; gap: 10px; width: 84%; justify-content: center; }
  .claim-row .modal-btn { width: auto; flex: 1; }
  .modal-btn.orange { background: #ff9a1f; box-shadow: inset 0 -3px 0 #c66d05; }
  .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .confetti i {
    position: absolute; top: -12px; width: 8px; height: 14px; border-radius: 2px;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(900px) rotate(720deg); opacity: .2; } }

  /* ---------- home (Cube Land layout, Bee Colony art) ---------- */
  .home {
    position: absolute; inset: 0; z-index: 50; overflow: hidden;
    background:
      radial-gradient(60% 30% at 50% 78%, rgba(255,255,255,.25), transparent),
      linear-gradient(#5fb8ff 0%, #a9dcff 45%, #7fcf5a 46%, #62b846 70%, #4f9c3a 100%);
  }
  .home .cloud { position: absolute; width: 90px; height: 32px; border-radius: 999px; background: #fff; opacity: .9; }
  .home .cloud::before { content: ''; position: absolute; left: 22px; top: -16px; width: 44px; height: 44px; border-radius: 50%; background: #fff; }
  .home .hills { position: absolute; left: -20%; right: -20%; top: 40%; height: 120px;
    background: radial-gradient(50% 100% at 30% 100%, #8fd86a, transparent 70%), radial-gradient(45% 100% at 75% 100%, #7fcc5a, transparent 70%); }
  .home .hive-big {
    position: absolute; left: 50%; top: 44%; transform: translateX(-50%);
    font-size: 110px; line-height: 1; filter: drop-shadow(0 10px 10px rgba(0,0,0,.25));
  }
  .home .flowers { position: absolute; left: 0; right: 0; top: 61%; text-align: center; font-size: 26px; letter-spacing: 12px; opacity: .95; }
  /* reference lines (Cube Land / Knit Time): top row centred at ~8%, side columns from
     20%, play button 70-78%, nav from 86% */
  .home-top {
    position: absolute; left: 10px; right: 10px; top: 8%; height: 0;
    display: flex; align-items: center; gap: 8px;
  }
  .avatar {
    width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(#ffe98a, #f5b400);
    display: flex; align-items: center; justify-content: center; font-size: 30px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.2), 0 2px 4px rgba(0,0,0,.3), 0 0 0 2px rgba(255,255,255,.55);
  }
  .pill {
    height: 28px; display: flex; align-items: center; gap: 5px; padding: 0 12px 0 6px; border-radius: 999px;
    background: rgba(8,14,40,.72); font-weight: 900; font-size: 14px;
  }
  .pill .heart { color: #ff4b5c; font-size: 16px; }
  .home-top .spacer { flex: 1; }
  .home-top .gear-btn { width: 34px; height: 34px; font-size: 19px; }
  .side-badge {
    position: absolute; width: 60px; text-align: center; pointer-events: none;
  }
  .side-badge.left { left: 12px; }
  .side-badge.right { right: 12px; }
  .side-badge .icon {
    position: relative; width: 54px; height: 54px; margin: 0 auto; border-radius: 50%;
    background: radial-gradient(circle at 50% 30%, #ffe27a, #e9a11f 70%, #b97508);
    display: flex; align-items: center; justify-content: center; font-size: 26px;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.2), 0 3px 6px rgba(0,0,0,.3), 0 0 0 3px rgba(255,255,255,.5);
    filter: saturate(.35) brightness(.85);
  }
  .side-badge .lock {
    position: absolute; right: -6px; top: -6px; width: 22px; height: 22px; border-radius: 50%;
    background: #ffcc33; font-size: 12px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 3px rgba(0,0,0,.35); filter: none;
  }
  .side-badge .label {
    margin-top: -6px; padding: 2px 6px; border-radius: 8px; background: #2b4f9a; color: #fff;
    font-size: 9px; font-weight: 900; letter-spacing: .3px; box-shadow: inset 0 -2px 0 rgba(0,0,0,.25);
  }
  .hard-ribbon {
    position: absolute; left: 50%; top: 64.5%; transform: translateX(-50%);
    padding: 4px 14px; border-radius: 999px; background: #ff3b5c; color: #fff;
    font-size: 12px; font-weight: 900; letter-spacing: .6px; box-shadow: 0 3px 0 #a3132c, 0 4px 10px rgba(0,0,0,.3);
  }
  .play-btn {
    position: absolute; left: 50%; top: 70%; height: 8%; transform: translateX(-50%);
    min-width: 54%; padding: 0 30px; border-radius: 18px; border: none; cursor: pointer;
    font-size: 24px; font-weight: 900; color: #fff;
    background: linear-gradient(#7de35f, #3fbf2f);
    box-shadow: inset 0 -6px 0 #2f9a22, 0 6px 14px rgba(0,0,0,.35), 0 0 0 4px rgba(255,255,255,.35);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: translateX(-50%) scale(1.04); } }
  /* Cube Land nav: ~11.5% tall from ~88.5%, the home tab raised a little */
  .home-nav {
    position: absolute; left: 0; right: 0; bottom: 0; height: 11.5%;
    background: linear-gradient(#3b74e6, #2b56c2); display: flex; justify-content: center; align-items: flex-end;
    box-shadow: 0 -3px 0 #f3c53a; /* gold hairline on top, like the reference bar */
  }
  .nav-btn {
    flex: 1; height: 100%; border: none; background: transparent; color: #fff; font-weight: 900; font-size: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: default;
  }
  .nav-ico { position: relative; width: 34px; height: 34px; display: block; }
