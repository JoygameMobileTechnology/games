<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#dfe4ef">
<title>SlitherDrop</title>
<!--INJECT:CSS-->
</head>
<body>
<div id="stage">
  <div id="app">
    <canvas id="gl"></canvas>

    <div id="hud">
      <div class="hud-side">
        <button id="btn-levels" class="icon-btn" aria-label="Levels">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
        </button>
        <button id="btn-restart" class="icon-btn" aria-label="Restart level">
          <svg viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 1-6.3 4" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><path d="M4.5 3.5v6h6z"/></svg>
        </button>
      </div>
      <div class="hud-center">
        <div id="level-pill" class="pill level"><span id="level-title">Level 1</span><small id="level-tier">Tutorial</small></div>
        <div id="timer-pill" class="pill timer">
          <svg viewBox="0 0 24 24" class="clock"><circle cx="12" cy="13" r="8"/><rect x="10" y="1.5" width="4" height="3" rx="1"/><path d="M12 8.5v4.5l3 2" fill="none" stroke="#2d3757" stroke-width="2.2" stroke-linecap="round"/></svg>
          <span id="timer-text">01:00</span>
        </div>
      </div>
      <div class="hud-side right">
        <button id="btn-sound" class="icon-btn" aria-label="Toggle sound">
          <svg viewBox="0 0 24 24" class="ic-on"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          <svg viewBox="0 0 24 24" class="ic-off"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
        <button id="btn-full" class="icon-btn" aria-label="Fullscreen">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <div id="hint" class="hint hidden"></div>
    <div id="toast" class="toast hidden"></div>
    <div id="hand" class="hand hidden"></div>

    <div id="ov-levels" class="overlay">
      <div class="panel wide">
        <h1 class="logo"><span class="a">Slither</span><span class="b">Drop</span></h1>
        <p class="sub">Drag each hole by its end and feed it stickmen of its own color.</p>
        <div id="level-grid" class="level-grid"></div>
        <p class="foot">Prototype · portrait only</p>
      </div>
    </div>

    <div id="ov-win" class="overlay hidden">
      <div class="panel pop">
        <div class="stars">★</div>
        <h2 class="title">Level Complete!</h2>
        <p id="win-sub" class="sub"></p>
        <div class="row">
          <button id="btn-win-levels" class="btn ghost">Levels</button>
          <button id="btn-next" class="btn primary">Next</button>
        </div>
      </div>
    </div>

    <div id="ov-lose" class="overlay hidden">
      <div class="panel pop">
        <h2 class="title red">Time's Up!</h2>
        <p class="sub">The stickmen got away this time.</p>
        <div class="row">
          <button id="btn-lose-levels" class="btn ghost">Levels</button>
          <button id="btn-retry" class="btn primary red">Retry</button>
        </div>
      </div>
    </div>

    <div id="rotate" class="rotate hidden"><div class="phone"></div><p>Please rotate your device<br>to portrait</p></div>
  </div>
</div>
<!--INJECT:THREE-->
<!--INJECT:CORE-->
<!--INJECT:LEVELS-->
<!--INJECT:GAME-->
</body>
</html>
