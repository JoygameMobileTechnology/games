<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RollMatch</title>
<style>
/* Design plan — warm tabletop / slate night. Top-down-ish camera, CSS-3D tumbling pieces.
   Mode "Blocker": park colored 1x2 blocks on colored targets (mutual blockers).
   Mode "Tetris": tumble one polycube piece onto the target footprint (stone walls).
   Both modes run on ONE shared tumbling core (see script header) — Unity port target.
   Light: table #EFE7D8, panel #F8F3E8, cells #E6DCC6/#DFD4BA, ink #2A2519.
   Dark: #12141A / #1A1E27 / #262B37 / #EEF1F8. */
:root{
  --gameh:clamp(440px,92svh,820px);
  --gamew:min(96vw,calc(var(--gameh)*.58),490px);
  --bg:#EFE7D8; --panel:#F8F3E8; --panel2:#EFE8D6;
  --ink:#2A2519; --sub:#8A7F68; --line:#DCD2BC;
  --cellA:#E6DCC6; --cellB:#DFD4BA;
  --gold:#F7BE2A; --gold2:#EFAD12; --goldInk:#3A2C05;
  --scrim:rgba(38,32,20,.55);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12141A; --panel:#1A1E27; --panel2:#161A22;
    --ink:#EEF1F8; --sub:#8B93A6; --line:#2A3040;
    --cellA:#262B37; --cellB:#212633;
    --scrim:rgba(4,6,10,.62);
  }
}
:root[data-theme="dark"]{
  --bg:#12141A; --panel:#1A1E27; --panel2:#161A22;
  --ink:#EEF1F8; --sub:#8B93A6; --line:#2A3040;
  --cellA:#262B37; --cellB:#212633;
  --scrim:rgba(4,6,10,.62);
}
:root[data-theme="light"]{
  --bg:#EFE7D8; --panel:#F8F3E8; --panel2:#EFE8D6;
  --ink:#2A2519; --sub:#8A7F68; --line:#DCD2BC;
  --cellA:#E6DCC6; --cellB:#DFD4BA;
  --scrim:rgba(38,32,20,.55);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden; touch-action:none; user-select:none;-webkit-user-select:none;
}
#app{
  position:relative;width:var(--gamew);height:var(--gameh);
  background:var(--panel);border-radius:22px;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.28);
  display:flex;flex-direction:column;
}
header{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px 8px;flex:0 0 auto;
}
#menuBtn{
  width:34px;height:34px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel2);color:var(--ink);font-size:16px;cursor:pointer;
}
#ttl{font-weight:800;font-size:18px;letter-spacing:.14em}
#ttl b{color:var(--gold2)}
#lvlTag{margin-left:auto;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
#lvlTag b{color:var(--ink)}
/* 3D stage */
#stage{
  flex:1;position:relative;min-height:0;
  display:flex;align-items:center;justify-content:center;
  perspective:2000px;perspective-origin:50% 46%;
}
#tilt{transform-style:preserve-3d}
#grid{position:relative;transform-style:preserve-3d}
.cell{position:absolute;border-radius:8px;background:var(--cellA)}
.cell.alt{background:var(--cellB)}
/* targets + selection */
.tgt{position:absolute;border:2.5px dashed;border-radius:10px;transform:translateZ(2px)}
.tgt.on{border-style:solid}
#selRing{
  position:absolute;border:3px solid #fff;border-radius:13px;
  box-shadow:0 0 0 1.5px rgba(0,0,0,.4),0 0 16px rgba(255,255,255,.4);
  pointer-events:none;transition:opacity .12s;
}
.pvt{position:absolute;transform-style:preserve-3d}
.pvt.sel3d{cursor:pointer}
.blk3{position:absolute;inset:0;transform-style:preserve-3d}
.shad{position:absolute;border-radius:10px;background:radial-gradient(rgba(0,0,0,.38),rgba(0,0,0,0) 68%);transform:translateZ(1px)}
.face{
  position:absolute;display:flex;align-items:center;justify-content:center;
  border-radius:6px;border:1px solid rgba(0,0,0,.16);
}
.ftop3{box-shadow:inset 0 3px 8px rgba(255,255,255,.42),inset 0 -12px 18px rgba(0,0,0,.28),inset 0 0 0 2px rgba(0,0,0,.14)}
.fsd3{box-shadow:inset 0 -14px 20px rgba(0,0,0,.4),inset 0 0 0 2px rgba(0,0,0,.18)}
.puff{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--sub);opacity:.5;transform:translateZ(3px);animation:puf .4s forwards}
@keyframes puf{to{transform:translateZ(3px) scale(2.6);opacity:0}}
/* HUD */
#hud{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:8px 14px 12px;
}
#held{display:flex;gap:6px}
.chip{
  display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel2);font-size:14px;
}
.chip.hot{border-color:var(--gold2);box-shadow:0 0 0 1.5px var(--gold2)}
.chip i{display:block;width:14px;height:14px;border-radius:5px}
.chip b{font-size:11px}
#stats{margin-left:auto;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;text-align:right}
#stats b{color:var(--ink)}
/* Overlays */
.ov{
  position:absolute;inset:0;background:var(--scrim);z-index:10;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(3px);
}
.panel{
  width:86%;max-width:360px;background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:11px;
  text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35);
}
.panel h1{font-size:24px;letter-spacing:.12em}
.panel h1 b{color:var(--gold2)}
.panel p{font-size:12.5px;color:var(--sub);line-height:1.55}
#mtabs{display:flex;gap:8px}
.mtab{
  flex:1;padding:9px 4px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel2);color:var(--sub);font-weight:800;font-size:12px;
  letter-spacing:.05em;cursor:pointer;
}
.mtab.on{background:linear-gradient(180deg,#FFD65F,var(--gold2));color:var(--goldInk);border-color:transparent}
#lvlGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lb{
  aspect-ratio:1;border-radius:12px;border:1px solid var(--line);cursor:pointer;
  background:var(--panel2);color:var(--ink);font-weight:800;font-size:15px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
.lb small{font-size:9px;letter-spacing:.05em;color:var(--gold2);font-weight:400}
.lb.done{border-color:var(--gold2)}
.lb:hover{border-color:var(--gold2)}
.dbtn{
  padding:12px;border-radius:13px;border:1px solid var(--line);cursor:pointer;
  background:var(--panel2);color:var(--ink);font-size:14px;font-weight:700;
  display:flex;justify-content:center;align-items:center;gap:8px;
}
.dbtn:hover{border-color:var(--gold2)}
.prim{background:linear-gradient(180deg,#FFD65F,var(--gold2));color:var(--goldInk);border:none}
#winMark{font-size:34px}
#endTtl{font-size:23px;font-weight:800}
@media (prefers-reduced-motion:reduce){
  .puff{animation-duration:1ms}
}
</style>
<div id="app">
  <header>
    <button id="menuBtn">☰</button>
    <div id="ttl">ROLL<b>MATCH</b></div>
    <div id="lvlTag"></div>
  </header>
  <div id="stage">
    <div id="tilt"><div id="grid"></div></div>
  </div>
  <div id="hud">
    <div id="held"></div>
    <div id="stats"></div>
  </div>

  <div class="ov" id="lvlOv">
    <div class="panel">
      <h1>ROLL<b>MATCH</b></h1>
      <div id="mtabs">
        <button class="mtab" data-m="2">BLOCKER</button>
        <button class="mtab" data-m="3">TETRİS</button>
      </div>
      <p id="modeDesc"></p>
      <div id="lvlGrid"></div>
    </div>
  </div>
  <div class="ov" id="winOv" hidden>
    <div class="panel">
      <div id="winMark">🏁</div>
      <div id="endTtl">LEVEL TAMAM!</div>
      <button class="dbtn prim" id="nextBtn">SONRAKİ ▶</button>
      <button class="dbtn" id="retryBtn">TEKRAR</button>
      <button class="dbtn" id="lvlBtn">LEVELLER</button>
    </div>
  </div>
</div>
<script>
'use strict';
/* ============================================================
   SHARED TUMBLING CORE — single source of truth for movement.
   This is the Unity port target: pure data, no DOM.

   A piece is a list of unit cubes [x,y,z] (z = height, 0 = ground).
   Rolling tips the rigid body 90° over its bounding ground edge:
     R: P = max(x)+1, (x,y,z) -> (P+z, y, P-x-1)
     L: P = min(x),   (x,y,z) -> (P-z-1, y, x-P)
     D/U: same on the y axis.
   The 1x2 domino is just a 2-cube piece — both modes share this.

   Legality here is geometry only: EVERY cube's (x,y) column must stay
   on the board (edges are hard walls; overhang deliberately disabled).
   Mode-specific collision (other blocks / stone walls) and win rules
   live in the mode layers below, never in the core.
   ============================================================ */
const Q=new URLSearchParams(location.search);
const TEST=Q.get('test')||'';
let seed=1;
function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
let W=5,H=5;
const ROLL_MS=150;
function onBoard(x,y){return x>=0&&x<W&&y>=0&&y<H;}
// Availability: the roll is legal if AT LEAST ONE cube column stays on-board.
// Settle: if every on-board cube is elevated (min z = m > 0), the whole rigid
// piece drops by m so the on-board part sits on the ground ("dönüp oturtma").
// Off-board cubes may end below the board plane (hanging over the edge).
// Returns null (illegal) or {c: settled cubes, drop: m}.
function rollCubes(cubes,dir){
  let nc=null;
  if(dir==='R'){const P=Math.max(...cubes.map(c=>c[0]))+1;nc=cubes.map(([x,y,z])=>[P+z,y,P-x-1]);}
  else if(dir==='L'){const P=Math.min(...cubes.map(c=>c[0]));nc=cubes.map(([x,y,z])=>[P-z-1,y,x-P]);}
  else if(dir==='D'){const P=Math.max(...cubes.map(c=>c[1]))+1;nc=cubes.map(([x,y,z])=>[x,P+z,P-y-1]);}
  else{const P=Math.min(...cubes.map(c=>c[1]));nc=cubes.map(([x,y,z])=>[x,P-z-1,y-P]);}
  const ob=nc.filter(([x,y])=>onBoard(x,y));
  if(!ob.length)return null;
  const drop=Math.min(...ob.map(c=>c[2]));
  if(drop>0)nc=nc.map(([x,y,z])=>[x,y,z-drop]);
  return {c:nc,drop:Math.max(0,drop)};
}
/* Edge rule: top-down, at least one cube must ALWAYS stand on the board.
   A roll that would carry the whole piece off is simply illegal — there is
   no folding/hanging outside the board footprint. */
function resolveMove(cubes,dir){ // core entry for the mode layers
  const r=rollCubes(cubes,dir);
  return r?{c:r.c,drop:r.drop}:null;
}
function cubeKey(cubes){return cubes.map(c=>c.join(',')).sort().join('|');}
function footCells(cubes){
  const seen=new Set(),out=[];
  for(const [x,y] of cubes){
    const k=x+','+y;
    if(!seen.has(k)){seen.add(k);out.push([x,y]);}
  }
  return out;
}
function footKey(cubes){return footCells(cubes).map(([x,y])=>x+','+y).sort().join('|');}
function stateToCubes(s){ // baked Blocker states {t:'S'|'H'|'V',x,y} -> cube list
  if(s.t==='S')return [[s.x,s.y,0],[s.x,s.y,1]];
  if(s.t==='H')return [[s.x,s.y,0],[s.x+1,s.y,0]];
  return [[s.x,s.y,0],[s.x,s.y+1,0]];
}

/* ================= shared rendering ================= */
function computeCell(){
  const sw=stageEl.clientWidth,sh=stageEl.clientHeight;
  const reserve=mode===3?2.1:0.55; // tumbling towers get up to 3 cells tall
  // EDGE_RES free cells per side: partial overhang extends at most (piece max dim - 1)
  CELL=Math.floor(Math.min((sw-24)/(W+2*EDGE_RES),(sh-24)/(H+2*EDGE_RES+reserve),88));
}
function buildCells(){
  computeCell();
  gridEl.style.width=W*CELL+'px';
  gridEl.style.height=H*CELL+'px';
  gridEl.innerHTML='';
  cellEls=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const d=document.createElement('div');
    d.className='cell'+((x+y)%2?' alt':'');
    d.style.left=x*CELL+1+'px';d.style.top=y*CELL+1+'px';
    d.style.width=CELL-2+'px';d.style.height=CELL-2+'px';
    gridEl.appendChild(d);cellEls.push(d);
  }
}
function face(w,h,l,t,tf){
  const d=document.createElement('div');
  d.className='face';
  d.style.width=w+'px';d.style.height=h+'px';
  d.style.left=l+'px';d.style.top=t+'px';
  d.style.transform=tf;
  return d;
}
function buildPoly(pv,bk,sh,cubes,shade){ // per-cube cuboid with internal-face culling
  const xs=cubes.map(c=>c[0]),ys=cubes.map(c=>c[1]);
  const gx=Math.min(...xs),gy=Math.min(...ys);
  const fw=(Math.max(...xs)-gx+1)*CELL,fh=(Math.max(...ys)-gy+1)*CELL;
  pv.style.left=gx*CELL+'px';pv.style.top=gy*CELL+'px';
  pv.style.width=fw+'px';pv.style.height=fh+'px';
  sh.style.left=gx*CELL-3+'px';sh.style.top=gy*CELL-3+'px';
  sh.style.width=fw+6+'px';sh.style.height=fh+6+'px';
  bk.innerHTML='';
  const has=new Set(cubes.map(c=>c.join(',')));
  for(const [x,y,z] of cubes){
    const lx=(x-gx)*CELL,ly=(y-gy)*CELL,ez=z*CELL;
    // off-board overhang cubes render ghosted: under the tilt an elevated cube and
    // an outside cube otherwise look alike, which reads as a wrong row
    const out=!onBoard(x,y);
    const ghost=out?' saturate(0.35) opacity(0.5)':'';
    if(!has.has(x+','+y+','+(z+1))){
      const f=face(CELL-2,CELL-2,lx+1,ly+1,'translateZ('+(ez+CELL)+'px)');
      f.classList.add('ftop3');
      f.style.background=shade.top;
      f.style.filter='brightness('+(1+z*0.07)+')'+ghost; // height cue for top-down reading
      bk.appendChild(f);
    }
    const sides=[
      [x,y+1,z,CELL-4,CELL,lx+2,ly,'translateZ('+ez+'px) rotateX(-90deg)','bottom',shade.fr],
      [x,y-1,z,CELL-4,CELL,lx+2,ly-CELL,'translateZ('+ez+'px) rotateX(-90deg)','bottom',shade.sd],
      [x-1,y,z,CELL,CELL-4,lx-CELL,ly+2,'translateZ('+ez+'px) rotateY(90deg)','right',shade.sd],
      [x+1,y,z,CELL,CELL-4,lx+CELL,ly+2,'translateZ('+ez+'px) rotateY(-90deg)','left',shade.sd],
    ];
    for(const [nx,ny,nz,w,h,l,t,tf,org,bg] of sides){
      if(has.has(nx+','+ny+','+nz))continue;
      const f=face(w,h,l,t,tf);
      f.classList.add('fsd3');
      f.style.transformOrigin=org;
      f.style.background=bg;
      if(out)f.style.filter=ghost;
      bk.appendChild(f);
    }
  }
}
function makeView(clickable){
  const sh=document.createElement('div');
  sh.className='shad';
  const pv=document.createElement('div');
  pv.className='pvt'+(clickable?' sel3d':'');
  const bk=document.createElement('div');
  bk.className='blk3';
  pv.appendChild(bk);
  gridEl.appendChild(sh);gridEl.appendChild(pv);
  return {pv,bk,sh};
}
const ORI={
  R:['100% 50%','rotateY(90deg)'],L:['0% 50%','rotateY(-90deg)'],
  D:['50% 100%','rotateX(-90deg)'],U:['50% 0%','rotateX(90deg)'],
};
function animRoll(pv,dir,done){
  const o=ORI[dir];
  pv.style.transition='none';
  pv.style.transformOrigin=o[0];
  void pv.offsetWidth; // flush so the transition below animates from rest
  pv.style.transition='transform '+ROLL_MS+'ms cubic-bezier(.5,.05,.9,.45)';
  pv.style.transform=o[1];
  setTimeout(done,ROLL_MS+15);
}
function dropIn(pv,drop,done){ // settle animation: the piece falls onto the ground
  if(!drop){done();return;}
  pv.style.transition='none';
  pv.style.transform='translateZ('+drop*CELL+'px)';
  void pv.offsetWidth;
  pv.style.transition='transform 90ms cubic-bezier(.4,0,1,1)';
  pv.style.transform='none';
  setTimeout(done,105);
}
function resetPivot(pv){
  pv.style.transition='none';
  pv.style.transform='none';
}
function bumpPv(pv,dir){
  if(anim)return;
  anim=true;
  const o=ORI[dir];
  pv.style.transition='none';
  pv.style.transformOrigin=o[0];
  void pv.offsetWidth;
  pv.style.transition='transform 90ms';
  pv.style.transform=o[1].replace('90','14'); // clear "no room" feedback
  setTimeout(()=>{
    pv.style.transform='none';
    setTimeout(()=>{anim=false;},95);
  },95);
}
function puffsAt(cells){
  for(const [x,y] of cells){
    for(let k=0;k<3;k++){
      const p=document.createElement('div');
      p.className='puff';
      p.style.left=x*CELL+CELL*(.2+rnd()*.6)+'px';
      p.style.top=y*CELL+CELL*(.2+rnd()*.6)+'px';
      gridEl.appendChild(p);
      setTimeout(()=>p.remove(),420);
    }
  }
}
function renderTgt(cells,color){
  const els=[];
  for(const [x,y] of cells){
    const t=document.createElement('div');
    t.className='tgt';
    t.style.left=x*CELL+4+'px';t.style.top=y*CELL+4+'px';
    t.style.width=CELL-8+'px';t.style.height=CELL-8+'px';
    t.style.borderColor=color;
    t.style.background=color+'26';
    gridEl.appendChild(t);
    els.push(t);
  }
  return els;
}

/* ================= Blocker mode (2) ================= */
function m2Blocked(nc,bi){
  const occ=new Set();
  m2B.forEach((c,i)=>{if(i!==bi)footCells(c).forEach(([x,y])=>occ.add(x+','+y));});
  return footCells(nc).some(([x,y])=>occ.has(x+','+y));
}
function m2Parked(i){return cubeKey(m2B[i])===cubeKey(m2G[i]);}
function parkedCount(){return m2B.filter((c,i)=>m2Parked(i)).length;}
function updateSel(){
  const cubes=m2B[selB];
  const xs=cubes.map(c=>c[0]),ys=cubes.map(c=>c[1]);
  const gx=Math.min(...xs),gy=Math.min(...ys);
  const fw=(Math.max(...xs)-gx+1)*CELL,fh=(Math.max(...ys)-gy+1)*CELL;
  const top=(Math.max(...cubes.map(c=>c[2]))+1)*CELL;
  selRingEl.style.left=gx*CELL-3+'px';
  selRingEl.style.top=gy*CELL-3+'px';
  selRingEl.style.width=fw+6+'px';
  selRingEl.style.height=fh+6+'px';
  selRingEl.style.transform='translateZ('+(top+5)+'px)'; // above the block top: visible top-down
}
function updateTgts(){
  m2G.forEach((g,i)=>{
    const on=m2Parked(i);
    for(const t of m2TgtEls[i]){
      t.classList.toggle('on',on);
      t.style.background=MCOL[i].c+(on?'66':'26');
    }
  });
}
function updateHudM2(){
  const held=$('held');
  held.innerHTML='';
  m2B.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='chip'+(i===selB?' hot':'');
    d.style.cursor='pointer';
    d.innerHTML='<i style="background:'+MCOL[i].c+'"></i>'+(m2Parked(i)?'<b>✓</b>':'');
    d.addEventListener('click',()=>{if(mode===2&&phase==='play')selectB(i);});
    held.appendChild(d);
  });
  $('stats').innerHTML='Park <b>'+parkedCount()+'</b>/'+m2B.length;
  $('lvlTag').innerHTML='Level <b>'+level+'</b> · Blocker';
}
function selectB(i){
  if(i<0||i>=m2B.length)return;
  selB=i;
  updateSel();updateHudM2();
}
function tryMoveM2(dir){ // returns false when the move is impossible (hold-repeat stops on it)
  if(phase!=='play')return false;
  if(anim){queuedDir=dir;return true;}
  const bi=selB; // lock the moving block: selection may change mid-animation
  const r=resolveMove(m2B[bi],dir);
  if(!r||m2Blocked(r.c,bi)){bumpPv(m2Views[bi].pv,dir);return false;}
  anim=true;
  selRingEl.style.opacity='0'; // the ring can't follow the tumble — hide it mid-roll
  const v=m2Views[bi];
  animRoll(v.pv,dir,()=>{
    m2B[bi]=r.c;
    resetPivot(v.pv);
    buildPoly(v.pv,v.bk,v.sh,r.c,MCOL[bi]);
    dropIn(v.pv,r.drop,()=>{
      puffsAt(footCells(r.c).filter(([x,y])=>onBoard(x,y)));
      updateSel();updateTgts();updateHudM2();
      selRingEl.style.opacity='1';
      anim=false;
      if(m2B.every((c,i)=>m2Parked(i))){doWin(prog2,'rollm_prog2',M2LEVELS.length);return;}
      if(queuedDir){const d=queuedDir;queuedDir=null;tryMoveM2(d);}
    });
  });
  return true;
}
function loadM2(n){
  mode=2;level=n;
  tiltEl.style.transform='';
  m2lv=M2LEVELS[n-1];
  W=m2lv.w;H=m2lv.h;
  m2B=m2lv.blocks.map(b=>stateToCubes(b.s));
  m2G=m2lv.blocks.map(b=>stateToCubes(b.g));
  EDGE_RES=1; // dominoes overhang at most one cell
  selB=0;anim=false;queuedDir=null;
  buildCells();
  m2TgtEls=m2G.map((g,i)=>renderTgt(footCells(g),MCOL[i].c));
  selRingEl=document.createElement('div');
  selRingEl.id='selRing';
  gridEl.appendChild(selRingEl);
  m2Views=m2B.map((c,i)=>{
    const v=makeView(true);
    v.pv.dataset.b=i;
    buildPoly(v.pv,v.bk,v.sh,c,MCOL[i]);
    return v;
  });
  phase='play';
  $('lvlOv').hidden=true;$('winOv').hidden=true;
  updateSel();updateTgts();updateHudM2();

/* ================= Tetris mode (3) ================= */
function renderWall(x,y){
  // height-1 stone cube, same face geometry as piece cubes, rock shades
  const lx=x*CELL,ly=y*CELL;
  const add=(f,org,bg)=>{
    f.classList.add(org?'fsd3':'ftop3');
    if(org)f.style.transformOrigin=org;
    f.style.background=bg;
    gridEl.appendChild(f);
  };
  add(face(CELL-2,CELL-2,lx+1,ly+1,'translateZ('+CELL+'px)'),null,M3ROCK.top);
  add(face(CELL-4,CELL,lx+2,ly,'translateZ(0px) rotateX(-90deg)'),'bottom',M3ROCK.fr);
  add(face(CELL-4,CELL,lx+2,ly-CELL,'translateZ(0px) rotateX(-90deg)'),'bottom',M3ROCK.sd);
  add(face(CELL,CELL-4,lx-CELL,ly+2,'translateZ(0px) rotateY(90deg)'),'right',M3ROCK.sd);
  add(face(CELL,CELL-4,lx+CELL,ly+2,'translateZ(0px) rotateY(-90deg)'),'left',M3ROCK.sd);
}
function m3WallHit(nc){ // on-board guard: off-board coords must not wrap into wall keys
  return nc.some(([x,y,z])=>z===0&&onBoard(x,y)&&m3Walls.has(y*W+x));
}
function updateHudM3(){
  $('held').innerHTML='';
  $('stats').innerHTML='Parçayı hedefe yuvarla 🎯';
  $('lvlTag').innerHTML='Level <b>'+level+'</b> · Tetris';
}
function tryMoveM3(dir){ // returns false when the move is impossible (hold-repeat stops on it)
  if(phase!=='play')return false;
  if(anim){queuedDir=dir;return true;}
  const r=resolveMove(m3P,dir);
  if(!r||m3WallHit(r.c)){bumpPv(m3View.pv,dir);return false;}
  anim=true;
  animRoll(m3View.pv,dir,()=>{
    m3P=r.c;
    resetPivot(m3View.pv);
    buildPoly(m3View.pv,m3View.bk,m3View.sh,m3P,M3SH);
    dropIn(m3View.pv,r.drop,()=>{
      puffsAt(footCells(m3P).filter(([x,y])=>onBoard(x,y)).slice(0,3));
      anim=false;
      if(footKey(m3P)===m3GoalKey){
        for(const t of m3TgtEls){t.classList.add('on');t.style.background=M3SH.c+'66';}
        doWin(prog3,'rollm_prog3',M3LEVELS.length);
        return;
      }
      if(queuedDir){const d=queuedDir;queuedDir=null;tryMoveM3(d);}
    });
  });
  return true;
}
function loadM3(n){
  mode=3;level=n;
  m3lv=M3LEVELS[n-1];
  W=m3lv.w;H=m3lv.h;
  m3P=m3lv.p.map(c=>c.slice());
  // overhang capacity = piece max dimension - 1 (rotation-invariant)
  EDGE_RES=Math.max(...[0,1,2].map(ax=>
    Math.max(...m3P.map(c=>c[ax]))-Math.min(...m3P.map(c=>c[ax]))))||1;
  m3Walls=new Set((m3lv.o||[]).map(([x,y])=>y*W+x));
  m3GoalKey=[...new Set(m3lv.g.map(([x,y])=>x+','+y))].sort().join('|');
  anim=false;queuedDir=null;
  tiltEl.style.transform='rotateX(14deg)'; // slight tilt so tower heights read from above
  buildCells();
  for(const [x,y] of (m3lv.o||[]))renderWall(x,y);
  m3TgtEls=renderTgt(m3lv.g,M3SH.c);
  m3View=makeView(false);
  buildPoly(m3View.pv,m3View.bk,m3View.sh,m3P,M3SH);
  phase='play';
  $('lvlOv').hidden=true;$('winOv').hidden=true;
  updateHudM3();
}

/* ================= flow / level select ================= */
function doWin(pr,storeKey,maxLevel){
  phase='end';
  pr.done[level]=1;
  if(pr.unlocked!==undefined&&level<maxLevel)pr.unlocked=Math.max(pr.unlocked,level+1);
  try{localStorage.setItem(storeKey,JSON.stringify(pr));}catch(e){}
  $('nextBtn').hidden=level>=maxLevel;
  $('winOv').hidden=false;
  if(TEST==='auto')document.title='AUTO M'+mode+' L'+level+' WIN';
}
function loadLevel(n){
  if(curMode===2)loadM2(n);else loadM3(n);
}
function showLevels(){
  phase='menu';
  $('winOv').hidden=true;
  document.querySelectorAll('.mtab').forEach(b=>{
    b.classList.toggle('on',+b.dataset.m===curMode);
  });
  $('modeDesc').innerHTML=curMode===2
    ?'Renkli blokları <b>kendi renkteki hedefe</b> park et: 1 hücrelik hedef = <b>dik</b>, 2 hücrelik = <b>yatık</b>. Bloklar birbirini engeller! 🎮 Bloğa tıkla ya da 1-2-3, sonra kaydır / ok tuşları'
    :'Tetris parçası şekline göre <b>takla atar</b>: dikilir, yan yatar, kule olur. Gri taşlara girilmez — havadaki küpler <b>üstlerinden aşabilir</b>. Parçayı <b>hedef alana birebir</b> oturt. 🎮 Kaydır / ok tuşları';
  const list=curMode===2?M2LEVELS:M3LEVELS;
  const pr=curMode===2?prog2:prog3;
  const g=$('lvlGrid');
  g.innerHTML='';
  for(let n=1;n<=list.length;n++){ // all levels open — start anywhere
    const done=!!pr.done[n];
    const b=document.createElement('button');
    b.className='lb'+(done?' done':'');
    b.innerHTML=n+'<small>'+(done?'✓':'&nbsp;')+'</small>';
    b.addEventListener('click',()=>loadLevel(n));
    g.appendChild(b);
  }
  $('lvlOv').hidden=false;
}
document.querySelectorAll('.mtab').forEach(b=>{
  b.addEventListener('click',()=>{
    curMode=+b.dataset.m;
    try{localStorage.setItem('rollm_mode',''+curMode);}catch(e){}
    showLevels();
  });
});

/* ================= input ================= */
document.addEventListener('keydown',e=>{
  const map={ArrowRight:'R',ArrowLeft:'L',ArrowDown:'D',ArrowUp:'U',d:'R',a:'L',s:'D',w:'U'};
  const dir=map[e.key];
  if(dir){
    e.preventDefault();
    if(mode===2)tryMoveM2(dir);else tryMoveM3(dir);
    return;
  }
  if(mode===2&&phase==='play'&&e.key>='1'&&e.key<='3')selectB(+e.key-1);
});
/* swipe anywhere; fires when the drag passes the threshold and keeps rolling
   in that direction while the finger stays down (hold-to-roll) */
let swS=null,swDone=false,swHold=null,swTimer=null;
function swDir(dx,dy){return Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U');}
function swFire(dir){
  return mode===2?tryMoveM2(dir):tryMoveM3(dir);
}
function stopHold(){
  swHold=null;
  if(swTimer){clearInterval(swTimer);swTimer=null;}
}
function swStart(e,x,y){
  if(e.target.closest('button,.chip,.ov'))return;
  swS=[x,y];swDone=false;
}
function swMove(x,y){
  if(!swS||swDone)return;
  const dx=x-swS[0],dy=y-swS[1];
  if(Math.abs(dx)<24&&Math.abs(dy)<24)return;
  swDone=true;
  const dir=swDir(dx,dy);
  if(swFire(dir)===false)return;
  swHold=dir;
  swTimer=setInterval(()=>{
    if(!swHold){stopHold();return;}
    if(anim)return;
    if(swFire(swHold)===false)stopHold();
  },40);
}
function swEnd(x,y){
  if(swS&&!swDone){
    const dx=x-swS[0],dy=y-swS[1];
    if(Math.abs(dx)>=16||Math.abs(dy)>=16)swFire(swDir(dx,dy)); // short-flick fallback
  }
  swS=null;swDone=false;
  stopHold();
}
const appEl=$('app');
appEl.addEventListener('touchstart',e=>{swStart(e,e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
appEl.addEventListener('touchmove',e=>{swMove(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
appEl.addEventListener('touchend',e=>{swEnd(e.changedTouches[0].clientX,e.changedTouches[0].clientY);},{passive:true});
appEl.addEventListener('touchcancel',()=>{swS=null;swDone=false;stopHold();},{passive:true});
appEl.addEventListener('mousedown',e=>swStart(e,e.clientX,e.clientY));
appEl.addEventListener('mousemove',e=>{if(e.buttons)swMove(e.clientX,e.clientY);});
appEl.addEventListener('mouseup',e=>swEnd(e.clientX,e.clientY));
gridEl.addEventListener('click',e=>{
  if(mode!==2||phase!=='play')return;
  const pv=e.target.closest('.pvt');
  if(pv&&pv.dataset.b!==undefined){selectB(+pv.dataset.b);return;}
  const c=e.target.closest('.cell');
  if(c){
    const idx=cellEls.indexOf(c);
    const x=idx%W,y=(idx/W)|0;
    const bi=m2B.findIndex(cu=>footCells(cu).some(([cx,cy])=>cx===x&&cy===y));
    if(bi>=0)selectB(bi);
  }
});
$('menuBtn').addEventListener('click',showLevels);
$('lvlBtn').addEventListener('click',showLevels);
$('retryBtn').addEventListener('click',()=>loadLevel(level));
$('nextBtn').addEventListener('click',()=>loadLevel(level+1));

/* ================= test hooks ================= */
function applyTest(){
  const lv=+(Q.get('level')||1);
  const max=curMode===2?M2LEVELS.length:M3LEVELS.length;
  loadLevel(Math.min(Math.max(lv,1),max));
  if(curMode===2){
    if(TEST==='race'){
      // regression: switch selection mid-roll; block states must not cross-contaminate
      const b0=cubeKey(m2B[0]),b1=cubeKey(m2B[1]);
      let dir=null;
      for(const d of ['R','L','D','U']){
        const r=rollCubes(m2B[0],d);
        if(r&&!m2Blocked(r.c,0)){dir=d;break;}
      }
      selectB(0);tryMoveM2(dir);
      setTimeout(()=>selectB(1),60);
      setTimeout(()=>{
        const ok=cubeKey(m2B[1])===b1&&cubeKey(m2B[0])!==b0&&selB===1;
        document.title='RACE '+(ok?'OK':'FAIL');
      },700);
    }
    else if(TEST==='seq'){ // scripted driver: ?test=seq&mv=0R0R... -> title carries final state
      const toks=(Q.get('mv')||'').match(/\d[RLDU]/g)||[];
      let k=0;
      const iv=setInterval(()=>{
        if(anim)return;
        if(k>=toks.length){clearInterval(iv);document.title='SEQ '+m2B.map(cubeKey).join(' / ');return;}
        selectB(+toks[k][0]);
        tryMoveM2(toks[k][1]);
        k++;
      },200);
    }
    else if(TEST==='auto'){
      const toks=m2lv.sol.match(/\d[RLDU]/g)||[];
      let k=0;
      const iv=setInterval(()=>{
        if(k>=toks.length||phase==='end'){clearInterval(iv);return;}
        if(anim||phase!=='play')return;
        selectB(+toks[k][0]);
        tryMoveM2(toks[k][1]);
        k++;
      },300);
    }
  }else{
    if(TEST==='edge'){ // regression: pushing past the lip must be refused; >=1 cube stays on board
      let guard=0;
      const iv=setInterval(()=>{
        if(anim)return;
        const onB=m3P.filter(([x,y])=>onBoard(x,y)).length;
        if(onB<1){clearInterval(iv);document.title='EDGE FAIL';return;}
        if(tryMoveM3('L')===false){
          clearInterval(iv);
          const still=m3P.filter(([x,y])=>onBoard(x,y)).length;
          document.title='EDGE '+(still>=1?'OK':'FAIL'); // refused at the lip, piece kept on board
          return;
        }
        if(++guard>12){clearInterval(iv);document.title='EDGE FAIL';}
      },200);
    }
    else if(TEST==='seq'){ // scripted move driver: ?test=seq&mv=DRUL -> title carries final state
      const toks=(Q.get('mv')||'').split('');
      let k=0;
      const iv=setInterval(()=>{
        if(anim)return;
        if(k>=toks.length){clearInterval(iv);document.title='SEQ '+cubeKey(m3P);return;}
        tryMoveM3(toks[k]);
        k++;
      },200);
    }
    else if(TEST==='auto'){
      const toks=m3lv.sol.split('');
      let k=0;
      const iv=setInterval(()=>{
        if(k>=toks.length||phase==='end'){clearInterval(iv);return;}
        if(anim||phase!=='play')return;
        tryMoveM3(toks[k]);
        k++;
      },300);
    }
  }
}

/* ================= boot ================= */
const th=Q.get('theme');
if(th)document.documentElement.dataset.theme=th;
const mq=+(Q.get('mode')||0);
if(mq===2||mq===3)curMode=mq;
if(TEST||Q.get('level'))applyTest();
else showLevels();
</script>
