<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RollMatch</title>
<style>
/* Design plan — warm tabletop / slate night. Top-down camera, CSS-3D rolling blocks.
   Mode 1 "No Blocker": twin-domino matching (stars + prediction).
   Mode 2 "Blocker": park colored blocks on colored targets — finished or not, no counters.
   Light: table #EFE7D8, panel #F8F3E8, cells #E6DCC6/#DFD4BA, ink #2A2519.
   Dark: #12141A / #1A1E27 / #262B37 / #EEF1F8. */
:root{
  --gameh:clamp(440px,92svh,820px);
  --gamew:min(96vw,calc(var(--gameh)*.58),490px);
  --bg:#EFE7D8; --panel:#F8F3E8; --panel2:#EFE8D6;
  --ink:#2A2519; --sub:#8A7F68; --line:#DCD2BC;
  --cellA:#E6DCC6; --cellB:#DFD4BA; --hole:#CFC2A6;
  --tile:#FCF8EE; --tileEdge:#D9CEB4; --tileSep:rgba(0,0,0,.08);
  --gold:#F7BE2A; --gold2:#EFAD12; --goldInk:#3A2C05;
  --scrim:rgba(38,32,20,.55);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12141A; --panel:#1A1E27; --panel2:#161A22;
    --ink:#EEF1F8; --sub:#8B93A6; --line:#2A3040;
    --cellA:#262B37; --cellB:#212633; --hole:#151922;
    --tile:#2E3545; --tileEdge:#1F2532; --tileSep:rgba(255,255,255,.09);
    --scrim:rgba(4,6,10,.62);
  }
}
:root[data-theme="dark"]{
  --bg:#12141A; --panel:#1A1E27; --panel2:#161A22;
  --ink:#EEF1F8; --sub:#8B93A6; --line:#2A3040;
  --cellA:#262B37; --cellB:#212633; --hole:#151922;
  --tile:#2E3545; --tileEdge:#1F2532; --tileSep:rgba(255,255,255,.09);
  --scrim:rgba(4,6,10,.62);
}
:root[data-theme="light"]{
  --bg:#EFE7D8; --panel:#F8F3E8; --panel2:#EFE8D6;
  --ink:#2A2519; --sub:#8A7F68; --line:#DCD2BC;
  --cellA:#E6DCC6; --cellB:#DFD4BA; --hole:#CFC2A6;
  --tile:#FCF8EE; --tileEdge:#D9CEB4; --tileSep:rgba(0,0,0,.08);
  --scrim:rgba(38,32,20,.55);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden; touch-action:none; user-select:none;-webkit-user-select:none;
}
#app{
  position:relative;width:var(--gamew);height:var(--gameh);
  background:var(--panel);border-radius:22px;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.28);
  display:flex;flex-direction:column;
}
header{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px 8px;flex:0 0 auto;
}
#menuBtn{
  width:34px;height:34px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel2);color:var(--ink);font-size:16px;cursor:pointer;
}
#ttl{font-weight:800;font-size:18px;letter-spacing:.14em}
#ttl b{color:var(--gold2)}
#lvlTag{margin-left:auto;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
#lvlTag b{color:var(--ink)}
/* top-down 3D stage */
#stage{
  flex:1;position:relative;min-height:0;
  display:flex;align-items:center;justify-content:center;
  perspective:2000px;perspective-origin:50% 46%;
}
#tilt{transform-style:preserve-3d}
#grid{position:relative;transform-style:preserve-3d}
.cell{position:absolute;border-radius:8px;background:var(--cellA)}
.cell.alt{background:var(--cellB)}
.cell.hole{background:var(--hole);box-shadow:inset 0 3px 10px rgba(0,0,0,.22)}
/* mode 1 substrate pieces: one solid block per domino */
.pi{
  position:absolute;border-radius:11px;background:var(--tile);
  border:1px solid var(--tileEdge);
  box-shadow:0 3px 0 rgba(0,0,0,.13);
  display:flex;transform:translateZ(7px);
}
.pi.v{flex-direction:column}
.pi span{
  flex:1 1 0;display:flex;align-items:center;justify-content:center;
  border-radius:9px;margin:3px;
}
.pi.h span+span{border-left:2px solid var(--tileSep);border-radius:0 9px 9px 0}
.pi.v span+span{border-top:2px solid var(--tileSep);border-radius:0 0 9px 9px}
.pi.match{box-shadow:0 3px 0 rgba(0,0,0,.13),0 0 0 3px var(--gold),0 0 18px #F7BE2A99}
.pi.pick{outline:3px solid var(--gold);outline-offset:2px;cursor:pointer;filter:brightness(1.07)}
.pi.popA{animation:popA .3s forwards}
@keyframes popA{to{transform:translateZ(30px) scale(1.35);opacity:0}}
.pi.riseA{animation:riseA .2s forwards}
@keyframes riseA{to{transform:translateZ(26px);opacity:0}}
/* mode 2 targets + selection */
.tgt{position:absolute;border:2.5px dashed;border-radius:10px;transform:translateZ(2px)}
.tgt.on{border-style:solid}
#selRing{
  position:absolute;border:3px solid #fff;border-radius:13px;
  box-shadow:0 0 0 1.5px rgba(0,0,0,.4),0 0 16px rgba(255,255,255,.4);
  pointer-events:none;transition:opacity .12s;
}
.pvt{position:absolute;transform-style:preserve-3d}
.pvt.sel3d{cursor:pointer}
.blk3{position:absolute;inset:0;transform-style:preserve-3d}
.shad{position:absolute;border-radius:10px;background:radial-gradient(rgba(0,0,0,.38),rgba(0,0,0,0) 68%);transform:translateZ(1px)}
.face{
  position:absolute;display:flex;align-items:center;justify-content:center;
  border-radius:6px;border:1px solid rgba(0,0,0,.16);
}
.ftop3{box-shadow:inset 0 3px 8px rgba(255,255,255,.42),inset 0 -12px 18px rgba(0,0,0,.28),inset 0 0 0 2px rgba(0,0,0,.14)}
.fsd3{box-shadow:inset 0 -14px 20px rgba(0,0,0,.4),inset 0 0 0 2px rgba(0,0,0,.18)}
.face span{display:flex;align-items:center;justify-content:center;flex:1 1 0}
.puff{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--sub);opacity:.5;transform:translateZ(3px);animation:puf .4s forwards}
@keyframes puf{to{transform:translateZ(3px) scale(2.6);opacity:0}}
.burst{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:none;transform:translateZ(10px);animation:bur .5s forwards}
@keyframes bur{to{transform:translateZ(52px) scale(1.7);opacity:0}}
/* HUD */
#hud{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:8px 14px 12px;
}
#held{display:flex;gap:6px}
.chip{
  display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel2);font-size:14px;
}
.chip small{font-size:9px;color:var(--sub);letter-spacing:.08em}
.chip.hot{border-color:var(--gold2);box-shadow:0 0 0 1.5px var(--gold2)}
.chip i{display:block;width:14px;height:14px;border-radius:5px}
.chip b{font-size:11px}
#stats{margin-left:auto;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;text-align:right}
#stats b{color:var(--ink)}
#transferTip{
  position:absolute;left:50%;top:11%;transform:translateX(-50%);
  background:var(--gold);color:var(--goldInk);font-weight:800;font-size:13px;
  padding:7px 14px;border-radius:999px;letter-spacing:.05em;z-index:5;
  box-shadow:0 6px 18px rgba(0,0,0,.25);
}
/* Overlays */
.ov{
  position:absolute;inset:0;background:var(--scrim);z-index:10;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(3px);
}
.panel{
  width:86%;max-width:360px;background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:11px;
  text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35);
}
.panel h1{font-size:24px;letter-spacing:.12em}
.panel h1 b{color:var(--gold2)}
.panel p{font-size:12.5px;color:var(--sub);line-height:1.55}
#mtabs{display:flex;gap:8px}
.mtab{
  flex:1;padding:9px 4px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel2);color:var(--sub);font-weight:800;font-size:12px;
  letter-spacing:.05em;cursor:pointer;
}
.mtab.on{background:linear-gradient(180deg,#FFD65F,var(--gold2));color:var(--goldInk);border-color:transparent}
#lvlGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lb{
  aspect-ratio:1;border-radius:12px;border:1px solid var(--line);cursor:pointer;
  background:var(--panel2);color:var(--ink);font-weight:800;font-size:15px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
.lb small{font-size:9px;letter-spacing:.05em;color:var(--gold2);font-weight:400}
.lb.lock{opacity:.4;cursor:default;font-size:13px}
.lb.done{border-color:var(--gold2)}
.lb:not(.lock):hover{border-color:var(--gold2)}
.dbtn{
  padding:12px;border-radius:13px;border:1px solid var(--line);cursor:pointer;
  background:var(--panel2);color:var(--ink);font-size:14px;font-weight:700;
  display:flex;justify-content:center;align-items:center;gap:8px;
}
.dbtn:hover{border-color:var(--gold2)}
.prim{background:linear-gradient(180deg,#FFD65F,var(--gold2));color:var(--goldInk);border:none}
#winStars{font-size:34px;letter-spacing:.1em}
#endTtl{font-size:23px;font-weight:800}
#endStats{font-size:13px;color:var(--sub);line-height:1.8;font-variant-numeric:tabular-nums}
#endStats b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){
  .puff,.burst{animation-duration:1ms}
}
</style>

  </div>
</div>

:"H","x":2,"y":3},"g":{"t":"H","x":4,"y":4}}],"sol":"0D0D2R2U1U1L1U1L2L2D2R2D"},{"w":6,"h":6,"blocks":[{"s":{"t":"S","x":5,"y":0},"g":{"t":"S","x":2,"y":4}},{"s":{"t":"S","x":1,"y":2},"g":{"t":"S","x":4,"y":3}},{"s":{"t":"V","x":4,"y":1},"g":{"t":"V","x":0,"y":1}}],"sol":"0L1R1D1R2L2L0D2L0L0D0D2L"},{"w":6,"h":6,"blocks":[{"s":{"t":"V","x":1,"y":4},"g":{"t":"S","x":4,"y":5}},{"s":{"t":"V","x":4,"y":2},"g":{"t":"S","x":1,"y":4}},{"s":{"t":"S","x":1,"y":1},"g":{"t":"V","x":5,"y":0}}],"sol":"0U0R0D0D0R1D1L1L2R2D2R2U2R"},{"w":6,"h":6,"blocks":[{"s":{"t":"V","x":1,"y":2},"g":{"t":"S","x":0,"y":5}},{"s":{"t":"H","x":0,"y":5},"g":{"t":"S","x":2,"y":2}},{"s":{"t":"H","x":4,"y":3},"g":{"t":"H","x":2,"y":3}}],"sol":"0L0D1R1U1U0R0D0L2L2D2R2U2L"},{"w":6,"h":7,"blocks":[{"s":{"t":"H","x":1,"y":6},"g":{"t":"S","x":3,"y":4}},{"s":{"t":"S","x":3,"y":3},"g":{"t":"S","x":5,"y":3}},{"s":{"t":"S","x":5,"y":6},"g":{"t":"H","x":0,"y":0}}],"sol":"0U0U0R1U1R1R1D2L2L2U2U2U2U2L"},{"w":6,"h":7,"blocks":[{"s":{"t":"S","x":3,"y":2},"g":{"t":"S","x":5,"y":1}},{"s":{"t":"S","x":3,"y":5},"g":{"t":"S","x":5,"y":2}},{"s":{"t":"V","x":0,"y":1},"g":{"t":"H","x":0,"y":4}}],"sol":"0D0L0U0R0U0R1U1R1R1U2R2R2D2L2D"},{"w":6,"h":7,"blocks":[{"s":{"t":"V","x":3,"y":3},"g":{"t":"S","x":1,"y":6}},{"s":{"t":"V","x":1,"y":2},"g":{"t":"S","x":5,"y":2}},{"s":{"t":"V","x":4,"y":3},"g":{"t":"V","x":1,"y":0}}],"sol":"1R1U1R1D1R2U0R0D0L0D0L2L2L2U"},{"w":6,"h":7,"blocks":[{"s":{"t":"S","x":3,"y":4},"g":{"t":"S","x":4,"y":0}},{"s":{"t":"H","x":4,"y":4},"g":{"t":"S","x":4,"y":4}},{"s":{"t":"H","x":3,"y":3},"g":{"t":"S","x":1,"y":1}}],"sol":"0L0U1L1D1R2D0R0U0R0U2L1U2U2L2U"},{"w":6,"h":7,"blocks":[{"s":{"t":"V","x":1,"y":1},"g":{"t":"S","x":0,"y":1}},{"s":{"t":"S","x":3,"y":2},"g":{"t":"S","x":1,"y":3}},{"s":{"t":"S","x":5,"y":2},"g":{"t":"S","x":4,"y":2}}],"sol":"0L0U0R0D0L1L1D1L1D1R1U2D2L2U"},{"w":6,"h":7,"blocks":[{"s":{"t":"V","x":4,"y":5},"g":{"t":"S","x":2,"y":6}},{"s":{"t":"V","x":2,"y":3},"g":{"t":"S","x":0,"y":3}},{ const MCOL=[ // mode 2 block colors + cuboid face shades
  {c:'#E24A4A',name:'KIRMIZI',top:'linear-gradient(180deg,#F26D6D,#E24A4A)',fr:'#C93B3B',sd:'#B23434'},
  {c:'#F7BE2A',name:'SARI',top:'linear-gradient(180deg,#FFD65F,#F7BE2A)',fr:'#E0A31C',sd:'#D89A12'},
  {c:'#5B8DEF',name:'MAVİ',top:'linear-gradient(180deg,#7EA5F5,#5B8DEF)',fr:'#4A79D6',sd:'#3F68BA'},
];
const GOLDSH=MCOL[1];
let W=4,H=4,TYPES=3;
const ROLL_MS=150;

/* ================= mode 1: board generation (twin-paired dominoes) ================= */
function tiling(){
  for(let tries=0;tries<300;tries++){
    const own=new Int8Array(W*H).fill(-1);
    const doms=[];
    let ok=true;
    for(let i=0;i<W*H;i++){
      if(own[i]>=0)continue;
      const x=i%W,y=(i/W)|0;
      const nb=shuffled([[1,0],[0,1]]).filter(([dx,dy])=>{
        const nx=x+dx,ny=y+dy;
        return nx<W&&ny<H&&own[ny*W+nx]<0;
      });
      if(!nb.length){ok=false;break;}
      const [dx,dy]=nb[0];
      const j=(y+dy)*W+(x+dx);
      own[i]=doms.length;own[j]=doms.length;
      doms.push([i,j]);
    }
    if(ok)return doms;
  }
  throw 'tiling fail';
}
function makeBoard(dblP){
  const doms=tiling();
  const order=shuffled([...doms.keys()]);
  const sub=new Int8Array(W*H).fill(-1);
  for(let k=0;k<order.length;k+=2){
    const d1=doms[order[k]],d2=doms[order[k+1]];
    let a=(rnd()*TYPES)|0,b;
    if(rnd()<dblP)b=a;else{do{b=(rnd()*TYPES)|0;}while(b===a);}
    sub[d1[0]]=a;sub[d1[1]]=b;
    sub[d2[0]]=a;sub[d2[1]]=b;
  }
  const cellToDom={};
  doms.forEach(([i,j],di)=>{cellToDom[i]=di;cellToDom[j]=di;});
  return {sub,doms,cellToDom};
}

/* ================= mode 1: roller state machine (icons matter) ================= */
function cellsOf(s){
  if(s.t==='H')return [[s.x,s.y],[s.x+1,s.y]];
  if(s.t==='V')return [[s.x,s.y],[s.x,s.y+1]];
  return [[s.x,s.y]];
}
function move(s,dir){
  let ns=null;
  if(s.t==='S'){
    if(dir==='R')ns={t:'H',x:s.x+1,y:s.y,a:s.d,b:s.u};
    if(dir==='L')ns={t:'H',x:s.x-2,y:s.y,a:s.u,b:s.d};
    if(dir==='D')ns={t:'V',x:s.x,y:s.y+1,a:s.d,b:s.u};
    if(dir==='U')ns={t:'V',x:s.x,y:s.y-2,a:s.u,b:s.d};
  }else if(s.t==='H'){
    if(dir==='R')ns={t:'S',x:s.x+2,y:s.y,d:s.b,u:s.a};
    if(dir==='L')ns={t:'S',x:s.x-1,y:s.y,d:s.a,u:s.b};
    if(dir==='D')ns={t:'H',x:s.x,y:s.y+1,a:s.a,b:s.b};
    if(dir==='U')ns={t:'H',x:s.x,y:s.y-1,a:s.a,b:s.b};
  }else{
    if(dir==='D')ns={t:'S',x:s.x,y:s.y+2,d:s.b,u:s.a};
    if(dir==='U')ns={t:'S',x:s.x,y:s.y-1,d:s.a,u:s.b};
    if(dir==='R')ns={t:'V',x:s.x+1,y:s.y,a:s.a,b:s.b};
    if(dir==='L')ns={t:'V',x:s.x-1,y:s.y,a:s.a,b:s.b};
  }
  for(const [cx,cy] of cellsOf(ns))if(cx<0||cx>=W||cy<0||cy>=H)return null;
  return ns;
}
function keyOf(s){
  return s.t+s.x+','+s.y+','+(s.t==='S'?s.d+'.'+s.u:s.a+'.'+s.b);
}
function matchDi(s,sub,board){
  if(s.t==='S')return -1;
  const c1=s.y*W+s.x,c2=s.t==='H'?c1+1:c1+W;
  const d1=board.cellToDom[c1];
  if(d1===undefined||d1!==board.cellToDom[c2])return -1;
  if(sub[c1]<0)return -1;
  return (sub[c1]===s.a&&sub[c2]===s.b)?d1:-1;
}
function bfsMatch(s0,sub,board){
  const seen=new Set([keyOf(s0)]);
  let frontier=[{s:s0,path:[]}];
  let depth=0;
  while(frontier.length&&depth<80){
    const next=[];
    for(const n of frontier){
      for(const dir of ['R','L','D','U']){
        const ns=move(n.s,dir);
        if(!ns)continue;
        const k=keyOf(ns);
        if(seen.has(k))continue;
        seen.add(k);
        const p=n.path.concat(dir);
        if(matchDi(ns,sub,board)>=0)return {state:ns,path:p};
        next.push({s:ns,path:p});
      }
    }
    frontier=next;depth++;
  }
  return null;
}
function rise(di,sub,board){
  const [i,j]=board.doms[di];
  const ia=sub[i],ib=sub[j];
  sub[i]=-1;sub[j]=-1;
  const x1=i%W,y1=(i/W)|0,y2=(j/W)|0;
  if(y1===y2)return {t:'H',x:x1,y:y1,a:ia,b:ib};
  return {t:'V',x:x1,y:y1,a:ia,b:ib};
}
function aliveDis(sub,board){
  const out=[];
  board.doms.forEach(([i,j],di)=>{if(sub[i]>=0)out.push(di);});
  return out;
}
function pickBest(sub,board){
  let best=-1,bestD=1e9;
  for(const di of aliveDis(sub,board)){
    const tmp=sub.slice();
    const rs=rise(di,tmp,board);
    const r=bfsMatch(rs,tmp,board);
    const d=r?r.path.length:1e9;
    if(d<bestD){bestD=d;best=di;}
  }
  return best;
}
function solveGreedy(board,rec){
  const sub=board.sub.slice();
  let s=null,movesN=0;
  for(let g=0;g<400;g++){
    if(!s){
      const al=aliveDis(sub,board);
      if(!al.length)return movesN;
      const pick=pickBest(sub,board);
      if(pick<0)return -1;
      if(rec)rec.push({t:'pick',cell:board.doms[pick][0]});
      s=rise(pick,sub,board);
      continue;
    }
    const r=bfsMatch(s,sub,board);
    if(!r)return -1;
    movesN+=r.path.length;
    if(rec)for(const d of r.path)rec.push({t:'m',dir:d});
    const di=matchDi(r.state,sub,board);
    const [i,j]=board.doms[di];
    sub[i]=-1;sub[j]=-1;
    s=null;
  }
  return -1;
}

/* ================= mode 2: footprint-only state machine ================= */
function m2Cells(s){
  if(s.t==='H')return [[s.x,s.y],[s.x+1,s.y]];
  if(s.t==='V')return [[s.x,s.y],[s.x,s.y+1]];
  return [[s.x,s.y]];
}
function m2Move(s,dir){
  let ns=null;
  if(s.t==='S'){
    if(dir==='R')ns={t:'H',x:s.x+1,y:s.y};
    if(dir==='L')ns={t:'H',x:s.x-2,y:s.y};
    if(dir==='D')ns={t:'V',x:s.x,y:s.y+1};
    if(dir==='U')ns={t:'V',x:s.x,y:s.y-2};
  }else if(s.t==='H'){
    if(dir==='R')ns={t:'S',x:s.x+2,y:s.y};
    if(dir==='L')ns={t:'S',x:s.x-1,y:s.y};
    if(dir==='D')ns={t:'H',x:s.x,y:s.y+1};
    if(dir==='U')ns={t:'H',x:s.x,y:s.y-1};
  }else{
    if(dir==='D')ns={t:'S',x:s.x,y:s.y+2};
    if(dir==='U')ns={t:'S',x:s.x,y:s.y-1};
    if(dir==='R')ns={t:'V',x:s.x+1,y:s.y};
    if(dir==='L')ns={t:'V',x:s.x-1,y:s.y};
  }
  for(const [cx,cy] of m2Cells(ns))if(cx<0||cx>=W||cy<0||cy>=H)return null;
  return ns;
}
function m2Blocked(ns,bi){
  const occ=new Set();
  m2B.forEach((s,i)=>{if(i!==bi)m2Cells(s).forEach(([x,y])=>occ.add(y*W+x));});
  return m2Cells(ns).some(([x,y])=>occ.has(y*W+x));
}
function m2Eq(a,b){return a.t===b.t&&a.x===b.x&&a.y===b.y;}

/* ================= DOM refs / game state ================= */
const $=id=>document.getElementById(id);

/* ================= shared rendering ================= */
function computeCell(){
  const sw=stageEl.clientWidth,sh=stageEl.clientHeight;
  CELL=Math.floor(Math.min((sw-24)/W,(sh-24)/(H+0.55),88));
}
function buildCells(){
  computeCell();
  gridEl.style.width=W*CELL+'px';
  gridEl.style.height=H*CELL+'px';
  gridEl.innerHTML='';
  cellEls=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const d=document.createElement('div');
    d.className='cell'+((x+y)%2?' alt':'');
    d.style.left=x*CELL+1+'px';d.style.top=y*CELL+1+'px';
    d.style.width=CELL-2+'px';d.style.height=CELL-2+'px';
    gridEl.appendChild(d);cellEls.push(d);
  }
}
function face(w,h,l,t,tf){
  const d=document.createElement('div');
  d.className='face';
  d.style.width=w+'px';d.style.height=h+'px';
  d.style.left=l+'px';d.style.top=t+'px';
  d.style.transform=tf;
  return d;
}
function footprintOf(s){
  return {fw:(s.t==='H'?2:1)*CELL,fh:(s.t==='V'?2:1)*CELL,z:(s.t==='S'?2:1)*CELL};
}
function buildCuboid(pv,bk,sh,s,shade,topIcons,topCol){
  const {fw,fh,z}=footprintOf(s);
  pv.style.left=s.x*CELL+'px';pv.style.top=s.y*CELL+'px';
  pv.style.width=fw+'px';pv.style.height=fh+'px';
  sh.style.left=s.x*CELL-3+'px';sh.style.top=s.y*CELL-3+'px';
  sh.style.width=fw+6+'px';sh.style.height=fh+6+'px';
  bk.innerHTML='';
  const ftop=face(fw,fh,0,0,'translateZ('+z+'px)');
  ftop.classList.add('ftop3');
  ftop.style.background=shade.top;
  if(topIcons){
    ftop.style.flexDirection=topCol?'column':'row';
    ftop.style.fontSize=CELL*.5+'px';
    for(const ic of topIcons){
      const sp=document.createElement('span');
      sp.textContent=ICONS[ic].e;
      ftop.appendChild(sp);
    }
  }
  // side faces are inset 3px per edge so they never peek past the top face's rounded corners
  const ffr=face(fw-6,z,3,fh-z,'rotateX(-90deg)');
  ffr.style.transformOrigin='bottom';ffr.style.background=shade.fr;
  const fbk=face(fw-6,z,3,-z,'rotateX(-90deg)');
  fbk.style.transformOrigin='bottom';fbk.style.background=shade.sd;
  const flf=face(z,fh-6,-z,3,'rotateY(90deg)');
  flf.style.transformOrigin='right';flf.style.background=shade.sd;
  const frt=face(z,fh-6,fw,3,'rotateY(-90deg)');
  frt.style.transformOrigin='left';frt.style.background=shade.sd;
  for(const f of [ffr,fbk,flf,frt])f.classList.add('fsd3');
  bk.append(ftop,ffr,fbk,flf,frt);
}
const ORI={
  R:['100% 50%','rotateY(90deg)'],L:['0% 50%','rotateY(-90deg)'],
  D:['50% 100%','rotateX(-90deg)'],U:['50% 0%','rotateX(90deg)'],
};
function animRoll(pv,dir,done){
  const o=ORI[dir];
  pv.style.transition='none';
  pv.style.transformOrigin=o[0];
  void pv.offsetWidth; // flush so the transition below animates from rest
  pv.style.transition='transform '+ROLL_MS+'ms cubic-bezier(.5,.05,.9,.45)';
  pv.style.transform=o[1];
  setTimeout(done,ROLL_MS+15);
}
function resetPivot(pv){
  pv.style.transition='none';
  pv.style.transform='none';
}
function bumpPv(pv,dir){
  if(anim)return;
  anim=true;
  const o=ORI[dir];
  pv.style.transition='none';
  pv.style.transformOrigin=o[0];
  void pv.offsetWidth;
  pv.style.transition='transform 90ms';
  pv.style.transform=o[1].replace('90','14'); // clear "no room to tip" feedback
  setTimeout(()=>{
    pv.style.transform='none';
    setTimeout(()=>{anim=false;},95);
  },95);
}
function puffsAt(cells){
  for(const [x,y] of cells){
    for(let k=0;k<3;k++){
      const p=document.createElement('div');
      p.className='puff';
      p.style.left=x*CELL+CELL*(.2+rnd()*.6)+'px';
      p.style.top=y*CELL+CELL*(.2+rnd()*.6)+'px';
      gridEl.appendChild(p);
      setTimeout(()=>p.remove(),420);
    }
  }
}
function burstAt(c,ic){
  const x=c%W,y=(c/W)|0;
  const b=document.createElement('div');
  b.className='burst';
  b.style.left=x*CELL+'px';b.style.top=y*CELL+'px';
  b.style.width=CELL+'px';b.style.height=CELL+'px';
  b.style.fontSize=CELL*.55+'px';
  b.textContent=ICONS[ic].e;
  gridEl.appendChild(b);
  setTimeout(()=>b.remove(),520);
}
function totalStars(){let n=0;for(const k in prog.stars)n+=prog.stars[k];return n;}

/* ================= mode 1: board + play ================= */
function buildBoardM1(){
  buildCells();
  pieceEls=[];
  board.doms.forEach((d,di)=>{renderPiece(di);});
  shadowEl=document.createElement('div');
  shadowEl.className='shad';gridEl.appendChild(shadowEl);
  pivotEl=document.createElement('div');
  pivotEl.className='pvt';
  blkEl=document.createElement('div');
  blkEl.className='blk3';
  pivotEl.appendChild(blkEl);gridEl.appendChild(pivotEl);
  pivotEl.style.display='none';shadowEl.style.display='none';
}
function renderPiece(di){
  if(pieceEls[di]){pieceEls[di].remove();pieceEls[di]=null;}
  const [i,j]=board.doms[di];
  if(sub[i]<0)return;
  const x1=i%W,y1=(i/W)|0,x2=j%W,y2=(j/W)|0;
  const gx=Math.min(x1,x2),gy=Math.min(y1,y2);
  const cw=Math.abs(x2-x1)+1,ch=Math.abs(y2-y1)+1;
  const d=document.createElement('div');
  d.className='pi '+(ch>1?'v':'h');
  d.dataset.cell=i;
  d.style.left=gx*CELL+4+'px';d.style.top=gy*CELL+4+'px';
  d.style.width=cw*CELL-8+'px';d.style.height=ch*CELL-8+'px';
  d.style.fontSize=CELL*.48+'px';
  for(const c of [i,j]){
    const s=document.createElement('span');
    s.textContent=ICONS[sub[c]].e;
    d.appendChild(s);
  }
  gridEl.appendChild(d);
  pieceEls[di]=d;
}
function rollerIcons(){
  if(!pState)return [];
  if(pState.t==='S')return [pState.d,pState.u];
  return [pState.a,pState.b];
}
function sameCombo(di){
  const [i,j]=board.doms[di];
  const ri=rollerIcons();
  if(ri.length<2)return false;
  const a=sub[i],b=sub[j];
  return (a===ri[0]&&b===ri[1])||(a===ri[1]&&b===ri[0]);
}
function updateGlows(){
  board.doms.forEach((d,di)=>{
    const el=pieceEls[di];
    if(!el)return;
    el.classList.toggle('match',phase==='play'&&sameCombo(di));
  });
}
function buildBlkM1(){
  buildCuboid(pivotEl,blkEl,shadowEl,pState,GOLDSH,
    pState.t==='S'?[pState.u]:[pState.a,pState.b],pState.t==='V');
}
function updateHudM1(){
  const held=$('held');
  held.innerHTML='';
  const mk=(ic,tag,hot)=>{
    const d=document.createElement('div');
    d.className='chip'+(hot?' hot':'');
    d.innerHTML=(tag?'<small>'+tag+'</small>':'')+ICONS[ic].e;
    held.appendChild(d);
  };
  if(pState){
    if(pState.t==='S'){mk(pState.d,'ALT',true);mk(pState.u,'ÜST',false);}
    else{mk(pState.a,'',true);mk(pState.b,'',true);}
  }
  const left=aliveDis(sub,board).length+(pState?1:0);
  $('stats').innerHTML='Kalan <b>'+left+'</b> taş · Hamle <b>'+pMoves+'</b> · Tahmin <b>'+pred+'</b>';
  $('lvlTag').innerHTML='Level <b>'+level+'</b> · ★ '+totalStars();
}
function tryMoveM1(dir){
  if(phase!=='play'||!pState)return;
  if(anim){queuedDir=dir;return;}
  const ns=move(pState,dir);
  if(!ns){bumpPv(pivotEl,dir);return;}
  anim=true;pMoves++;
  if(!startT)startT=Date.now();
  animRoll(pivotEl,dir,()=>{
    pState=ns;
    resetPivot(pivotEl);
    buildBlkM1();
    puffsAt(cellsOf(pState));
    const di=matchDi(pState,sub,board);
    if(di>=0)doMatch(di);
    else{updateGlows();updateHudM1();}
    anim=false;
    if(queuedDir){const d=queuedDir;queuedDir=null;tryMoveM1(d);}
  });
}
function doMatch(di){
  const [i,j]=board.doms[di];
  burstAt(i,sub[i]);burstAt(j,sub[j]);
  sub[i]=-1;sub[j]=-1;
  const el=pieceEls[di];
  if(el){el.classList.add('popA');setTimeout(()=>el.remove(),320);pieceEls[di]=null;}
  cellEls[i].classList.add('hole');cellEls[j].classList.add('hole');
  pState=null;
  pivotEl.style.display='none';shadowEl.style.display='none';
  enterTransfer();
}
function enterTransfer(){
  const al=aliveDis(sub,board);
  if(!al.length){doWinM1();return;}
  phase='transfer';
  const fresh=al.length===board.doms.length;
  $('transferTip').textContent=fresh?'İLK TAŞINI SEÇ 👇':'YENİ TAŞ SEÇ 👇';
  $('transferTip').hidden=false;
  for(const el of pieceEls)if(el)el.classList.add('pick');
  updateGlows();updateHudM1();
}
function pickPiece(cell){
  if(phase!=='transfer')return;
  const di=board.cellToDom[cell];
  if(di===undefined||sub[board.doms[di][0]]<0)return;
  phase='play';
  $('transferTip').hidden=true;
  for(const el of pieceEls)if(el)el.classList.remove('pick');
  const pe=pieceEls[di];
  if(pe){pe.classList.add('riseA');setTimeout(()=>pe.remove(),220);pieceEls[di]=null;}
  const [i,j]=board.doms[di];
  cellEls[i].classList.add('hole');cellEls[j].classList.add('hole');
  pState=rise(di,sub,board);
  pivotEl.style.display='';shadowEl.style.display='';
  buildBlkM1();
  updateGlows();updateHudM1();
}
function loadM1(n){
  mode=1;level=n;
  const L=LEVELS[n-1];
  W=L.w;H=L.h;TYPES=L.t;
  for(let k=0;k<6;k++){
    seed=(L.s+k*7919)>>>0;
    board=makeBoard(L.d);
    par=solveGreedy(board);
    if(par>0)break;
  }
  pred=Math.ceil(par*1.2);
  sub=board.sub.slice();
  pMoves=0;startT=0;anim=false;queuedDir=null;pState=null;
  buildBoardM1();
  $('lvlOv').hidden=true;$('winOv').hidden=true;
  enterTransfer();
}
function starsFor(m){ // below prediction 3★, exactly it 2★, above 1★ — never fail
  if(m<pred)return 3;
  if(m===pred)return 2;
  return 1;
}
function doWinM1(){
  phase='end';
  const st=starsFor(pMoves);
  const prev=prog.stars[level]||0;
  if(st>prev)prog.stars[level]=st;
  if(level<LEVELS.length)prog.unlocked=Math.max(prog.unlocked,level+1);
  try{localStorage.setItem('rollm_prog',JSON.stringify(prog));}catch(e){}
  const secs=startT?((Date.now()-startT)/1000).toFixed(1):'0';
  $('winStars').hidden=false;
  $('winStars').textContent='★★★'.slice(0,st)+'☆☆☆'.slice(0,3-st);
  $('endStats').hidden=false;
  $('endStats').innerHTML='Hamle: <b>'+pMoves+'</b> (tahmin: '+pred+') · Süre: <b>'+secs+'s</b>';
  $('nextBtn').hidden=level>=LEVELS.length;
  $('winOv').hidden=false;
  if(TEST==='auto')document.title='AUTO L'+level+' WIN moves'+pMoves+' pred'+pred+' par'+par+' star'+st;
}

  });
}
function parkedCount(){return m2B.filter((s,i)=>m2Eq(s,m2G[i])).length;}
function updateHudM2(){
  const held=$('held');
  held.innerHTML='';
  m2B.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='chip'+(i===selB?' hot':'');
    d.style.cursor='pointer';
    d.innerHTML='<i style="background:'+MCOL[i].c+'"></i>'+(m2Eq(s,m2G[i])?'<b>✓</b>':'');
    d.addEventListener('click',()=>{if(mode===2&&phase==='play')selectB(i);});
    held.appendChild(d);
  });
  $('stats').innerHTML='Park <b>'+parkedCount()+'</b>/'+m2B.length;
  $('lvlTag').innerHTML='Level <b>'+level+'</b> · Blocker';
}
function selectB(i){
  if(i<0||i>=m2B.length)return;
  selB=i;
  updateSel();updateHudM2();
}
function tryMoveM2(dir){
  if(phase!=='play')return;
  if(anim){queuedDir=dir;return;}
  const s=m2B[selB];
  const ns=m2Move(s,dir);
  if(!ns||m2Blocked(ns,selB)){bumpPv(m2Views[selB].pv,dir);return;}
  anim=true;m2Moves++;
  selRingEl.style.opacity='0'; // the ring can't follow the tumble — hide it mid-roll
  const v=m2Views[selB];
  animRoll(v.pv,dir,()=>{
    m2B[selB]=ns;
    resetPivot(v.pv);
    buildCuboid(v.pv,v.bk,v.sh,ns,MCOL[selB],null,false);
    puffsAt(m2Cells(ns));
    updateSel();updateTgts();updateHudM2();
    selRingEl.style.opacity='1';
    anim=false;
    if(m2B.every((st,i)=>m2Eq(st,m2G[i]))){doWinM2();return;}
    if(queuedDir){const d=queuedDir;queuedDir=null;tryMoveM2(d);}
  });
}
function loadM2(n){
  mode=2;level=n;
  m2lv=M2LEVELS[n-1];
  W=m2lv.w;H=m2lv.h;
  m2B=m2lv.blocks.map(b=>({...b.s}));
  m2G=m2lv.blocks.map(b=>({...b.g}));
  selB=0;anim=false;queuedDir=null;m2Moves=0;
  buildBoardM2();
  phase='play';
  $('transferTip').hidden=true;
  $('lvlOv').hidden=true;$('winOv').hidden=true;
  updateHudM2();
}
function doWinM2(){
  phase='end';
  prog2.done[level]=1;
  if(level<M2LEVELS.length)prog2.unlocked=Math.max(prog2.unlocked,level+1);
  try{localStorage.setItem('rollm_prog2',JSON.stringify(prog2));}catch(e){}
  $('winStars').hidden=false;
  $('winStars').textContent='🏁';
  $('endStats').hidden=true;
  $('nextBtn').hidden=level>=M2LEVELS.length;
  $('winOv').hidden=false;
  if(TEST==='auto')document.title='AUTO M2 L'+level+' WIN moves'+m2Moves;
}

/* ================= flow / level select ================= */
function loadLevel(n){
  if(curMode===1)loadM1(n);else loadM2(n);
}
function showLevels(){
  phase='menu';
  $('winOv').hidden=true;$('transferTip').hidden=true;
  document.querySelectorAll('.mtab').forEach(b=>{
    b.classList.toggle('on',+b.dataset.m===curMode);
  });
  $('modeDesc').innerHTML=curMode===1
    ?'Bir taş kaldır, <b>yuvarlayarak</b> gezdir ve <b>ikizinin</b> üstüne birebir hizalı yatır — ikon ikonun üstüne gelirse ikisi de patlar. 🎮 Kaydır / ok tuşları'
    :'Renkli blokları <b>kendi renkteki hedefe</b> park et: 1 hücrelik hedef = <b>dik</b>, 2 hücrelik = <b>yatık</b>. Bloklar birbirini engeller! 🎮 Bloğa tıkla ya da 1-2-3, sonra kaydır / ok tuşları';
  const list=curMode===1?LEVELS:M2LEVELS;
  const pr=curMode===1?prog:prog2;
  const g=$('lvlGrid');
  g.innerHTML='';
  for(let n=1;n<=list.length;n++){
    const b=document.createElement('button');
    const open=n<=pr.unlocked;
    let mark='&nbsp;';
    let done=false;
    if(curMode===1){
      const st=prog.stars[n]||0;
      done=st>0;
      if(st)mark='★'.repeat(st);
    }else{
      done=!!prog2.done[n];
      if(done)mark='✓';
    }
    b.className='lb'+(open?(done?' done':''):' lock');
    b.innerHTML=open?n+'<small>'+mark+'</small>':'🔒';
    if(open)b.addEventListener('click',()=>loadLevel(n));
    g.appendChild(b);
  }
  $('lvlOv').hidden=false;
}
document.querySelectorAll('.mtab').forEach(b=>{
  b.addEventListener('click',()=>{
    curMode=+b.dataset.m;
    try{localStorage.setItem('rollm_mode',''+curMode);}catch(e){}
    showLevels();
  });
});

/* ================= input ================= */
document.addEventListener('keydown',e=>{
  const map={ArrowRight:'R',ArrowLeft:'L',ArrowDown:'D',ArrowUp:'U',d:'R',a:'L',s:'D',w:'U'};
  const dir=map[e.key];
  if(dir){
    e.preventDefault();
    if(mode===1)tryMoveM1(dir);else tryMoveM2(dir);
    return;
  }
  if(mode===2&&phase==='play'&&e.key>='1'&&e.key<='3')selectB(+e.key-1);
});
let swS=null;
function swStart(x,y){swS=[x,y];}
function swEnd(x,y){
  if(!swS)return;
  const dx=x-swS[0],dy=y-swS[1];swS=null;
  if(Math.abs(dx)<22&&Math.abs(dy)<22)return;
  const dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U');
  if(mode===1)tryMoveM1(dir);else tryMoveM2(dir);
}
stageEl.addEventListener('touchstart',e=>{swStart(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
stageEl.addEventListener('touchend',e=>{swEnd(e.changedTouches[0].clientX,e.changedTouches[0].clientY);},{passive:true});
stageEl.addEventListener('mousedown',e=>swStart(e.clientX,e.clientY));
stageEl.addEventListener('mouseup',e=>swEnd(e.clientX,e.clientY));
gridEl.addEventListener('click',e=>{
  if(mode===1){
    const h=e.target.closest('.pi');
    if(h&&phase==='transfer')pickPiece(+h.dataset.cell);
    return;
  }
  const pv=e.target.closest('.pvt');
  if(pv&&pv.dataset.b!==undefined&&phase==='play'){selectB(+pv.dataset.b);return;}
  const c=e.target.closest('.cell');
  if(c&&phase==='play'){
    const idx=cellEls.indexOf(c);
    const x=idx%W,y=(idx/W)|0;
    const bi=m2B.findIndex(s=>m2Cells(s).some(([cx,cy])=>cx===x&&cy===y));
    if(bi>=0)selectB(bi);
  }
});
$('menuBtn').addEventListener('click',showLevels);
$('lvlBtn').addEventListener('click',showLevels);
$('retryBtn').addEventListener('click',()=>loadLevel(level));
$('nextBtn').addEventListener('click',()=>loadLevel(level+1));

/* ================= test hooks ================= */
function applyTest(){
  const lv=+(Q.get('level')||1);
  const max=curMode===1?LEVELS.length:M2LEVELS.length;
  loadLevel(Math.min(Math.max(lv,1),max));
  if(curMode===1){
    if(TEST==='board'){
      const rec=[];
      solveGreedy(board,rec);
      if(rec.length&&rec[0].t==='pick')pickPiece(rec[0].cell);
    }
    else if(TEST==='win'){pMoves=par;doWinM1();}
    else if(TEST==='auto'){
      const rec=[];
      solveGreedy(board,rec);
      let k=0;
      const iv=setInterval(()=>{
        if(k>=rec.length||phase==='end'){clearInterval(iv);return;}
        const a=rec[k];
        if(a.t==='m'){if(phase==='play'&&!anim){tryMoveM1(a.dir);k++;}}
        else{if(phase==='transfer'){pickPiece(a.cell);k++;}}
      },300);
    }
  }else{
    if(TEST==='auto'){
      const toks=m2lv.sol.match(/\d[RLDU]/g)||[];
      let k=0;
      const iv=setInterval(()=>{
        if(k>=toks.length||phase==='end'){clearInterval(iv);return;}
        if(anim||phase!=='play')return;
        selectB(+toks[k][0]);
        tryMoveM2(toks[k][1]);
        k++;
      },300);
    }
  }
}

/* ================= boot ================= */
const th=Q.get('theme');
if(th)document.documentElement.dataset.theme=th;
const mq=+(Q.get('mode')||0);
if(mq===1||mq===2)curMode=mq;
if(TEST||Q.get('level'))applyTest();
else showLevels();
</script>
